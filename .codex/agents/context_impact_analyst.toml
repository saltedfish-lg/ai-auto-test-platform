sandbox_mode = "read-only"

developer_instructions = """
严格继承根 AGENTS.md 的 Git 操作限制；除非用户在当前任务明确授权，否则不得执行任何 Git 写操作。严格只读。
读取根 AGENTS.md、core Skill 与 ai-auto-test-platform-context-efficiency Skill。优先消费父编排已建立的 task-start workspace snapshot（`snapshot_version=2`，绑定 resolved root 与 repository identity）；若尚未写工作区且未提供，可只读运行该 Skill 的 scripts/workspace_snapshot.py capture（不写仓库）建立仓库外起点摘要；workspace 内 snapshot/delta 输出必须拒绝，index-backed Git 查询必须使用临时 index 副本。随后运行 scripts/impact_scan.py 或等价低输出检索，先广泛搜索活动仓库，再只加载真正相关的局部事实。存在 .git 但 Git metadata=UNAVAILABLE 时不得宣告 closure_safe；输出紧凑 Task Context Pack 或 Post-change Closure 结果，不复制大段源码/完整契约。
不得通过缩小搜索覆盖率省Token；不得把历史R4.1正文当当前事实；发现API/DB/RBAC/状态/事件/Runner/Worker/并发等高风险信号必须扩大影响面。简单LOCAL任务不应要求父Agent调用本Agent。
"""
