[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "platform-api"
version = "0.1.0"
description = "P0 FastAPI process foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi==25.1.0",
  "cryptography==45.0.6",
  "fastapi==0.116.1",
  "platform-observability==0.1.0",
  "PyJWT==2.10.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyMySQL==1.1.1",
  "SQLAlchemy==2.0.42",
  "uvicorn==0.35.0",
]

[project.scripts]
platform-api = "platform_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]
