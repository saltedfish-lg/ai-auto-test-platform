schema_version: 1
gates:
  authority_validators:
    command:
    - python
    - docs/authority/validation/run_all_validation.py
  governance_lite_validator:
    command:
    - python
    - tools/governance/governance_lite_validator.py
    - --root
    - .
  governance_contract_test:
    command:
    - python
    - tools/governance/governance_contract_test.py
    - --root
    - .
    timeout_seconds: 1800
  openapi_client_check:
    command:
    - python
    - tools/openapi_client.py
    - check
  backend_test:
    command:
    - python
    - -m
    - pytest
    - services/api/tests
    - -q
  frontend_test:
    command:
    - npm
    - run
    - test:web
  MODEL_CONFIGURATION_BROWSER_RUNTIME_GATE:
    command:
    - python
    - tools/gates/model_configuration_browser_gate.py
    timeout_seconds: 600
    execution_identity:
      capability: model_configuration_browser_acceptance
  playwright_test:
    command:
    - npm
    - --workspace
    - '@platform/web'
    - run
    - test:e2e
    execution_identity:
      capability: project_management_browser_acceptance
      runtime_environment_keys:
      - PLAYWRIGHT_BASE_URL
      - PLAYWRIGHT_TEST_FILE
      database_environment_keys:
      - ATP_PROJECT_E2E_CODE
  REAL_ACCEPTANCE_GATE:
    command:
    - npm
    - --workspace
    - '@platform/web'
    - run
    - test:e2e
    execution_identity:
      capability: task_specific_browser_acceptance
  runner_test:
    command:
    - python
    - -m
    - pytest
    - runner/agent/tests
    - -q
  worker_test:
    command:
    - python
    - -m
    - pytest
    - workers/scheduler/tests
    - workers/background/tests
    - -q
  code_quality_gate:
    command:
    - python
    - tools/governance/code_quality_gate.py
    - --root
    - .
    - --task-id
    - '{task_id}'
  database_environment_contract:
    command:
    - python
    - -m
    - pytest
    - tests/contract/test_database_environment.py
    - -q
  FLYWAY_MIGRATION_RUNTIME_GATE:
    command:
    - python
    - tools/gates/flyway_migration_gate.py
    timeout_seconds: 600
    execution_identity:
      capability: flyway_migration_runtime
