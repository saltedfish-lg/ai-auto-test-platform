version: 6
principle: SEARCH_BROAD_LOAD_NARROW_VERIFY_BROAD
correctness_over_token_budget: true
search_scope:
  # 缺失任一 required_roots 都使 scope 不完整，并禁止 IMPACT_CLOSURE_PASS。
  required_roots:
    - AGENTS.md
    - package.json
    - package-lock.json
    - pyproject.toml
    - requirements-dev.lock
    - .env.example
    - .editorconfig
    - .gitattributes
    - .gitignore
    - apps
    - services
    - workers
    - runner
    - packages
    - tests
    - tools
    - docs/baseline/CURRENT
  # optional_roots 存在时参与检索；缺失只记录，不阻断闭环。
  optional_roots:
    - db
    - .github
  # 治理目录默认不参与普通业务修改的全量 impact scan；Agent/Skill/Codex治理任务显式扩张。
  governance_roots:
    - .agents
    - .codex
  governance_scope_mode: conditional_expansion
  current_baseline_resolution: dynamic_from_current_marker
  large_file_strategy: stream_line_by_line_never_silent_skip
  fail_closed_on:
    - missing_required_root
    - unresolved_current_baseline
    - scan_error
    - git_metadata_unavailable_when_repository_present
    - snapshot_version_mismatch
    - snapshot_root_mismatch
    - snapshot_repository_mismatch
  exclude_runtime_noise:
    - .git
    - node_modules
    - dist
    - build
    - .venv
    - venv
    - __pycache__
    - .pytest_cache
    - .mypy_cache
    - .ruff_cache
    - test-results
  historical_baseline: on_demand
  git_workspace_strategy: read_only_metadata_with_fail_closed_evidence
  git_workspace_statuses:
    - COMPLETE
    - NOT_APPLICABLE
    - UNAVAILABLE
  git_metadata_required_by_default_for:
    - CROSS_MODULE
    - HIGH_RISK
  git_metadata_force_required_for:
    - ci
    - dependency
    - build
    - deploy
    - environment_config
    - engineering_tooling
context_pack:
  local_fingerprint: optional
  cross_module_fingerprint: required
  high_risk_fingerprint: required
  task_start_workspace_snapshot:
    snapshot_schema_version: 2
    formal_change_default: required_when_git_complete
    helper: scripts/workspace_snapshot.py
    capture_before_first_workspace_write: true
    snapshot_artifacts_outside_repository_required: true
    fingerprint_dirty_paths_by_content: true
    preserve_real_git_index_bytes: true
    git_index_strategy: temporary_GIT_INDEX_FILE_copy
    fail_closed_on_identity_mismatch: true
    identity_fields:
      - resolved_workspace_root
      - git_toplevel
      - git_common_dir
      - git_common_dir_file_id_when_available
  delta_refresh_on:
    - api_contract_change
    - database_change
    - permission_or_security_change
    - state_or_event_change
    - runner_worker_concurrency_change
    - newly_discovered_consumer
modes:
  LOCAL:
    subagent_default: false
    post_change_global_reverse_search: true
  CROSS_MODULE:
    impact_closure_required: true
    subagent: optional_when_context_unclear
  HIGH_RISK:
    impact_closure_required: true
    risk_escalation_required: true
    post_change_closure_required: true
completion_states:
  - IMPACT_CLOSURE_PASS
  - IMPACT_EXPANSION
  - BLOCKED_BY_PRODUCT_DECISION
  - BLOCKED_BY_ENVIRONMENT
  - BLOCKED_BY_INCOMPLETE_SCOPE
