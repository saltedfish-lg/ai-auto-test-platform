schema_version: 1
context_efficiency:
  mode: adaptive_context_loading
  governance_gate: false
  note: Context Efficiency is domain-agnostic; project-specific identity fields belong in this profile, not Runtime code.

context_loading:
  authority:
    strategy: precise_slice
    initial_records: 12
    preview_chars: 12000
    allow_on_demand_expand: true
    avoid_repeat_unchanged_read: true
  source_code:
    strategy: agent_tool_driven_symbol_first
    allow_full_file_when_required: true
    avoid_repeat_unchanged_read: true
  tests:
    strategy: agent_tool_driven_relevant_first
    allow_expand_when_required: true
    avoid_repeat_unchanged_read: true
  tool_output:
    strategy: diagnostic_projection_then_expand
    summary_chars: 4000
    allow_raw_expand_when_required: true
    avoid_repeat_unchanged_read: true
  deduplication:
    enabled: true
  context_history:
    enabled: true
  repo_intelligence_max_results: 20
  minimum_records_per_authority: 1
  minimum_records_per_domain: 1

authority_index:
  source_roots: [docs/authority]
  cache_path: .runtime/context-index/authority-index.sqlite3
  extensions: [.yaml, .yml, .json, .csv]
  exclude_patterns: ['**/.governance-domain.yaml']
  canonical_identity_keys: [record_id, canonical_id, structural_id, id]
  identity_strategies: {}

repo_intelligence:
  provider: none
  authority_role: forbidden
  max_results: 20
  include_paths: []
  exclude_paths: [docs/authority/**, .runtime/**, .git/**, .env*]
