idempotency_rules:
- idempotency_rule_id: IDEM-001
  operation: SYSTEM_INITIALIZE
  idempotency_key: platform_initialization_key
  scope: 对应业务对象或项目范围
  validity_period: null
  duplicate_same_parameters: 返回首次请求的稳定结果或当前处理状态
  same_key_different_parameters: IDEMPOTENCY_CONFLICT并拒绝
  completed_request_behavior: 返回已完成结果，不重复副作用
  failed_request_retry: 仅在失败状态允许使用新重试代次或按原键继续
  cleanup_rule: 不得早于业务追溯和重复投递窗口；具体周期由实现契约配置
