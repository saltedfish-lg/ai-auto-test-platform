rule_relationships:
- relationship_id: REL-R-001
  source_rule: REC-EXC-004..REC-EXC-010
  relationship_type: EXCEPTS
  target_rule: LEASE-001
  description: 人工录制不申请平台测试账号或SSO身份租约。
- relationship_id: REL-R-002
  source_rule: REC-EXC-012..REC-EXC-016
  relationship_type: DEPENDS_ON
  target_rule: LEASE-002
  description: 人工录制仍依赖Runner物理资源租约。
- relationship_id: REL-R-003
  source_rule: LOCK-002
  relationship_type: APPLIES_BEFORE
  target_rule: LEASE-001
  description: 正式执行先取得环境锁，再申请身份租约。
- relationship_id: REL-R-004
  source_rule: LEASE-001
  relationship_type: APPLIES_BEFORE
  target_rule: LEASE-002
  description: 身份租约通过后再占用Runner稀缺槽位。
- relationship_id: REL-R-005
  source_rule: RBIND-002
  relationship_type: DEPENDS_ON
  target_rule: LEASE-002
  description: 只有绑定当前项目的Runner可发放资源租约。
- relationship_id: REL-R-006
  source_rule: REL-003..REL-005
  relationship_type: REQUIRES_RELEASE_OF
  target_rule: LOCK-001..LOCK-002,LEASE-001..LEASE-003
  description: 取消、中止和异常必须释放锁和租约。
- relationship_id: REL-R-007
  source_rule: FR-001..FR-004
  relationship_type: OVERRIDES
  target_rule: 普通释放路径
  description: 仅异常和高风险授权条件下允许强制释放。
- relationship_id: REL-R-008
  source_rule: DLP-001
  relationship_type: APPLIES_BEFORE
  target_rule: 全部资源申请规则
  description: 统一获取顺序优先于具体资源申请。
- relationship_id: REL-R-009
  source_rule: IDEM-007..IDEM-020
  relationship_type: BLOCKS
  target_rule: 重复业务副作用
  description: 幂等记录阻止重复任务、结果、报告和制品副作用。
- relationship_id: REL-R-010
  source_rule: AI-CONF-001
  relationship_type: REFINES
  target_rule: BR-EXPLORE-0005
  description: 补齐AI探索冲突提示、权限和中止后的资源重新申请。
