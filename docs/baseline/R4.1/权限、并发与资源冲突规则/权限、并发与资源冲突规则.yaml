permission_inheritance_rules:
- rule_id: PIR-001
  rule: 多角色允许权限按并集合并，但每项权限仍必须与当前项目成员关系、数据范围、对象状态和敏感权限取交集。
  explicit_deny_overrides_allow: true
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- rule_id: PIR-002
  rule: 平台级角色不自动获得全部项目业务数据；跨项目访问必须引用明确项目ID集合，动态全部范围仅由独立高风险权限授予。
  explicit_deny_overrides_allow: true
  completion_status: DIRECTLY_SUPPORTED
- rule_id: PIR-003
  rule: 项目职责只能在对应项目内生效，不得提升平台级权限，也不得由主体为自己扩大范围。
  explicit_deny_overrides_allow: true
  completion_status: DIRECTLY_SUPPORTED
- rule_id: PIR-004
  rule: 菜单权限只控制入口可见；操作权限、接口权限和数据范围必须独立校验，后端不得信任前端隐藏。
  explicit_deny_overrides_allow: true
  completion_status: VALID_PERMISSION_COMPLETION
- rule_id: PIR-005
  rule: 权限撤销对新请求立即生效；已创建或运行任务使用创建时授权与配置快照继续到受控终止，但撤销后的人工控制操作按实时权限重新校验。
  explicit_deny_overrides_allow: true
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- rule_id: PIR-006
  rule: SUPER_ADMIN仅由内置admin持有，不可向其他用户或服务账号分配、转授或撤销。
  explicit_deny_overrides_allow: true
  completion_status: DIRECTLY_SUPPORTED
data_scope_rules:
- data_scope_rule_id: DSR-001
  scope_code: PLATFORM_ALL
  definition: 平台全部active数据及依法保留的history数据
  calculation_rule: 仅SUPER_ADMIN；敏感内容仍需独立权限和审计
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-002
  scope_code: PLATFORM_TECHNICAL
  definition: 平台技术配置、Runner、模型、工具和运行技术元数据
  calculation_rule: 平台管理员、模型管理员、Runner管理员按职责访问；不自动获得项目业务内容
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-003
  scope_code: AUTHORIZED_PROJECT_ACTIVE
  definition: 明确授权项目的活动对象
  calculation_rule: 项目角色仅在project_id和active_scope交集内读写
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-004
  scope_code: AUTHORIZED_PROJECT_HISTORY
  definition: 明确授权项目的历史只读对象
  calculation_rule: history_read_scope单独计算；不得据此恢复写权限
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-005
  scope_code: SPECIFIED_PROJECT_IDS
  definition: 跨项目明确ID集合
  calculation_rule: 具备跨项目授权管理权限者按明确ID授予和访问
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-006
  scope_code: DYNAMIC_ALL_PROJECTS
  definition: 当前及未来全部项目
  calculation_rule: 仅独立CROSS_PROJECT_AUTHORIZATION_GRANT_ALL高风险权限；必须审计
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-007
  scope_code: SELF_CREATED
  definition: 本人创建对象
  calculation_rule: 不能突破项目、状态和敏感数据边界
  completion_status: VALID_PERMISSION_COMPLETION
- data_scope_rule_id: DSR-008
  scope_code: SELF_INITIATED
  definition: 本人发起任务或录制会话
  calculation_rule: 可取消或控制本人对象；中止他人任务需更高权限
  completion_status: VALID_PERMISSION_COMPLETION
- data_scope_rule_id: DSR-009
  scope_code: REPORT_ACTIVE_HISTORY
  definition: 执行记录和报告
  calculation_rule: 查看范围由当前项目active_scope与history_read_scope动态派生
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-010
  scope_code: ARTIFACT_SEPARATE
  definition: 截图、视频、Trace和日志制品
  calculation_rule: 报告查看不自动授予制品查看、下载或分享
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-011
  scope_code: MANUAL_RECORDING_EVIDENCE
  definition: 人工录制证据
  calculation_rule: 除任务查看外还需MANUAL_RECORDING_VIEW；敏感内容脱敏
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-012
  scope_code: MODEL_TECHNICAL_METADATA
  definition: 模型调用技术元数据
  calculation_rule: 无项目范围时只允许脱敏技术元数据，不得通过外部可观测工具绕过平台
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-013
  scope_code: SENSITIVE_FIELD
  definition: 凭证、Token、Cookie、SSO身份及敏感上下文
  calculation_rule: 独立敏感权限、最小展示、脱敏、短期访问令牌和审计
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- data_scope_rule_id: DSR-014
  scope_code: ARCHIVED_OBJECT_HISTORY
  definition: 归档对象
  calculation_rule: 只读追溯，不允许新业务引用或状态写入
  completion_status: VALID_PERMISSION_COMPLETION
- data_scope_rule_id: DSR-015
  scope_code: REMOVED_MEMBER_HISTORY
  definition: 用户移出项目后的历史访问
  calculation_rule: 仅在明确history_read_scope保留时可读，否则立即拒绝
  completion_status: VALID_PERMISSION_COMPLETION
- data_scope_rule_id: DSR-016
  scope_code: SERVICE_IDENTITY_SCOPE
  definition: 系统服务身份
  calculation_rule: 仅访问任务、资源或服务职责所需对象，不得继承人工角色菜单范围
  completion_status: VALID_PERMISSION_COMPLETION
- data_scope_rule_id: DSR-017
  scope_code: INTERFACE_SCOPE_PARITY
  definition: 接口访问
  calculation_rule: 接口权限、对象数据范围和状态门禁必须与页面操作一致
  completion_status: VALID_PERMISSION_COMPLETION
- data_scope_rule_id: DSR-018
  scope_code: EXPORT_SCOPE
  definition: 导出与下载
  calculation_rule: 必须具有独立导出或下载权限，并在导出时重新校验范围、敏感字段和保留状态
  completion_status: VALID_PERMISSION_COMPLETION
sensitive_data_rules:
- sensitive_rule_id: SENS-001
  category: PLATFORM_CREDENTIAL
  examples:
  - password
  - token
  - api_key
  - secret
  sensitivity_level: SECRET
  storage_rule: 不得保存明文；仅保存Secret或密文引用
  masking_rule: 不回显原值
  log_rule: 日志禁止输出原值
  export_rule: 默认排除
  access_rule: 仅受控高风险权限
  completion_status: DIRECTLY_SUPPORTED
- sensitive_rule_id: SENS-002
  category: TEST_ACCOUNT
  examples:
  - account_identifier
  - credential_version
  sensitivity_level: RESTRICTED
  storage_rule: 账号与凭证分离
  masking_rule: 按最小必要原则展示
  log_rule: 日志脱敏
  export_rule: 受权限控制
  access_rule: 项目授权范围
  completion_status: DIRECTLY_SUPPORTED
- sensitive_rule_id: SENS-003
  category: SSO_IDENTITY
  examples:
  - sso_identity_key
  sensitivity_level: RESTRICTED
  storage_rule: 稳定身份键受控保存
  masking_rule: 默认掩码
  log_rule: 不输出完整值
  export_rule: 受限
  access_rule: 项目与安全权限
  completion_status: DIRECTLY_SUPPORTED
- sensitive_rule_id: SENS-004
  category: BUSINESS_CONTEXT
  examples:
  - order_no
  - barcode
  - id_card_no
  - ic_card_no
  - ticket_no
  sensitivity_level: RESTRICTED
  storage_rule: 仅按执行上下文需要保存
  masking_rule: 按类型脱敏
  log_rule: 日志和制品脱敏
  export_rule: 受限
  access_rule: 任务/项目范围
  completion_status: DIRECTLY_SUPPORTED
- sensitive_rule_id: SENS-005
  category: ARTIFACT_CONTENT
  examples:
  - screenshot
  - video
  - trace
  - network_log
  sensitivity_level: CONFIDENTIAL
  storage_rule: 制品存储与元数据分离
  masking_rule: 生成或展示阶段脱敏
  log_rule: 索引不暴露敏感内容
  export_rule: 权限校验后下载
  access_rule: 项目与报告权限
  completion_status: DIRECTLY_SUPPORTED
- sensitive_rule_id: SENS-006
  category: AI_PAYLOAD
  examples:
  - prompt_content
  - request_summary
  - response_summary
  sensitivity_level: CONFIDENTIAL
  storage_rule: 仅保留审计所需摘要
  masking_rule: 敏感内容脱敏
  log_rule: 禁止输出Secret
  export_rule: 受限
  access_rule: 模型管理与审计权限
  completion_status: DIRECTLY_SUPPORTED
