roles:
- role_id: ROLE-SUPER-ADMIN
  role_name: 超级管理员
  role_type: SYSTEM_PRESET
  purpose: 完成平台初始化、全局治理、跨项目管理和受控高风险操作。
  scope: PLATFORM_ALL
  allowed_operations:
  - 访问全部菜单和全部项目数据
  - 平台级用户、角色、权限和安全治理
  - 跨项目授权
  - Runner、模型、工具与系统配置治理
  prohibited_operations:
  - 不得删除、停用、归档admin或移除其SUPER_ADMIN绑定
  - 其他USER或SERVICE_ACCOUNT不得绑定SUPER_ADMIN
  data_scope: 平台全部active数据和依法保留的history数据；高风险操作仍必须审计。
  authorization_capability: 可在平台和项目授权上限内授权；SUPER_ADMIN例外行为必须审计
  cross_project_capability: FULL
  sensitive_data_access: 按独立敏感权限和审计规则访问，不等同于免审计
  high_risk_operations:
  - 跨项目CROSS_PROJECT_AUTHORIZATION_GRANT_ALL
  - 系统级安全与配置
  - 受控制品提前清理
  - 角色和权限治理
  assignment_rule: 系统初始化时仅绑定内置admin；不得向其他主体分配
  revocation_rule: 不可撤销
  lifecycle: 随平台存在；admin不可删除、停用、归档或解除绑定
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
- role_id: ROLE-PLATFORM-ADMIN
  role_name: 平台管理员
  role_type: SYSTEM_PRESET
  purpose: 维护平台级配置与技术资源，并在明确授权范围内处理跨项目事务。
  scope: PLATFORM_MANAGED_SCOPES
  allowed_operations:
  - 维护平台配置
  - 管理Runner和模型
  - 按明确对象ID进行跨项目授权
  - 具备附加权限时治理平台资产推广
  prohibited_operations:
  - 不得默认授予动态全部项目范围
  - 不得因平台角色自动获得全部项目业务数据
  - 不得在无源项目完整范围时操作平台资产推广
  data_scope: 平台技术数据；项目业务数据按明确项目ID或附加CROSS_PROJECT_AUTHORIZATION_GRANT_ALL权限获得
  authorization_capability: 具备CROSS_PROJECT_AUTHORIZATION_MANAGE时仅按明确ID授权；另具CROSS_PROJECT_AUTHORIZATION_GRANT_ALL方可动态全部
  cross_project_capability: SPECIFIED_IDS_OR_EXPLICIT_CROSS_PROJECT_AUTHORIZATION_GRANT_ALL
  sensitive_data_access: 按独立凭证、日志、制品和项目范围权限
  high_risk_operations:
  - 跨项目授权
  - Runner绑定/升级
  - 模型和系统配置发布
  assignment_rule: 由SUPER_ADMIN或具备角色授权权限的主体分配
  revocation_rule: 停用/归档角色或结束角色绑定；保留历史授权快照
  lifecycle: ENABLED/DISABLED/ARCHIVED；禁止物理删除
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
- role_id: ROLE-PROJECT-FUNCTION-ADMIN
  role_name: 项目功能管理员
  role_type: SYSTEM_PRESET
  purpose: 维护项目、环境、终端、账号、测试数据、自动化资产和项目执行配置。
  scope: AUTHORIZED_PROJECTS
  allowed_operations:
  - 维护授权项目配置
  - 在权限与数据范围内管理项目资产
  prohibited_operations:
  - 不得为自己提权
  - 无项目负责人或跨项目授权资格时不得授予全项目范围或成员管理能力
  - 不得操作未授权项目
  data_scope: 指定项目及七个项目数据子范围的active/history范围
  authorization_capability: 仅可转授本人拥有且允许转授的职责和范围
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 测试账号、凭证和敏感数据需独立权限
  high_risk_operations:
  - 项目配置发布
  - 环境/终端/账号停用与归档
  assignment_rule: 由项目负责人或具备平台跨项目授权权限者在项目成员入口分配
  revocation_rule: 撤销项目成员职责或数据范围；活动任务按快照继续、实时操作立即受限
  lifecycle: 随系统角色绑定和项目成员关系生效
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
- role_id: ROLE-TEST-LEAD
  role_name: 测试负责人
  role_type: SYSTEM_PRESET
  purpose: 确保测试资产、执行计划、正式执行和结果分析形成闭环。
  scope: AUTHORIZED_PROJECTS
  allowed_operations:
  - 组织测试资产和计划
  - 分析执行结果
  - 按授权审批录制使用范围与并发风险
  - 按授权查看或停止项目录制任务
  prohibited_operations:
  - 不得越过独立版本审核入口直接发布需审核资产
  - 不得操作未授权项目或敏感数据
  data_scope: 授权项目的测试资产、执行和报告范围
  authorization_capability: 项目内按被授予的成员管理和转授权能力
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 账号、变量、日志、制品按独立权限和脱敏策略
  high_risk_operations:
  - 停止他人录制任务
  - 执行计划启停
  - 项目范围内高风险测试操作
  assignment_rule: 由项目负责人或授权管理员分配系统角色与项目职责
  revocation_rule: 撤销绑定或项目职责；历史执行与报告仍按history_read_scope判断
  lifecycle: 随角色绑定和项目成员关系生效
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
- role_id: ROLE-CASE-DESIGNER
  role_name: 用例设计人员
  role_type: SYSTEM_PRESET
  purpose: 把测试意图转化为可审核、可发布、可执行的标准结构用例资产。
  scope: AUTHORIZED_PROJECTS
  allowed_operations:
  - 创建自然语言与标准结构用例
  - 发起结构转换、页面探索、人工录制、结构化和验证
  - 维护本人USER模型凭证
  prohibited_operations:
  - 不得绕过版本审核直接发布需要审核的正式版本
  - 不得维护他人凭证
  - 不得操作未授权项目
  data_scope: 授权项目的用例、AI任务、录制和相关资产范围
  authorization_capability: 无平台级授权；项目范围由项目负责人或管理员授予
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 仅本人凭证；录制中人工输入身份不成为平台账号事实
  high_risk_operations:
  - 启动人工录制
  - 发起AI探索
  - 提交版本审核
  assignment_rule: 由管理员分配并建立项目成员数据范围
  revocation_rule: 撤销角色绑定或项目范围
  lifecycle: 随角色绑定和项目成员关系生效
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
- role_id: ROLE-ASSET-REVIEWER
  role_name: 用例与资产版本审核人员
  role_type: SYSTEM_PRESET
  purpose: 落实资产版本职责分离和正式发布门禁。
  scope: AUTHORIZED_PROJECTS_AND_ASSET_TYPES
  allowed_operations:
  - 审核、驳回、发布、停用和归档被授权资产版本
  prohibited_operations:
  - 不得审核未覆盖项目或资产类型
  - 不得使用通用审核入口替代独立发布入口
  - SERVICE_ACCOUNT不得承担审核或发布
  data_scope: 明确授权项目、资产类型和版本范围
  authorization_capability: 无默认转授权
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 仅审核所需数据；凭证和敏感变量需独立权限
  high_risk_operations:
  - 正式版本发布、停用、归档
  assignment_rule: 由管理员分配独立审核角色和项目范围
  revocation_rule: 撤销后不得处理新审核，历史决定永久保留
  lifecycle: 随角色绑定和项目范围生效
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
- role_id: ROLE-TASK-EXECUTOR
  role_name: 任务执行人员
  role_type: SYSTEM_PRESET
  purpose: 在授权项目内发起受控执行并查看对应结果。
  scope: AUTHORIZED_PROJECTS_AND_PLANS
  allowed_operations:
  - 创建单次任务
  - 使用授权执行计划
  - 正式执行时按权限显式更换受管账号映射
  - 具备录制权限时控制本人录制会话
  prohibited_operations:
  - 不得直接发布生成用例
  - 人工录制不提供账号选择且不得声称识别手工输入身份
  - 不得操作未授权计划或项目
  data_scope: 授权项目、用例/套件、计划、账号映射和结果范围
  authorization_capability: 无默认授权能力
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 测试账号和制品按独立权限；录制不预知手工输入凭证
  high_risk_operations:
  - 发起正式执行
  - 取消本人任务
  - 控制本人录制会话
  assignment_rule: 由管理员分配角色、项目、计划和数据范围
  revocation_rule: 撤销实时发起权限；已创建任务按授权快照处理
  lifecycle: 随角色绑定和项目范围生效
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
- role_id: ROLE-REPORT-VIEWER
  role_name: 报告查看人员
  role_type: SYSTEM_PRESET
  purpose: 读取执行记录、报告和经授权的制品证据。
  scope: AUTHORIZED_PROJECTS_ACTIVE_AND_HISTORY
  allowed_operations:
  - 查看授权范围报告
  - 具备独立权限时查看/下载制品或分享报告
  prohibited_operations:
  - 不得因REPORT_VIEW自动下载制品或分享报告
  - 不得查看超出active/history范围的报告
  - 人工录制证据需额外MANUAL_RECORDING_VIEW
  data_scope: 动态派生的active_scope与history_read_scope
  authorization_capability: 无默认授权能力
  cross_project_capability: 仅明确授权项目
  sensitive_data_access: 按制品、日志、录制和脱敏权限独立控制
  high_risk_operations:
  - 报告分享、制品下载（均需独立权限）
  assignment_rule: 由管理员分配角色及项目active/history范围
  revocation_rule: 当前访问立即重算；历史报告按history_read_scope处理
  lifecycle: 随角色绑定和范围生效
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
- role_id: ROLE-MODEL-ADMIN
  role_name: 模型管理员
  role_type: SYSTEM_PRESET
  purpose: 保障AI模型接入、路由、配置、凭证和运行可观测性。
  scope: PLATFORM_MODEL_CONFIGURATION_AND_AUTHORIZED_PROJECT_DATA
  allowed_operations:
