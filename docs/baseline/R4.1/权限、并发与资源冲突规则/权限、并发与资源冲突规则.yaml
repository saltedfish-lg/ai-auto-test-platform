decisions:
- decision_id: AC-ADR-001
  title: 正式执行临时身份并发键
  status: ACCEPTED
  final_decision: 在尚未确认跨终端统一认证域前，使用project_id+environment_id+sso_identity_key；业务系统/终端信息保留在租约上下文用于诊断。
  completion_status: VALID_DERIVATION
- decision_id: AC-ADR-002
  title: 环境锁与身份租约分离
  status: ACCEPTED
  final_decision: 环境锁、身份租约、Runner资源租约和任务租约分别建模，不合并为通用锁。
  completion_status: VALID_DERIVATION
- decision_id: AC-ADR-003
  title: 人工录制并发例外
  status: ACCEPTED
  final_decision: 人工录制不检查平台账号/身份占用和环境业务占用，但必须检查Runner项目绑定和物理资源，禁止抢占。
  completion_status: VALID_DERIVATION
- decision_id: AC-ADR-004
  title: 资源获取顺序
  status: ACCEPTED
  final_decision: 权限/范围→状态/版本→环境锁→身份租约→Runner匹配→Runner资源租约→任务所有权→会话→模型工具→制品上传。
  completion_status: VALID_DERIVATION
- decision_id: AC-ADR-005
  title: 强制释放后的写隔离
  status: ACCEPTED
  final_decision: 任何过期、撤销或强制释放都生成新fencing世代，旧持有者结果不成为权威事实。
  completion_status: VALID_DERIVATION
- decision_id: AC-ADR-006
  title: 历史报告权限
  status: ACCEPTED
  final_decision: 当前访问按active_scope与history_read_scope动态派生；任务授权快照用于审计，不永久覆盖当前访问权限。
  completion_status: VALID_DERIVATION
- decision_id: AC-ADR-007
  title: 抢占策略
  status: ACCEPTED
  final_decision: 默认禁止无条件抢占；仅有权限主体通过取消/中止已有任务并等待资源释放。
  completion_status: VALID_DERIVATION
