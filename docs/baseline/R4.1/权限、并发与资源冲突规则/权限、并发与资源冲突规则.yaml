queue_rules:
- queue_rule_id: QUEUE-001
  queue_scope: 项目+资源类型
  ordering_rule: 默认按入队时间FIFO；当前基线未冻结跨项目优先级和具体权重
  priority_supported: false
  cancel_supported: true
  pre_acquire_resources: false
  max_wait: null
  timeout_result: WAIT_TIMEOUT
  revalidation: 出队前重新校验权限、项目状态、对象版本、锁、身份和Runner能力
  completion_status: VALID_RESOURCE_COMPLETION
- queue_rule_id: QUEUE-002
  queue_scope: Runner资源
  ordering_rule: 项目内按入队时间和能力匹配处理；Runner变化时重新匹配
  priority_supported: false
  cancel_supported: true
  pre_acquire_resources: false
  max_wait: null
  timeout_result: RUNNER_RESOURCE_WAIT_TIMEOUT
  revalidation: 出队前不沿用旧Runner匹配结果
  completion_status: VALID_RESOURCE_COMPLETION
- queue_rule_id: QUEUE-003
  queue_scope: 环境锁
  ordering_rule: 同一环境资源键顺序等待；不得持有身份或Runner资源等待环境锁
  priority_supported: false
  cancel_supported: true
  pre_acquire_resources: false
  max_wait: null
  timeout_result: ENVIRONMENT_LOCK_WAIT_TIMEOUT
  revalidation: 重新检查环境状态与锁模式兼容性
  completion_status: VALID_CONCURRENCY_COMPLETION
- queue_rule_id: QUEUE-004
  queue_scope: 身份租约
  ordering_rule: 同一身份键顺序等待；不得在排队阶段长期占用Runner槽位
  priority_supported: false
  cancel_supported: true
  pre_acquire_resources: false
  max_wait: null
  timeout_result: IDENTITY_LEASE_WAIT_TIMEOUT
  revalidation: 重新检查账号/身份有效性与任务权限
  completion_status: VALID_CONCURRENCY_COMPLETION
- queue_rule_id: QUEUE-005
  queue_scope: 模型额度
  ordering_rule: 按模型路由队列处理；可使用已配置替代模型，不虚构额度值
  priority_supported: false
  cancel_supported: true
  pre_acquire_resources: false
  max_wait: null
  timeout_result: MODEL_QUOTA_WAIT_TIMEOUT
  revalidation: 重新检查模型配置、路由和AI任务取消状态
  completion_status: VALID_RESOURCE_COMPLETION
resource_acquisition_order:
- order: 1
  resource: 权限和数据范围
  rule: 在申请任何稀缺资源前完成；失败立即拒绝。
- order: 2
  resource: 对象状态和版本
  rule: 校验项目、环境、用例版本、计划、任务和配置快照有效性。
- order: 3
  resource: 环境锁
  rule: 需要时先申请SHARED或EXCLUSIVE；失败不得继续占用身份或Runner资源。
- order: 4
  resource: 测试账号或SSO身份租约
  rule: 仅正式执行和按探索规则需要时申请；人工录制不申请。
- order: 5
  resource: Runner匹配
  rule: 校验项目独占绑定、在线健康和能力。
- order: 6
  resource: Runner资源租约
  rule: 申请浏览器/会话/采集/容量槽位；不可只看Runner在线状态。
- order: 7
  resource: 任务执行所有权
  rule: 为具体task/attempt建立唯一执行者与fencing token。
- order: 8
  resource: 浏览器或录制会话
  rule: 由唯一attempt、AI探索或录制会话持有。
- order: 9
  resource: 模型或工具调用资源
  rule: 在实际调用前获取；限流不得无必要长期占用Runner。
- order: 10
  resource: 制品上传资源
  rule: 执行产生制品后按存储键幂等上传；不阻止先释放环境和身份资源。
timeout_rules:
- timeout_rule_id: TO-001
  target: 环境锁等待
  duration: null
  on_timeout: 返回ENVIRONMENT_LOCK_CONFLICT并释放已获取的前序资源
  config_source: 容量和吞吐基线待决策
- timeout_rule_id: TO-002
  target: 身份租约等待
  duration: null
  on_timeout: 返回IDENTITY_LEASE_CONFLICT；可取消、稍后重试或改用其他授权身份
  config_source: 容量和吞吐基线待决策
- timeout_rule_id: TO-003
  target: Runner资源等待
  duration: null
  on_timeout: 返回RUNNER_RESOURCE_EXHAUSTED；允许其他Runner匹配或取消
  config_source: 容量和吞吐基线待决策
- timeout_rule_id: TO-004
  target: 任务租约续期
  duration: null
  on_timeout: fence旧执行者并进入异常恢复或重新调度
  config_source: Runner和调度契约待细化
- timeout_rule_id: TO-005
  target: 人工录制控制连接
  duration: null
  on_timeout: 进入可恢复断开窗口；超出窗口释放会话资源
  config_source: 录制恢复决策待细化
- timeout_rule_id: TO-006
  target: 模型或工具调用
  duration: null
  on_timeout: 按已配置重试/降级或明确失败，不改变正式业务事实
  config_source: 模型/工具配置
renewal_rules:
- renewal_rule_id: REN-001
  target: 环境锁
  renewal: 由任务心跳续期并更新fencing token；续期失败进入资源丢失处理
- renewal_rule_id: REN-002
  target: 身份租约
  renewal: 由根执行任务续期，重试attempt不得创建并行身份租约
- renewal_rule_id: REN-003
  target: Runner资源租约
  renewal: Runner Agent资源心跳续期；平台状态Owner决定是否仍有效
- renewal_rule_id: REN-004
  target: 任务执行租约
  renewal: 执行进度和Runner心跳续期；旧令牌永不恢复有效
- renewal_rule_id: REN-005
  target: 录制控制租约
  renewal: 用户控制连接心跳续期；断开后进入受控恢复窗口
release_rules:
- release_rule_id: REL-001
  trigger: 正常完成
  release_order: 浏览器/录制会话→任务租约→Runner资源租约→身份租约→环境锁
  result: 固化结果后逆序释放，报告和制品异步继续
- release_rule_id: REL-002
  trigger: 失败
  release_order: 停止副作用并逆序释放；保留失败attempt和制品
  result: 允许按规则创建新attempt，不复用旧fencing
- release_rule_id: REL-003
  trigger: 用户取消
  release_order: 取消命令幂等；等待Runner确认或超时后fence并回收
  result: 任务进入取消终态，旧执行者不得继续提交
- release_rule_id: REL-004
  trigger: 平台中止
  release_order: 记录原因、通知Runner、fence旧令牌、逆序释放
  result: 中止为高风险操作并审计
- release_rule_id: REL-005
  trigger: 异常或超时
  release_order: 回收器按owner、expires_at和fencing token处理残留
  result: 必要时重新调度或进入人工介入
- release_rule_id: REL-006
  trigger: 人工录制断开
  release_order: 保留恢复窗口时继续占用必要录制资源；窗口结束后释放
  result: 不得申请或释放不存在的账号身份租约
force_release_rules:
- force_release_rule_id: FR-001
  target: 环境锁
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-PLATFORM-ADMIN
  preconditions:
  - 持有者失联、终态但残留或明确异常证据
  - 二次确认
  - 记录原因
  after_action: 生成新fencing世代，旧任务写入全部拒绝
  audit: true
- force_release_rule_id: FR-002
  target: 身份租约
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-PLATFORM-ADMIN
  preconditions:
  - 持有任务已终止或失联且恢复策略确认
  - 二次确认
  after_action: 标记FENCED/RELEASED；旧任务不得提交权威结果
  audit: true
- force_release_rule_id: FR-003
  target: Runner资源租约
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-RUNNER-ADMIN
  - ROLE-PLATFORM-ADMIN
  preconditions:
  - Runner失联、会话不可恢复或异常残留
  - 二次确认
  after_action: 清理资源占用并fence旧会话
  audit: true
- force_release_rule_id: FR-004
  target: 录制控制租约
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-TEST-LEAD
  preconditions:
  - 本人会话异常或具备停止他人录制权限
  - 记录原因
  after_action: 进入可恢复或中止状态并释放控制权
  audit: true
deadlock_prevention_rules:
- rule_id: DLP-001
  rule: 所有正式执行按统一资源获取顺序申请；任何失败按相反顺序释放。
- rule_id: DLP-002
  rule: 等待环境锁时不得持有身份租约或Runner资源；等待身份租约时不得持有Runner槽位。
- rule_id: DLP-003
  rule: Runner匹配不等于资源占用；只有原子获取资源租约后才计入占用。
- rule_id: DLP-004
  rule: 锁和租约必须有owner、expires_at、fencing token和回收器，不允许永久无主记录。
- rule_id: DLP-005
  rule: 强制释放或租约过期后必须提升fencing世代，阻止旧任务继续写入。
- rule_id: DLP-006
  rule: 任务、报告和制品操作均使用幂等键，重复投递不得创建第二个权威结果。
- rule_id: DLP-007
  rule: 排队期不提前占用非必要稀缺资源，唤醒时重新校验全部前置条件。
- rule_id: DLP-008
  rule: 人工录制只豁免账号和环境业务占用前置判断，不豁免平台权限、Runner绑定和物理容量。
recovery_rules:
- recovery_rule_id: REC-001
  event: 环境锁等待超时
  state: WAITING_LOCK
  behavior: 释放前序资源；允许重新排队或取消；记录超时
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-002
  event: 身份租约等待超时
  state: WAITING_IDENTITY
  behavior: 释放环境锁或按原子申请回滚；允许其他账号
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-003
  event: Runner资源等待超时
  state: WAITING_RUNNER
  behavior: 重新匹配Runner或取消；不保留身份/环境资源
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-004
  event: Runner失联
  state: RUNNER_LOST
  behavior: 停止续期并fence旧Runner；回收资源，任务进入恢复/重调度
  retry_allowed: true
  manual_intervention: true
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-005
  event: 调度器失联
  state: SCHEDULER_UNAVAILABLE
  behavior: 任务租约到期后由新调度owner恢复；禁止双调度
  retry_allowed: true
  manual_intervention: true
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-006
  event: 浏览器崩溃
  state: BROWSER_CRASHED
  behavior: 结束当前attempt，采集可得制品，释放会话并按重试规则处理
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-007
  event: 人工录制连接断开
  state: RECORDING_DISCONNECTED
  behavior: 保留恢复点和受控恢复窗口；窗口结束释放资源
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-008
  event: 任务取消未完成
  state: CANCEL_PENDING
  behavior: 超时后中止并fence旧执行者
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-009
  event: 任务中止未完成
  state: ABORT_PENDING
  behavior: 强制fence并回收资源，进入人工介入若Runner仍失联
  retry_allowed: true
  manual_intervention: true
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-010
  event: 租约续期失败
  state: LEASE_RENEW_FAILED
  behavior: 租约失效；持有者不得继续提交权威结果
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-011
  event: 锁记录残留
  state: ORPHAN_LOCK
  behavior: 回收器验证owner终态/失联后释放并审计
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-012
  event: 制品上传残留
  state: ARTIFACT_UPLOAD_STALE
  behavior: 按存储键和哈希幂等补传；不重复生成元数据
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-013
  event: 报告生成残留
  state: REPORT_BUILD_STALE
  behavior: 按任务+报告版本幂等重建，不改写执行事实
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-014
  event: 模型调用超时
  state: MODEL_TIMEOUT
  behavior: 按配置重试或降级；释放不必要Runner资源
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-015
  event: 外部工具限流
  state: TOOL_RATE_LIMITED
  behavior: 等待、退避或明确失败，不覆盖业务终态
  retry_allowed: true
  manual_intervention: false
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
- recovery_rule_id: REC-016
  event: 强制释放后旧持有者恢复
  state: FENCED_OWNER_RETURNED
  behavior: 拒绝旧fencing token的所有状态和结果写入
  retry_allowed: false
  manual_intervention: true
  audit_required: true
  completion_status: VALID_RESOURCE_COMPLETION
artifact_conflict_rules:
- rule_id: ART-CONF-001
  condition: 同一任务和报告版本重复生成
  key: task_id+report_version
  strategy: RETURN_EXISTING_OR_REBUILD_FAILED_VERSION_ONLY
  authorized_roles:
  - SYS-REPORT-SERVICE
  - SYS-ARTIFACT-SERVICE
  audit_required: true
  completion_status: VALID_CONFLICT_COMPLETION
- rule_id: ART-CONF-002
  condition: 报告生成时任务结果仍在更新
  key: task_id+result_revision
  strategy: WAIT_FOR_RESULT_SNAPSHOT_OR_GENERATE_NEW_REPORT_VERSION
  authorized_roles:
  - SYS-REPORT-SERVICE
  - SYS-ARTIFACT-SERVICE
  audit_required: true
  completion_status: VALID_CONFLICT_COMPLETION
- rule_id: ART-CONF-003
  condition: 同一制品重复上传
  key: artifact_storage_key+content_hash
  strategy: IDEMPOTENT_ACCEPT
  authorized_roles:
  - SYS-REPORT-SERVICE
  - SYS-ARTIFACT-SERVICE
  audit_required: true
  completion_status: VALID_CONFLICT_COMPLETION
- rule_id: ART-CONF-004
  condition: 制品上传与清理并发
  key: artifact_id
  strategy: UPLOAD_OR_HOLD_WINS_BEFORE_CLEANUP_COMMIT
  authorized_roles:
  - ROLE-SUPER-ADMIN
  audit_required: true
  completion_status: VALID_CONFLICT_COMPLETION
- rule_id: ART-CONF-005
  condition: 长期保留标记与自动清理并发
  key: artifact_id+retention_revision
  strategy: LONG_TERM_HOLD_OVERRIDES_CLEANUP
  authorized_roles:
  - ROLE-SUPER-ADMIN
  audit_required: true
  completion_status: VALID_CONFLICT_COMPLETION
- rule_id: ART-CONF-006
  condition: 下载与物理清理并发
  key: artifact_id+access_token
  strategy: DEFER_CLEANUP_UNTIL_ACTIVE_ACCESS_FINISHES_OR_REJECT_NEW_DOWNLOAD_AFTER_COMMIT
  authorized_roles:
  - ROLE-SUPER-ADMIN
  audit_required: true
  completion_status: VALID_CONFLICT_COMPLETION
- rule_id: ART-CONF-007
  condition: 项目归档与制品清理
  key: project_id+archive_generation
  strategy: ARCHIVE_POLICY_RECALCULATES_RETENTION_BEFORE_CLEANUP
  authorized_roles:
  - ROLE-SUPER-ADMIN
  audit_required: true
  completion_status: VALID_CONFLICT_COMPLETION
- rule_id: ART-CONF-008
  condition: 提前清理与审计保留冲突
  key: artifact_id+audit_hold
  strategy: REJECT_EARLY_CLEANUP
  authorized_roles:
  - ROLE-SUPER-ADMIN
  audit_required: true
  completion_status: VALID_CONFLICT_COMPLETION
model_tool_resource_rules:
- rule_id: MTR-001
  resource: MODEL_QUOTA
  rule: 模型并发和额度按模型配置、路由和供应方响应控制；当前基线不冻结具体数值。
  conflict_strategy: QUEUE_OR_WAIT_WITH_TIMEOUT_OR_CONFIGURED_DEGRADE
  blocks:
  - 自然语言转换
  - AI探索中的模型决策
  does_not_block:
  - 人工录制本身
  - 已进入浏览器执行且不再需要模型的正式步骤
  completion_status: DIRECTLY_SUPPORTED
- rule_id: MTR-002
  resource: TOOL_CAPACITY
  rule: 工具连接容量、限流和健康状态独立于Runner资源；不可用时只影响依赖该工具的步骤。
  conflict_strategy: WAIT_WITH_TIMEOUT_OR_DEGRADE_OR_FAIL_EXPLICITLY
  blocks:
  - 依赖工具的AI或运行流程
  does_not_block:
  - 无该工具依赖的业务流程
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- rule_id: MTR-003
  resource: MODEL_ROUTE
  rule: 调用前固化模型配置和路由快照；配置变更不改写已创建AI任务。
  conflict_strategy: CAS_REJECT_STALE_CONFIGURATION
  blocks:
  - 配置不完整的新调用
  does_not_block:
  - 历史调用记录和已固化任务追溯
  completion_status: DIRECTLY_SUPPORTED
