ai_exploration_conflict_rules:
- rule_id: AI-CONF-001
  condition: AI探索使用的项目、环境、系统或已配置身份与活动正式任务冲突
  default_strategy: PROMPT_USER
  authorized_deciders:
  - 具有AI探索发起权限且同时具有目标正式任务中止权限的用户
  - 项目测试负责人
  - SUPER_ADMIN
  no_abort_permission_behavior: 不得显示可确认中止动作；允许等待、取消新探索或更换账号/Runner
  abort_failure_behavior: 保留新探索为WAITING_RESOURCE或取消；不得在旧任务未终止前取得冲突资源
  after_abort_behavior: 确认旧任务终止并释放锁租约后重新执行全部权限、状态和资源校验
  audit: 记录提示对象、决策人、中止权限、结果和资源重新申请
  completion_status: VALID_CONFLICT_COMPLETION
- rule_id: AI-CONF-002
  condition: Runner能力匹配但资源不足
  default_strategy: QUEUE_OR_USE_ALTERNATIVE_RESOURCE
  authorized_deciders:
  - AI探索发起者
  no_abort_permission_behavior: 不适用
  abort_failure_behavior: 不适用
  after_abort_behavior: 队列唤醒时重新校验项目、环境、账号和模型可用性
  audit: 记录队列、等待、超时和替代Runner
  completion_status: VALID_RESOURCE_COMPLETION
- rule_id: AI-CONF-003
  condition: 模型额度、超时或限流
  default_strategy: WAIT_WITH_TIMEOUT_OR_DEGRADE
  authorized_deciders:
  - 系统按已配置路由执行
  - 模型管理员管理配置
  no_abort_permission_behavior: 不适用
  abort_failure_behavior: 进入明确失败或等待，不占用不必要Runner资源
  after_abort_behavior: 重试时使用独立AI调用attempt和幂等键
  audit: 记录供应方、路由、限流或降级结果，不记录未脱敏凭证
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
