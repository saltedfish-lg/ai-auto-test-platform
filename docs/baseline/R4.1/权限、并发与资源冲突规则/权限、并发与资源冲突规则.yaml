  assignment_rule: 由SUPER_ADMIN或有权管理员分配
  revocation_rule: 撤销后停止新配置操作，历史版本与审计保留
  lifecycle: 随角色绑定生效
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
