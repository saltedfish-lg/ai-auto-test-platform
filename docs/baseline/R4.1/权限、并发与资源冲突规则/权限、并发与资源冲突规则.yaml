  role_name: 模型版本审核人员
  role_type: SYSTEM_PRESET
  purpose: 落实模型版本发布职责分离和受控变更。
  scope: PLATFORM_MODEL_VERSION_REVIEW
  allowed_operations:
  - 审核、驳回、发布、停用和归档模型相关版本
  prohibited_operations:
  - 不得因项目模型数据范围自动获得审核权限
  - 不得以模型管理员权限替代独立审核角色
  data_scope: 平台级模型版本审核范围；项目业务内容仍按项目数据权限
  authorization_capability: 无默认授权能力
  cross_project_capability: PLATFORM_REVIEW_SCOPE
  sensitive_data_access: 审核所需内容；凭证明文和项目数据需独立权限
  high_risk_operations:
  - 模型配置、路由、Prompt正式发布/停用/归档
  assignment_rule: 由SUPER_ADMIN或有权管理员单独分配
  revocation_rule: 撤销后不得处理新审核，历史决定保留
  lifecycle: 随角色绑定生效
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
- role_id: ROLE-PROJECT-OWNER-DUTY
  role_name: 项目负责人
  role_type: PROJECT_DUTY
  purpose: 确保项目始终存在合格负责人，并在项目范围内完成成员、职责和七个数据子范围治理。
  scope: OWNED_PROJECTS
  allowed_operations:
  - 在负责项目内授予符合授权上限的动态全部范围
  - 管理项目成员
  - 变更项目负责人
  - 维护项目配置
  prohibited_operations:
  - 不得操作非负责项目
  - SERVICE_ACCOUNT不得成为项目负责人
  - 不得在新负责人资格和范围未原子完成前移除最后一名旧负责人
  data_scope: 负责项目七个子范围active=ALL、history=ALL
  authorization_capability: 可在负责项目内授予符合项目授权上限的职责与范围
  cross_project_capability: OWNED_PROJECTS_ONLY
  sensitive_data_access: 仍需相应系统权限和敏感数据权限
  high_risk_operations:
  - 项目成员与授权管理
  - 项目负责人变更
  - 授予项目内ALL范围
  assignment_rule: 项目创建时仅USER可成为首个负责人；必须具备PROJECT_OWNER_ELIGIBLE及相关权限
  revocation_rule: 正常变更必须先原子指定合格新负责人；无候选且最后一名负责人将失效时，由SUPER_ADMIN受控指定合格USER并写入应急审计，不创建虚拟负责人。
  lifecycle: 依附项目成员关系；负责人失效或退出前完成交接，紧急无人接任时执行SUPER_ADMIN应急托管流程。
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
