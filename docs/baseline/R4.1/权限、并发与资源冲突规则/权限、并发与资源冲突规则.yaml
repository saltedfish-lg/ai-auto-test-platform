  key_expression: operation_type+business_scope+client_idempotency_key
  usage: 由相关并发规则引用
- concurrency_key_id: CK-003
  key_expression: platform_initialization_key
  usage: 由相关并发规则引用
- concurrency_key_id: CK-004
  key_expression: project_id+environment_id+sso_identity_key（无法确认统一认证域时的当前正式键）
  usage: 由相关并发规则引用
  canonical_expression: project_id + environment_id + sso_identity_key
  cross_project_semantics: 不同项目不自动互斥；若未来要求按真实认证域跨项目互斥，必须新增FROZEN auth_domain/system维度和迁移/验收，不得用模糊系统名替代。
