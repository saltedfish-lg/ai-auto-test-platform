  default_strategy: REJECT
  allowed_alternatives:
  - CANCEL_NEW_REQUEST
  decision_actor: 系统按规则自动处理；PROMPT_USER或高风险处理由有权限人工主体确认
  timeout_result: 返回稳定冲突代码，不产生未提交业务副作用，并逆序释放资源
  preemption: 默认禁止；仅明确中止已有任务流程可释放资源，不允许无条件抢占
