  usage: 由相关并发规则引用
environment_lock_rules:
- lock_rule_id: LOCK-001
  lock_type: ENVIRONMENT_LOCK
  mode: SHARED
  resource_key: project_id+environment_id+resource_type
  holders:
  - 只读环境诊断任务
  - 明确无业务写入的检查任务
  compatibility: 可与其他SHARED共存；与EXCLUSIVE互斥
  acquire_rule: 权限、状态和版本校验后申请；排队时不提前获取身份或Runner资源
  renewal_rule: 持有任务存活期间按心跳续期
  release_rule: 任务结束或失败时释放；过期由回收器处理
  force_release_permission:
  - ROLE-SUPER-ADMIN
  - ROLE-PLATFORM-ADMIN
  completion_status: VALID_CONCURRENCY_COMPLETION
- lock_rule_id: LOCK-002
  lock_type: ENVIRONMENT_LOCK
  mode: EXCLUSIVE
  resource_key: project_id+environment_id+resource_type
  holders:
  - 正式写入执行任务
  - 会改变被测环境业务数据的受控任务
  compatibility: 与全部SHARED和EXCLUSIVE互斥
  acquire_rule: 正式执行身份租约之前获取；失败则不继续占用后续资源
  renewal_rule: 任务或attempt存活期间续期并携带fencing token
  release_rule: 完成、取消、中止、异常或租约失效时释放
  force_release_permission:
  - ROLE-SUPER-ADMIN
  - ROLE-PLATFORM-ADMIN
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- lock_rule_id: LOCK-003
  lock_type: OBJECT_VERSION_CAS
  mode: OPTIMISTIC
  resource_key: object_id+expected_version
  holders:
  - 用户写请求
  - 系统状态转换命令
  compatibility: 读取可并行；仅一个匹配expected_version的写入成功
  acquire_rule: 提交时比较版本，不长期持有
  renewal_rule: 不适用
  release_rule: 原子提交后自动结束
  force_release_permission: []
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
identity_lease_rules:
- lease_rule_id: LEASE-001
  lease_type: IDENTITY_LEASE
  resource_type: TEST_IDENTITY
  unique_key: project_id+environment_id+sso_identity_key
  holder_type: FORMAL_ROOT_EXECUTION_TASK
  acquire_time: 任务通过权限、状态和环境锁校验后，Runner匹配前或原子资源申请阶段
  renewal_rule: 根执行任务在排队后进入资源持有期才续期；同一任务重试复用根租约
  release_rule: 任务全部attempt完成、取消、中止、异常终止或超时后释放
  expiry_behavior: 标记EXPIRED并使用fencing token拒绝旧任务结果
  force_release_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-PLATFORM-ADMIN
  completion_status: DIRECTLY_SUPPORTED
  canonical_key: project_id + environment_id + sso_identity_key
  identity_normalization: 账号映射/账号集合快照先解析并归一化为稳定sso_identity_key；显示名不得作为键。
runner_binding_rules:
- rule_id: RBIND-001
  rule: Runner必须完成注册、认证、能力上报并处于可调度状态后才能绑定项目。
  conflict_key: runner_id
  resolution_strategy: REJECT
  completion_status: DIRECTLY_SUPPORTED
- rule_id: RBIND-002
  rule: 一个Runner活动期只能绑定一个项目；一个项目可以绑定多个Runner。
  conflict_key: runner_id where binding_status=ACTIVE
  resolution_strategy: REJECT_RUNNER_BINDING_CONFLICT
  completion_status: DIRECTLY_SUPPORTED
- rule_id: RBIND-003
  rule: Runner绑定是长期项目关系，不等于任务资源租约；任务仍需单独匹配能力和获取槽位。
  conflict_key: runner_id+project_id
  resolution_strategy: ALLOW_ONLY_MATCHING_PROJECT
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- rule_id: RBIND-004
  rule: 有运行中任务、AI探索、人工录制会话或有效资源租约时禁止解绑Runner。
  conflict_key: runner_id+active_holder_count
  resolution_strategy: REJECT_OR_DRAIN_THEN_UNBIND
  completion_status: VALID_RESOURCE_COMPLETION
- rule_id: RBIND-005
  rule: Runner离线不自动解除项目绑定；恢复后仍需认证和状态校验。
  conflict_key: runner_id
  resolution_strategy: KEEP_BINDING_MARK_OFFLINE
  completion_status: DIRECTLY_SUPPORTED
- rule_id: RBIND-006
  rule: 项目归档阻止Runner承接新任务；待任务和会话清空后解除活动绑定并保留历史Runner标识。
  conflict_key: project_id+runner_id
  resolution_strategy: DRAIN_AND_ARCHIVE_BINDING
  completion_status: VALID_RESOURCE_COMPLETION
- rule_id: RBIND-007
  rule: 绑定、解绑和强制排空属于高风险操作，必须二次确认、记录原因并审计。
  conflict_key: runner_id
  resolution_strategy: REQUIRE_RECONFIRMATION
  completion_status: VALID_PERMISSION_COMPLETION
