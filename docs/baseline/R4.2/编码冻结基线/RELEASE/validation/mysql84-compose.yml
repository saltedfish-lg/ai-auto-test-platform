services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: atp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 2s
      timeout: 2s
      retries: 60
  validator:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../../DATABASE_DDL:/ddl:ro
      - ./mysql84_assertions.sql:/validation/mysql84_assertions.sql:ro
    entrypoint:
      - sh
      - -ec
      - |
        mysql -hmysql -uroot -proot atp < /ddl/V3__platform_contract_rebuild.sql
        mysql -hmysql -uroot -proot atp < /ddl/V4__rbac_seed_data.sql
        mysql -hmysql -uroot -proot atp < /ddl/V5__platform_authentication_contract.sql
        mysql -hmysql -uroot -proot atp < /ddl/V4__rbac_seed_data.sql
        mysql -hmysql -uroot -proot atp < /validation/mysql84_assertions.sql
