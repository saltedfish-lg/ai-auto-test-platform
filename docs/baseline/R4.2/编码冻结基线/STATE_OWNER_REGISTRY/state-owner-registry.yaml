authentication_state_owners:
- state_semantic_id: AUTH-STATE-001
  semantic: USER_BUSINESS_LIFECYCLE
  object_id: OBJ-001
  persistence_fields: [atp_user.lifecycle_status]
  owner: UserAggregateService
  login_rule: 仅ACTIVE允许登录；LOCKED、DISABLED、ARCHIVED和LOGICALLY_DELETED拒绝并撤销Session。
- state_semantic_id: AUTH-STATE-002
  semantic: CREDENTIAL_LIFECYCLE
  object_id: AUTH-OBJ-001
  persistence_fields: [atp_platform_user_credential.lifecycle_status]
  owner: CredentialService
  values: [ACTIVE, REVOKED]
- state_semantic_id: AUTH-STATE-003
  semantic: TEMPORARY_SECURITY_LOCK
  object_id: AUTH-OBJ-001
  persistence_fields: [failed_login_count, failure_window_started_at, locked_until, last_failed_at]
  owner: CredentialService
  derived_values: [NORMAL, TEMPORARILY_LOCKED]
  rule: NORMAL为locked_until为空或已过期；不增加security_status，不改变用户生命周期。
- state_semantic_id: AUTH-STATE-004
  semantic: FORCE_PASSWORD_CHANGE
  object_id: AUTH-OBJ-001
  persistence_fields: [force_password_change]
  owner: CredentialService
  values: [false, true]
- state_semantic_id: AUTH-STATE-005
  semantic: CREDENTIAL_VERSION
  object_id: AUTH-OBJ-001
  persistence_fields: [credential_version]
  owner: CredentialService
  rule: 初始值1；密码修改或重置原子递增。
- state_semantic_id: AUTH-STATE-006
  semantic: REFRESH_SESSION_LIFECYCLE
  object_id: AUTH-OBJ-002
  persistence_fields: [atp_auth_refresh_session.lifecycle_status, rotated_at, revoked_at, replaced_by_session_id]
  owner: SessionService
  values: [ACTIVE, ROTATED, REVOKED, EXPIRED, COMPROMISED]
