metadata:
  artifact_id: AUTHENTICATION-CONTRACT-1.4.2
  version: 1.4.2-auth-contract-completion
  status: FROZEN_IMPLEMENTABLE
  release_id: PDBR-2026.08.07-R4.2
  parent_release_id: PDBR-2026.08.06-R4.1
  change_scope: P1_AUTHENTICATION_CONTRACT_COMPLETION
  pending_user_decisions: 0
  implementation_status: SPECIFIED_NOT_IMPLEMENTED
authority:
  product_rules:
  - 核心对象、业务规则与生命周期/核心对象、业务规则与生命周期.yaml
  - 数据安全、制品生命周期与验收基线/数据安全、制品生命周期与验收基线.yaml
  engineering_contracts:
  - 编码冻结基线/SYSTEM_DESIGN.yaml
  - 编码冻结基线/DATABASE_DDL/V5__platform_authentication_contract.sql
  - 编码冻结基线/OPENAPI/openapi.yaml
  adr: ADR-032
scope:
  included:
  - 平台用户密码认证
  - 默认admin安全初始化
  - Browser Access JWT与Refresh Session
  - 当前用户、登出、刷新和改密
  - 认证状态检查、撤销、审计及与RBAC的边界
  excluded:
  - 普通用户自助注册
  - V1强制SSO
  - Runner、Worker和Agent身份认证
  - 项目、环境、执行、报告、AI及其他后续业务域
authentication:
  mechanism: BEARER_JWT_ACCESS_WITH_REVOCABLE_REFRESH_SESSION
  identity_key: atp_user.username
  username_rule: admin用户名固定为admin；其他用户由具备正式权限的管理员创建，不开放自助注册。
  api_identity_resolution: 每个受保护请求从JWT subject解析user_id，并校验用户、凭据版本和Session当前状态。
  permissions_in_access_token: false
  permission_resolution: 每个受保护请求按当前数据库Role、Role-Permission Mapping、项目成员关系、数据范围和资源归属实时计算。
  runner_worker_authentication: OUT_OF_P1_SCOPE
access_token:
  format: JWT
  token_use: access
  signing_algorithm: RS256
  key_id_required: true
  private_key_source: ATP_JWT_PRIVATE_KEY_FILE指向部署秘密文件；不得提交私钥或把私钥写入普通环境样例。
  public_key_source: ATP_JWT_PUBLIC_KEY_FILE指向受控公钥文件；支持按kid安全轮换。
  issuer: ai-auto-test-platform
  audience: ai-auto-test-platform-api
  ttl_seconds: 900
  clock_skew_seconds: 60
  required_claims:
    iss: 固定issuer
    aud: 固定audience
    sub: user_id
    iat: 签发时间
    exp: 到期时间
    jti: 每个Access Token唯一ULID
    token_use: 固定access
    session_id: 当前Refresh Session标识
    credential_version: 签发时凭据版本
  request_validation:
  - 验证RS256签名、kid、issuer、audience、token_use、iat、exp和jti。
  - 查询当前user、platform_user_credential和auth_refresh_session；user必须为ACTIVE，凭据必须ACTIVE，Session必须ACTIVE。
  - JWT credential_version必须等于数据库当前版本；不得仅凭JWT内字段绕过数据库状态。
  - 权限不得固化在JWT中，角色或权限变更对新请求实时生效。
refresh_session:
  enabled: true
  token_format: 32字节密码学安全随机数的base64url不透明值
  persistence: SERVER_SIDE_MYSQL
  persisted_secret: SHA256_TOKEN_HASH_ONLY
  ttl_seconds: 604800
  absolute_expiry: true
  rotation: REQUIRED_ON_EVERY_REFRESH
  replay_detection: 已ROTATED的Token再次使用时将同family全部标记COMPROMISED并拒绝。
  multiple_sessions: 每用户最多5个ACTIVE Session；创建第6个时撤销最早的ACTIVE Session并记录审计。
  logout: 撤销Cookie对应Session；缺失或已撤销Session仍返回204，因此登出幂等。
  user_disabled: 用户进入LOCKED、DISABLED、ARCHIVED或LOGICALLY_DELETED时，同事务撤销其全部ACTIVE Session；后续Access请求也因实时用户状态校验失效。
  password_changed: 凭据版本递增并撤销全部旧Session；改密响应创建新的Session与Access Token。
  credential_reset: 凭据版本递增、force_password_change设为true并撤销全部Session。
browser_transport:
  access_token: 仅保存在运行时内存，通过Authorization Bearer头发送；禁止localStorage、sessionStorage和持久化IndexedDB。
  refresh_token: 仅由名为atp_refresh的HttpOnly Cookie承载，不进入JSON响应。
  cookie_attributes:
    http_only: true
    secure: true
    same_site: Strict
    path: /api/v1/auth
    max_age_seconds: 604800
  local_loopback_exception: 仅localhost/127.0.0.1无TLS开发模式可关闭Secure；其他环境禁止。
  csrf_boundary: 使用Refresh Cookie的refresh/logout端点必须验证同源Origin或Sec-Fetch-Site；其他写操作只接受Bearer Access Token。
supporting_objects:
- object_id: AUTH-OBJ-001
  canonical_name: platform_user_credential
  owner: CredentialService
  aggregate_owner: OBJ-001
  table: atp_platform_user_credential
  primary_key: credential_id
  business_unique_key: user_id
  lifecycle_values: [ACTIVE, REVOKED]
  delete_semantics: 不物理删除；用户归档或逻辑删除时撤销凭据并保留安全审计。
- object_id: AUTH-OBJ-002
  canonical_name: auth_refresh_session
  owner: SessionService
  aggregate_owner: AUTH-OBJ-001
  table: atp_auth_refresh_session
  primary_key: session_id
  business_unique_key: token_hash
  lifecycle_values: [ACTIVE, ROTATED, REVOKED, EXPIRED, COMPROMISED]
  delete_semantics: 到期或撤销后至少保留30天用于安全审计，再由受控清理任务删除。
credential:
  credential_type: PASSWORD
  lifecycle_status: ACTIVE
  credential_version_initial: 1
  credential_version_rule: 每次密码修改或管理员重置原子递增；Access Token必须匹配当前值。
  force_password_change_owner: CredentialService
  optimistic_lock: row_version
  one_active_password_credential_per_user: true
  password_hash_export: FORBIDDEN
  plaintext_storage: FORBIDDEN
password_policy:
  minimum_length: 12
  maximum_length: 128
  required_character_classes:
  - LETTER
  - DIGIT
  special_character_required: false
  whitespace: 允许内部空白；禁止首尾空白和全空白密码。
  username_equality: 禁止与username大小写不敏感地相同。
  common_passwords: 必须拒绝部署内置且可升级的常见弱密码拒绝列表；拒绝列表不得记录用户输入。
  periodic_expiry: V1不强制定期过期。
  password_history: V1不保留历史密码，仅禁止新密码与当前密码相同。
  change_password_session_effect: 凭据版本递增、撤销全部旧Session并为当前客户端创建新Session。
password_hash:
  algorithm: Argon2id
  implementation: 成熟维护库；禁止自实现算法。
  phc_version: 19
  memory_cost_kib: 65536
  time_cost: 3
  parallelism: 1
  salt_length_bytes: 16
  hash_length_bytes: 32
  encoding: PHC_STRING_INCLUDES_PARAMETERS_AND_SALT
  rehash_policy: 成功验证后发现版本或参数低于当前策略时，在同一安全事务中重新哈希并更新；不得降低参数。
login_failure_policy:
  invalid_identity_or_password_external_code: AUTH_INVALID_CREDENTIALS
  enumeration_protection: 用户不存在时执行固定Dummy Argon2id校验；用户不存在与密码错误使用相同401响应。
  threshold: 5
  rolling_window_seconds: 900
  lock_duration_seconds: 900
  lock_owner: CredentialService
  lock_storage: locked_until与失败窗口字段；不改变用户业务生命周期。
  successful_login: 清零失败次数、窗口和locked_until，并记录last_successful_login_at。
  correct_password_but_temporary_lock: 403 AUTH_ACCOUNT_TEMPORARILY_LOCKED
admin_bootstrap:
  username: admin
  command_contract: 显式bootstrap-admin命令；禁止普通API或Vue触发首次初始化。
  local_secret_input: 交互式TTY无回显输入并二次确认。
  automation_secret_input: ATP_BOOTSTRAP_ADMIN_PASSWORD_FILE指向受控秘密文件；禁止通过命令行参数传递密码。
  input_exclusivity: 交互输入与秘密文件必须且只能选择一种。
  transaction:
  - 创建ACTIVE的atp_user admin。
  - 创建ACTIVE平台密码凭据并以Argon2id哈希，credential_version=1，force_password_change=true。
  - 创建atp_admin并绑定ROLE-SUPER-ADMIN正式关系。
  - 写初始化幂等记录、审计及现有正式Outbox状态事件。
  - 任一步失败整体回滚。
  idempotency_key: SYSTEM_BOOTSTRAP_ADMIN_V1
  repeated_execution: admin或初始化记录已存在时返回ALREADY_INITIALIZED，不创建、不覆盖密码、不重置凭据版本。
  delivery: 密码由操作者输入，不由系统生成或输出；初始化结果只报告成功、对象ID和哈希算法元数据。
  force_password_change: true
  immutable_rules:
  - admin不可删除、禁用、归档或改名。
  - admin与ROLE-SUPER-ADMIN的正式绑定不可解除。
  - admin权限只能由正式Role-Permission Mapping得到，禁止用户名后门。
first_password_change:
  required_for_bootstrap_admin: true
  required_for_admin_created_users_with_temporary_password: true
  allowed_operations_before_change:
  - get_current_user
  - change_current_user_password
  - logout_platform_user
  forbidden_behavior: 其他受保护Operation返回403 AUTH_PASSWORD_CHANGE_REQUIRED；refresh也被拒绝，用户可重新登录后完成改密。
  completion: 成功改密后force_password_change=false、credential_version递增、旧Session全部撤销，并为当前客户端签发新Session。
state_model:
  user_business_state_owner: UserAggregateService owns atp_user.lifecycle_status
  login_allowed_user_state: ACTIVE
  enabled_normalization: 旧规则中的ENABLED统一规范化为ACTIVE；不新增ENABLED枚举。
  user_locked_semantics: atp_user.lifecycle_status=LOCKED表示管理员控制的无限期账号锁定。
  user_disabled_semantics: DISABLED表示业务停用；LOCKED、DISABLED、ARCHIVED和LOGICALLY_DELETED均禁止登录并撤销Session。
  credential_state_owner: CredentialService owns credential.lifecycle_status、credential_version、force_password_change和失败锁字段。
  security_normal_semantics: lifecycle_status=ACTIVE且locked_until为空或已过期；NORMAL为派生语义，不增加security_status列。
  temporary_security_lock: locked_until晚于当前时间；不改变atp_user.lifecycle_status。
  session_state_owner: SessionService owns auth_refresh_session.lifecycle_status与rotation/revoke字段。
operations:
- operation_id: login_platform_user
  method: POST
  path: /api/v1/auth/login
  authentication: NONE
  permission: NONE
  idempotency: NOT_REQUIRED
  audit: SUCCESS_AND_FAILURE
- operation_id: refresh_platform_session
  method: POST
  path: /api/v1/auth/refresh
  authentication: REFRESH_COOKIE
  permission: NONE
  idempotency: ROTATION_REPLAY_SAFE_NOT_IDEMPOTENCY_KEY
  audit: SUCCESS_AND_REPLAY_OR_FAILURE
- operation_id: logout_platform_user
  method: POST
  path: /api/v1/auth/logout
  authentication: REFRESH_COOKIE_OPTIONAL
  permission: NONE
  idempotency: IDEMPOTENT_204
  audit: WHEN_SESSION_RESOLVED
- operation_id: get_current_user
  method: GET
  path: /api/v1/auth/me
  authentication: BEARER_ACCESS_TOKEN
  permission: NONE
  idempotency: SAFE_READ
  audit: NOT_REQUIRED_EXCEPT_DENIAL
- operation_id: change_current_user_password
  method: POST
  path: /api/v1/auth/change-password
  authentication: BEARER_ACCESS_TOKEN
  permission: NONE
  idempotency: IDEMPOTENCY_KEY_REQUIRED
  audit: REQUIRED
error_semantics:
  unauthenticated_401:
  - AUTH_REQUIRED
  - AUTH_INVALID_CREDENTIALS
  - AUTH_TOKEN_INVALID
  - AUTH_TOKEN_EXPIRED
  - AUTH_SESSION_REVOKED
  - AUTH_IDENTITY_NOT_FOUND
  forbidden_403:
  - AUTH_PERMISSION_DENIED
  - AUTH_ACCOUNT_LOCKED
  - AUTH_ACCOUNT_DISABLED
  - AUTH_ACCOUNT_ARCHIVED
  - AUTH_ACCOUNT_TEMPORARILY_LOCKED
  - AUTH_PASSWORD_CHANGE_REQUIRED
  - AUTH_OPERATION_FORBIDDEN_FOR_STATE
  response_media_type: application/problem+json
  response_schema: ProblemDetails
audit_contract:
  required_actions:
  - LOGIN_SUCCEEDED
  - LOGIN_FAILED
  - LOGOUT
  - PASSWORD_CHANGED
  - CREDENTIAL_RESET
  - SESSION_REVOKED
  - USER_DISABLED_OR_LOCKED
  - ROLE_ASSIGNED
  - PERMISSION_DENIED
  required_fields: [actor_id, target_user_id_if_known, session_id_if_known, result_code, correlation_id, occurred_at, source_context_hash]
  forbidden_fields: [password, password_hash, access_token, refresh_token, cookie, secret, database_credential]
event_contract:
  decision: AUTHENTICATION_SECURITY_ACTIONS_ARE_AUDIT_ONLY_IN_P1
  reason: P1没有冻结跨边界认证事件消费者；登录、失败、登出、改密和撤销通过不可变审计表达，不新增领域事件。用户、admin和角色绑定的既有状态事件继续复用。
rbac_boundary:
  permissions: 50
  roles: 12
  mappings: 600
  super_admin_role: ROLE-SUPER-ADMIN
  super_admin_authorization: 仅通过正式Role-Permission Mapping获得权限；禁止username特判。
  authentication_vs_authorization: 认证确定主体，RBAC与数据范围确定操作许可；401与403严格区分。
acceptance_contract:
  reused_range: ACC-R3-1602..1688
  test_range: CT-R3-1602..1688
  status: SPECIFIED
  evidence_status: NOT_STARTED
  required_coverage:
  - admin首次且仅一次初始化、保护与超级管理员绑定
  - RBAC Seed幂等及50/12/600完整性
  - 登录成功、错误密码、用户不存在、禁用、管理员锁定和临时安全锁
  - Token过期、无效、撤销、Refresh rotation与重放检测
  - Logout幂等、当前用户、401、403和实时权限
  - 强制改密、改密后旧Session失效、用户禁用后Session失效
  - 初始化秘密不进入仓库、密码不明文落库、Token不进入日志
