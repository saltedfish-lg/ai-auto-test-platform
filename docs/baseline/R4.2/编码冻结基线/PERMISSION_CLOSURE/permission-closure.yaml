role_templates:
- role_id: ROLE-SUPER-ADMIN
  role_name: 超级管理员
  role_type: SYSTEM_PRESET
  purpose: 完成平台初始化、全局治理、跨项目管理和受控高风险操作。
  scope: PLATFORM_ALL
  allowed_operations:
  - 访问全部菜单和全部项目数据
  - 平台级用户、角色、权限和安全治理
  - 跨项目授权
  - Runner、模型、工具与系统配置治理
  prohibited_operations:
  - 不得删除、停用、归档admin或移除其SUPER_ADMIN绑定
  - 其他USER或SERVICE_ACCOUNT不得绑定SUPER_ADMIN
  data_scope: 平台全部active数据和依法保留的history数据；高风险操作仍必须审计。
  authorization_capability: 可在平台和项目授权上限内授权；SUPER_ADMIN例外行为必须审计
  cross_project_capability: FULL
  sensitive_data_access: 按独立敏感权限和审计规则访问，不等同于免审计
  high_risk_operations:
  - 跨项目CROSS_PROJECT_AUTHORIZATION_GRANT_ALL
  - 系统级安全与配置
  - 受控制品提前清理
  - 角色和权限治理
  assignment_rule: 系统初始化时仅绑定内置admin；不得向其他主体分配
  revocation_rule: 不可撤销
  lifecycle: 随平台存在；admin不可删除、停用、归档或解除绑定
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
  template_approval_status: APPROVED_BASELINE_TEMPLATE
  approval_source: USER_APPROVED_RECOMMENDED_PEND-R3-006
- role_id: ROLE-PLATFORM-ADMIN
  role_name: 平台管理员
  role_type: SYSTEM_PRESET
  purpose: 维护平台级配置与技术资源，并在明确授权范围内处理跨项目事务。
  scope: PLATFORM_MANAGED_SCOPES
  allowed_operations:
  - 维护平台配置
  - 管理Runner和模型
  - 按明确对象ID进行跨项目授权
  - 具备附加权限时治理平台资产推广
  prohibited_operations:
  - 不得默认授予动态全部项目范围
  - 不得因平台角色自动获得全部项目业务数据
  - 不得在无源项目完整范围时操作平台资产推广
  data_scope: 平台技术数据；项目业务数据按明确项目ID或附加CROSS_PROJECT_AUTHORIZATION_GRANT_ALL权限获得
  authorization_capability: 具备CROSS_PROJECT_AUTHORIZATION_MANAGE时仅按明确ID授权；另具CROSS_PROJECT_AUTHORIZATION_GRANT_ALL方可动态全部
  cross_project_capability: SPECIFIED_IDS_OR_EXPLICIT_CROSS_PROJECT_AUTHORIZATION_GRANT_ALL
  sensitive_data_access: 按独立凭证、日志、制品和项目范围权限
  high_risk_operations:
  - 跨项目授权
  - Runner绑定/升级
  - 模型和系统配置发布
  assignment_rule: 由SUPER_ADMIN或具备角色授权权限的主体分配
  revocation_rule: 停用/归档角色或结束角色绑定；保留历史授权快照
  lifecycle: ENABLED/DISABLED/ARCHIVED；禁止物理删除
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
  template_approval_status: APPROVED_BASELINE_TEMPLATE
  approval_source: USER_APPROVED_RECOMMENDED_PEND-R3-006
- role_id: ROLE-PROJECT-FUNCTION-ADMIN
  role_name: 项目功能管理员
  role_type: SYSTEM_PRESET
  purpose: 维护项目、环境、终端、账号、测试数据、自动化资产和项目执行配置。
  scope: AUTHORIZED_PROJECTS
  allowed_operations:
  - 维护授权项目配置
  - 在权限与数据范围内管理项目资产
  prohibited_operations:
  - 不得为自己提权
  - 无项目负责人或跨项目授权资格时不得授予全项目范围或成员管理能力
  - 不得操作未授权项目
  data_scope: 指定项目及七个项目数据子范围的active/history范围
  authorization_capability: 仅可转授本人拥有且允许转授的职责和范围
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 测试账号、凭证和敏感数据需独立权限
  high_risk_operations:
  - 项目配置发布
  - 环境/终端/账号停用与归档
  assignment_rule: 由项目负责人或具备平台跨项目授权权限者在项目成员入口分配
  revocation_rule: 撤销项目成员职责或数据范围；活动任务按快照继续、实时操作立即受限
  lifecycle: 随系统角色绑定和项目成员关系生效
  current_version: IN_SCOPE_MANDATORY
  completion_status: DIRECTLY_SUPPORTED
  template_approval_status: APPROVED_BASELINE_TEMPLATE
  approval_source: USER_APPROVED_RECOMMENDED_PEND-R3-006
- role_id: ROLE-TEST-LEAD
