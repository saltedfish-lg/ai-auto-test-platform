  - 角色
  - 权限
  - Runner
  - 模型
  - 工具集成
  - 系统配置
  - 授权项目
- role_id: ROLE-PROJECT-FUNCTION-ADMIN
  responsibilities:
  - 项目配置
  - 环境
  - 业务模块
  - 业务终端
  - 测试账号
  - 测试数据
  - 项目自动化资产
- role_id: ROLE-TEST-LEAD
