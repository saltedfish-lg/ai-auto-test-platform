p1_authentication_scenario_contract:
  contract_id: P1-AUTH-SCENARIO-001
  status: CURRENT_AUTHORITY_IMPLEMENTABLE
  scenarios:
  - admin通过显式Bootstrap秘密输入首次且仅一次初始化，并在首次登录后强制改密。
  - 用户通过Login取得内存Access Token与HttpOnly Refresh Cookie，刷新、当前用户、改密和登出使用正式Operation。
  - 强制改密前只允许当前用户、改密和登出；其他受保护操作返回403。
  - 用户角色和权限从当前数据库关系实时加载，前端菜单与按钮仅作UX控制。
  - 具备USER_CREATE的管理员可创建普通用户并指定UserRoleBinding与DataScopeGrant；系统生成一次性临时密码，用户首次登录必须改密。
  - 管理员可重置普通用户凭据、启用或禁用普通用户、创建或撤销普通用户Role Binding；admin及其ROLE-SUPER-ADMIN绑定始终不可变。
  - Login与Refresh按可信来源执行MySQL共享限流；客户端伪造Forwarded或X-Forwarded-For不能逃逸。
  - Change Password成功后前端清理内存认证状态并跳转登录页，用户使用新密码重新认证。
  non_scenarios:
  - 普通用户自助注册
  - V1强制SSO
  - Runner或Worker使用平台Browser认证
