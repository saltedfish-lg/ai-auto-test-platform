- role_id: ROLE-RUNNER-ADMIN
  data_scope: Runner技术数据；项目业务数据须另有项目成员权限
  project_scope: RUNNER_TECHNICAL_SCOPE_AND_AUTHORIZED_PROJECTS
- role_id: ROLE-MODEL-REVIEWER
  data_scope: 平台级模型版本审核范围；项目业务内容仍按项目数据权限
  project_scope: PLATFORM_MODEL_VERSION_REVIEW
- role_id: ROLE-PROJECT-OWNER-DUTY
  data_scope: ACTIVE ProjectMember与ROLE-PROJECT-OWNER-DUTY动态派生当前project_id边界内Owner ALL；不持久化Owner专属DataScopeGrant
  project_scope: OWNED_PROJECTS
role_authorization_capabilities:
- role_id: ROLE-SUPER-ADMIN
  authorization_capability: 可在平台和项目授权上限内授权；SUPER_ADMIN例外行为必须审计
  cross_project_capability: FULL
  sensitive_data_access: 按独立敏感权限和审计规则访问，不等同于免审计
- role_id: ROLE-PLATFORM-ADMIN
  authorization_capability: 具备CROSS_PROJECT_AUTHORIZATION_MANAGE时仅按明确ID授权；另具CROSS_PROJECT_AUTHORIZATION_GRANT_ALL方可动态全部
  cross_project_capability: SPECIFIED_IDS_OR_EXPLICIT_CROSS_PROJECT_AUTHORIZATION_GRANT_ALL
  sensitive_data_access: 按独立凭证、日志、制品和项目范围权限
- role_id: ROLE-PROJECT-FUNCTION-ADMIN
  authorization_capability: 仅可转授本人拥有且允许转授的职责和范围
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 测试账号、凭证和敏感数据需独立权限
- role_id: ROLE-TEST-LEAD
  authorization_capability: 项目内按被授予的成员管理和转授权能力
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 账号、变量、日志、制品按独立权限和脱敏策略
- role_id: ROLE-CASE-DESIGNER
  authorization_capability: 无平台级授权；项目范围由项目负责人或管理员授予
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 仅本人凭证；录制中人工输入身份不成为平台账号事实
- role_id: ROLE-ASSET-REVIEWER
  authorization_capability: 无默认转授权
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 仅审核所需数据；凭证和敏感变量需独立权限
- role_id: ROLE-TASK-EXECUTOR
  authorization_capability: 无默认授权能力
  cross_project_capability: NONE_BY_DEFAULT
  sensitive_data_access: 测试账号和制品按独立权限；录制不预知手工输入凭证
- role_id: ROLE-REPORT-VIEWER
  authorization_capability: 无默认授权能力
  cross_project_capability: 仅明确授权项目
  sensitive_data_access: 按制品、日志、录制和脱敏权限独立控制
- role_id: ROLE-MODEL-ADMIN
  authorization_capability: 无默认项目授权能力
  cross_project_capability: TECHNICAL_METADATA_ONLY_BY_DEFAULT
  sensitive_data_access: 凭证管理需独立权限；无项目范围仅脱敏技术元数据
- role_id: ROLE-RUNNER-ADMIN
  authorization_capability: 仅Runner治理操作，不产生项目业务授权
  cross_project_capability: TECHNICAL_RUNNER_SCOPE
  sensitive_data_access: 默认仅脱敏技术信息
- role_id: ROLE-MODEL-REVIEWER
  authorization_capability: 无默认授权能力
  cross_project_capability: PLATFORM_REVIEW_SCOPE
  sensitive_data_access: 审核所需内容；凭证明文和项目数据需独立权限
- role_id: ROLE-PROJECT-OWNER-DUTY
  authorization_capability: 可在负责项目内授予符合项目授权上限的职责与范围
  cross_project_capability: OWNED_PROJECTS_ONLY
  sensitive_data_access: 仍需相应系统权限和敏感数据权限
business_scenarios:
- scenario_id: USR-SCN-001
  scenario_name: 系统首次初始化
  scenario_level: PRODUCT_CORE
  scenario_type: NORMAL
  initiating_actor: SYS-PLATFORM-SERVICE
  participating_actors:
  - ROLE-SUPER-ADMIN
  - SYS-AUDIT-SERVICE
  business_goal: 创建唯一默认admin、SUPER_ADMIN绑定和初始化治理数据
  trigger: 首次部署由Bootstrap安装过程触发，普通用户不可重复发起
  preconditions:
  - 数据库、安全配置和审计服务可用
  - 不存在已完成初始化记录
  input: []
  main_flow:
  - 在单一事务中创建USER admin
  - 创建并绑定SUPER_ADMIN系统角色
  - 设置ENABLED/NORMAL初始状态和必要安全参数
  - 写入不可变初始化审计
  - 提交初始化标记
  alternative_flows:
  - 重复初始化请求以幂等键返回既有结果
  exception_flows:
  - 任一对象或审计写入失败则整体回滚
  - 禁止创建第二个可绑定SUPER_ADMIN的主体
  involved_entities:
  - ENT-USER
  - ENT-ROLE
  - ENT-ROLE-BINDING
  - ENT-AUDIT
  involved_modules:
  - 部署/安装Bootstrap系统入口
  - 系统管理—用户管理（后置验证）
  - 系统管理—角色管理（后置验证）
  - 登录页（首次登录验证）
  permission_checks:
  - 仅受控初始化服务可执行；普通角色不能调用
  data_scope_checks:
  - 平台全局初始化范围
  concurrency_checks:
  - 初始化唯一键和事务幂等
  resource_checks:
  - 平台存储/审计：REQUIRED；predicate=TRUE; 平台存储/审计不可用时不得执行对应业务副作用；进入明确的PRESTART_BLOCKED、WAITING_RESOURCE或场景失败结果，并记录资源原因。
  - Runner节点：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  - AI模型：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  - 被测环境：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  - 外部组件：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  state_transitions:
  - '用户: 不存在→ENABLED；安全状态=NORMAL'
  - '角色绑定: 不存在→ACTIVE'
  data_changes:
  - '仅对ENT-USER、ENT-ROLE、ENT-ROLE-BINDING、ENT-AUDIT执行本场景定义的数据写入；状态变化为“用户: 不存在→ENABLED；安全状态=NORMAL；角色绑定: 不存在→ACTIVE”；同步形成不可变事件和审计，不改写历史快照。'
  output:
  - 默认admin可登录并唯一持有SUPER_ADMIN
  artifacts:
  - 业务审计记录
  audit_requirements:
  - 记录“系统首次初始化”的发起主体、参与主体、对象ID、权限与数据范围判定、状态前后值、结果/原因码和时间。
  - 本地状态变化、不可变事件和审计在同一原子提交边界内完成；提交前审计失败则不提交或回滚本地变化。
  success_criteria:
  - admin存在且不可删除、停用、归档或解除SUPER_ADMIN绑定
  failure_criteria:
  - 任一前置、权限、数据范围、并发或明确资源条件不满足，或未进入声明状态、产生越权/重复副作用、证据未密封、审计缺失时失败。
  - 事务/补偿策略：LOCAL_TRANSACTION。
  recovery:
  - 修复前置原因后使用幂等命令重试；不得改写已提交历史。
  - 事务回滚后使用同一幂等键重试
  fact_classification: DIRECTLY_SUPPORTED
  readiness_assessment: SCENARIO_SPECIFIC_ACCEPTANCE_COMPLETE
