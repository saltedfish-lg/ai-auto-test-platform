  - 事务/补偿策略：EXTERNAL_SIDE_EFFECT。
  recovery:
  - 保留外部副作用与失败原因，创建新的补偿、恢复或重试记录；不得改写旧执行记录。
  - 修复Endpoint或密钥后按原幂等键重放
  fact_classification: DIRECTLY_SUPPORTED
