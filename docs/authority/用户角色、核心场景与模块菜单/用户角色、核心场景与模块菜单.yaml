  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- scenario_id: USR-SCN-086
  scenario_name: 技术告警Webhook接入
  scenario_level: SYSTEM_INTERNAL
  scenario_type: NORMAL
  initiating_actor: EXT-OBSERVABILITY
  participating_actors:
  - SYS-PLATFORM-SERVICE
  - SYS-AUDIT-SERVICE
  - ROLE-PLATFORM-ADMIN
  business_goal: 把已发布Endpoint接收的外部技术事件转换为可追溯平台告警
  trigger: 已发布Webhook Endpoint收到签名请求
  preconditions:
  - Endpoint修订已发布
  - 签名密钥、租户派生、去重和顺序规则有效
  input:
  - 签名Header、事件identity、sequence、payload
  main_flow:
  - 验签并解析租户
  - 检查Endpoint状态和来源身份
  - 执行幂等去重与sequence检查
  - 创建入站批次和首次业务告警事件
  - 写入审计并返回确定结果
  alternative_flows:
  - 重复事件返回既有幂等结果
  - 允许的乱序事件进入受控等待或拒绝
  exception_flows:
  - 验签失败、Endpoint停用、租户不一致或序列冲突时拒绝并审计
  involved_entities:
  - ENT-INTEGRATION-COMPONENT
  - ENT-TECHNICAL-ALERT
  - ENT-TECHNICAL-ALERT-INGESTION-BATCH
  - ENT-AUDIT
  involved_modules:
  - 监控与日志—告警中心
  - 系统管理—工具集成配置
  permission_checks:
  - Endpoint发布由平台管理员或明确授权主体执行；入站调用使用机器身份而非用户菜单权限
  data_scope_checks:
  - 按Endpoint绑定租户和项目范围派生，不信任payload自报范围
  concurrency_checks:
  - event_identity幂等；sequence CAS；批次终态不可回退
  resource_checks:
  - 平台存储/审计：REQUIRED；predicate=TRUE; 平台存储/审计不可用时不得执行对应业务副作用；进入明确的PRESTART_BLOCKED、WAITING_RESOURCE或场景失败结果，并记录资源原因。
  - Runner节点：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  - AI模型：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  - 被测环境：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  - 外部组件：CONDITIONAL_BY_AFFECTED_COMPONENT；predicate=场景已识别具体受影响组件且该组件参与当前动作时为TRUE; predicate为TRUE且外部组件不可用时进入场景声明的等待、降级或失败结果；predicate为FALSE时不参与门禁。
  state_transitions:
  - '入站批次: RECEIVED→VALIDATED→COMPLETED/REJECTED'
  - '技术告警: 不存在→OPEN或既有事件去重'
  data_changes:
  - 创建技术告警接入批次、逐项处置、告警事件和审计记录
  output:
  - 告警事件ID或确定性拒绝原因
  artifacts:
  - 入站技术日志
  - 业务审计记录
  audit_requirements:
  - 记录“技术告警Webhook接入”的发起主体、参与主体、对象ID、权限与数据范围判定、状态前后值、结果/原因码和时间。
  - 受理意图和平台状态在本地原子提交；已发生的Runner、模型、被测系统或组件副作用不得宣称全局回滚，失败时密封证据并执行受控补偿/恢复。
  success_criteria:
