- scope_id: OUT-001
  name: 自定义角色和自定义权限集
  status: OUT_OF_SCOPE
  statement: 当前版本只使用11个预置系统角色和项目负责人职责。
- scope_id: OUT-002
  name: Windows或Android原生自动化模块
  status: OUT_OF_SCOPE
  statement: 管理端、客户端和PDA端均为Web页面，采用Playwright Web。
- scope_id: OUT-003
  name: 批次、尝试、锁、租约的普通用户独立菜单
  status: OUT_OF_SCOPE
  statement: 作为任务详情或管理员诊断视图，不形成重复业务主入口。
- scope_id: OUT-004
  name: 第三方工具内部管理页面复制
  status: OUT_OF_SCOPE
  statement: 只提供平台集成配置和健康入口，不暴露工具内部控制台为业务菜单。
- scope_id: OUT-005
  name: 统一恢复中心
  status: OUT_OF_SCOPE_V1
  statement: V1不新增独立统一恢复中心；工作台聚合待办并跳转对象Owner页面。
