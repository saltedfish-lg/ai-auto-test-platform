  expected_result: winner完成当前原子动作并提交版本/租约令牌。 loser不改变ENT-INTEGRATION-COMPONENT，返回冲突、陈旧版本或资源占用结果；不得覆盖winner。
  concurrency_object: ENT-INTEGRATION-COMPONENT
  concurrency_rule: event_identity幂等；sequence CAS；批次终态不可回退
  trigger_condition: 两个或更多命令同时竞争技术告警Webhook接入中的ENT-INTEGRATION-COMPONENT，并命中“event_identity幂等；sequence CAS；批次终态不可回退”。
  flow:
  - 以ENT-INTEGRATION-COMPONENT及场景声明范围计算竞争键
  - 按“event_identity幂等；sequence CAS；批次终态不可回退”取得唯一winner或有效租约持有者
  - loser不执行业务副作用并获得可重试/冲突结果
  winner_result: winner完成当前原子动作并提交版本/租约令牌。
  loser_result: loser不改变ENT-INTEGRATION-COMPONENT，返回冲突、陈旧版本或资源占用结果；不得覆盖winner。
- variant_id: USR-SCN-086-VAR-05
  scenario_id: USR-SCN-086
  variant_type: RECOVERY
  projection_source: business_scenarios.recovery
  description: 技术告警Webhook接入—RECOVERY分支：“技术告警Webhook接入”已进入可恢复失败/等待/部分完成状态，且恢复前置已满足。
  expected_result: 恢复成功时ENT-INTEGRATION-COMPONENT只推进到恢复动作声明的状态；旧尝试、旧证据和失败审计保持不可变；恢复失败返回当前原因并保持可再次恢复。
  trigger_condition: “技术告警Webhook接入”已进入可恢复失败/等待/部分完成状态，且恢复前置已满足。
  flow:
  - 保留外部副作用与失败原因，创建新的补偿、恢复或重试记录；不得改写旧执行记录。
  - 重新校验ENT-INTEGRATION-COMPONENT当前状态、资源和幂等键
  - 创建新的恢复命令/执行记录，不改写旧历史
