  data_changes:
  - '仅对ENT-RUN-TASK、ENT-EXECUTION-ATTEMPT、ENT-LOCK-LEASE、ENT-ARTIFACT、ENT-REPORT执行本场景定义的数据写入；状态变化为“执行根任务/attempt: 非终态→CANCELLED/INTERRUPTED；终态不回退”；同步形成不可变事件和审计，不改写历史快照。'
  output:
