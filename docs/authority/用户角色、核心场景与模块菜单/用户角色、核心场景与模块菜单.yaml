scenario_variants:
- variant_id: USR-SCN-001-VAR-NORMAL
  scenario_id: USR-SCN-001
  variant_type: NORMAL
  description: 系统首次初始化—NORMAL分支：全部前置条件成立，所需权限/范围/资源/并发门禁通过。
  expected_result: admin存在且不可删除、停用、归档或解除SUPER_ADMIN绑定
  trigger_condition: 全部前置条件成立，所需权限/范围/资源/并发门禁通过。
  flow:
  - 在单一事务中创建USER admin
  - 创建并绑定SUPER_ADMIN系统角色
  - 设置ENABLED/NORMAL初始状态和必要安全参数
  - 写入不可变初始化审计
  - 提交初始化标记
- variant_id: USR-SCN-001-VAR-PERMISSION
  scenario_id: USR-SCN-001
  variant_type: PERMISSION
  description: 系统首次初始化—PERMISSION分支：发起主体缺少该场景permission_checks中明确列出的权限或受信系统身份，或目标对象超出active/history数据范围。
  expected_result: 返回无权限或超范围结果；ENT-USER状态、绑定、版本、任务和制品均不变化；记录发起主体、该场景permission_checks中明确列出的权限或受信系统身份和目标范围审计。
  permission_id_refs: []
  trigger_condition: 发起主体缺少该场景permission_checks中明确列出的权限或受信系统身份，或目标对象超出active/history数据范围。
  flow:
  - 在“系统首次初始化”首个业务副作用前执行权限与数据范围检查
  - 拒绝对ENT-USER执行主流程并记录拒绝依据
- variant_id: USR-SCN-001-VAR-EXCEPTION
  scenario_id: USR-SCN-001
  variant_type: EXCEPTION
  description: 系统首次初始化—EXCEPTION分支：任一对象或审计写入失败则整体回滚
  expected_result: ENT-USER保持异常发生前最后稳定状态或进入场景明确失败状态；不宣称后续步骤成功；按“修复前置原因后使用幂等命令重试；不得改写已提交历史。”提供恢复。
  trigger_condition: 任一对象或审计写入失败则整体回滚
  flow:
  - 检测“系统首次初始化”异常：任一对象或审计写入失败则整体回滚
  - 停止未提交的后续步骤并按事务策略处理ENT-USER
  - 记录失败结果和可恢复入口
- variant_id: USR-SCN-001-VAR-CONCURRENCY
  scenario_id: USR-SCN-001
  variant_type: CONCURRENCY
  description: 系统首次初始化—CONCURRENCY分支：两个或更多命令同时竞争系统首次初始化中的ENT-USER，并命中“初始化唯一键和事务幂等”。
  expected_result: winner完成当前原子动作并提交版本/租约令牌。 loser不改变ENT-USER，返回冲突、陈旧版本或资源占用结果；不得覆盖winner。
  concurrency_object: ENT-USER
  concurrency_rule: 初始化唯一键和事务幂等
  trigger_condition: 两个或更多命令同时竞争系统首次初始化中的ENT-USER，并命中“初始化唯一键和事务幂等”。
  flow:
  - 以ENT-USER及场景声明范围计算竞争键
  - 按“初始化唯一键和事务幂等”取得唯一winner或有效租约持有者
  - loser不执行业务副作用并获得可重试/冲突结果
  winner_result: winner完成当前原子动作并提交版本/租约令牌。
  loser_result: loser不改变ENT-USER，返回冲突、陈旧版本或资源占用结果；不得覆盖winner。
- variant_id: USR-SCN-001-VAR-RECOVERY
  scenario_id: USR-SCN-001
  variant_type: RECOVERY
  projection_source: business_scenarios.recovery
  description: 系统首次初始化—RECOVERY分支：“系统首次初始化”已进入可恢复失败/等待/部分完成状态，且恢复前置已满足。
  expected_result: 恢复成功时ENT-USER只推进到恢复动作声明的状态；旧尝试、旧证据和失败审计保持不可变；恢复失败返回当前原因并保持可再次恢复。
  trigger_condition: “系统首次初始化”已进入可恢复失败/等待/部分完成状态，且恢复前置已满足。
  flow:
  - 修复前置原因后使用幂等命令重试；不得改写已提交历史。
  - 重新校验ENT-USER当前状态、资源和幂等键
  - 创建新的恢复命令/执行记录，不改写旧历史
- variant_id: USR-SCN-001-VAR-SECURITY
  scenario_id: USR-SCN-001
  variant_type: SECURITY
  description: 系统首次初始化—SECURITY分支：“系统首次初始化”请求包含越权范围、敏感数据访问、无效凭证或不受信系统主体。
  expected_result: 不返回未授权敏感内容，不创建或改变ENT-USER；日志和审计不包含Secret明文；拒绝结果可追溯到具体权限/范围控制。
  security_control: 仅受控初始化服务可执行；普通角色不能调用；平台全局初始化范围
  trigger_condition: “系统首次初始化”请求包含越权范围、敏感数据访问、无效凭证或不受信系统主体。
  flow:
  - 执行安全控制：仅受控初始化服务可执行；普通角色不能调用；平台全局初始化范围
  - 在敏感数据或业务副作用产生前拒绝请求
  - 写入脱敏安全审计并保持ENT-USER不变
