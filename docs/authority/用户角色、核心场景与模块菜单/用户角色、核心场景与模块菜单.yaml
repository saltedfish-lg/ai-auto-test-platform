  - loser不执行业务副作用并获得可重试/冲突结果
  winner_result: winner完成当前原子动作并提交版本/租约令牌。
  loser_result: loser不改变ENT-REPORT，返回冲突、陈旧版本或资源占用结果；不得覆盖winner。
