high_risk_operation_mappings:
- mapping_id: HR-001
  operation_name: 跨项目授权
  menu_id: MENU-10-004
  operation_code: CROSS_PROJECT_GRANT
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-PLATFORM-ADMIN
  control_rule: 明确对象ID授权；动态全部项目仅独立高权限。
  audit_required: true
  second_confirmation: true
- mapping_id: HR-002
  operation_name: 项目负责人变更
  menu_id: MENU-02-001
  operation_code: CHANGE_OWNER
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-PROJECT-OWNER-DUTY
  control_rule: 原子指定合格新负责人后才可移除最后旧负责人。
  audit_required: true
  second_confirmation: true
- mapping_id: HR-003
  operation_name: 强制中止任务
  menu_id: MENU-06-002
  operation_code: FORCE_ABORT
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-TEST-LEAD
  control_rule: 密封证据、记录系统原因并释放资源。
  audit_required: true
  second_confirmation: true
- mapping_id: HR-004
  operation_name: 强制释放锁或租约
  menu_id: MENU-06-003
  operation_code: FORCE_RELEASE
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-PLATFORM-ADMIN
  - ROLE-RUNNER-ADMIN
  control_rule: 校验持有者和隔离令牌，禁止陈旧命令继续写入。
  audit_required: true
  second_confirmation: true
- mapping_id: HR-005
  operation_name: Runner绑定和解绑
  menu_id: MENU-07-003
  operation_code: BIND/UNBIND
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-PLATFORM-ADMIN
  - ROLE-RUNNER-ADMIN
  control_rule: 无活动任务和租约，项目级独占。
  audit_required: true
  second_confirmation: true
- mapping_id: HR-006
  operation_name: Runner升级
  menu_id: MENU-07-002
  operation_code: UPGRADE
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-PLATFORM-ADMIN
  - ROLE-RUNNER-ADMIN
  control_rule: 升级前停止新派发并保留回滚信息。
  audit_required: true
  second_confirmation: true
- mapping_id: HR-007
  operation_name: 停止他人录制
  menu_id: MENU-05-001
  operation_code: STOP_OTHER
  allowed_roles:
  - ROLE-SUPER-ADMIN
  - ROLE-TEST-LEAD
  control_rule: 需独立权限；中途撤权采用ADR-027的受控收口策略并记录不可变审计。
  audit_required: true
  second_confirmation: true
- mapping_id: HR-008
  operation_name: 发布正式用例或资产版本
  menu_id: MENU-03-003
