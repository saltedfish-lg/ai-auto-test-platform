  failure_criteria:
  - 任一前置、权限、数据范围、并发或明确资源条件不满足，或未进入声明状态、产生越权/重复副作用、证据未密封、审计缺失时失败。
  - 事务/补偿策略：EXTERNAL_SIDE_EFFECT。
