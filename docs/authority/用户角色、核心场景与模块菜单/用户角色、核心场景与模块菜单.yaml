  - 被测环境：REQUIRED_AT_EXECUTION；predicate=TRUE_WHEN_EXECUTION_STARTS; 被测环境不可用时不得执行对应业务副作用；进入明确的PRESTART_BLOCKED、WAITING_RESOURCE或场景失败结果，并记录资源原因。
  - 外部组件：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
