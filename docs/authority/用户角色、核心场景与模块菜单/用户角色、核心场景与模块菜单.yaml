  main_flow:
  - 识别用户取消命令或系统中止命令及原因
  - 用户分支校验RUN_TASK_CANCEL和本人/授权项目任务范围；系统分支校验受信系统主体及系统原因
  - 平台以幂等命令记录取消/中止意图并停止新步骤
  - 调度器通知Runner密封既有证据并停止可停止动作
  - 最终化执行尝试和执行根任务，保留已发生副作用与原因
  - 释放锁/租约并触发报告和审计
