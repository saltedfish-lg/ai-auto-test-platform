- scenario_id: USR-SCN-085
  scenario_name: 敏感数据访问与审计
  scenario_level: DOMAIN
  scenario_type: SECURITY
  initiating_actor: ROLE-REPORT-VIEWER
  participating_actors:
  - ROLE-MODEL-ADMIN
  - ROLE-RUNNER-ADMIN
  - ROLE-SUPER-ADMIN
  - SYS-AUDIT-SERVICE
  business_goal: 对凭证、变量、Prompt、响应、日志、制品和高风险操作实施最小授权、脱敏与审计
  trigger: 发起敏感数据访问与审计
  preconditions:
  - 发起主体已登录并具备对应菜单、操作和数据范围权限
  - 相关项目及依赖对象处于允许状态
  input: []
  main_flow:
  - 识别数据敏感级别和所属项目
  - 校验独立查看/下载/凭证/项目范围权限
  - 输出脱敏视图或受控短期访问
  - 禁止敏感变量进入日志和报告
  - 记录访问与SUPER_ADMIN例外审计
  alternative_flows:
  - Runner/模型管理员无项目范围时仅查看脱敏技术元数据
  exception_flows:
  - 审计写入失败时要求事务回滚的高风险操作不得提交
  involved_entities:
  - ENT-TEST-ACCOUNT
  - ENT-CONTEXT-VARIABLE
  - ENT-ARTIFACT
  - ENT-MODEL-CONFIG
  - ENT-AUDIT
  involved_modules:
  - 项目管理—测试账号
  - 报告中心—测试制品
  - 监控与日志—AI调用日志
  - 系统管理—审计日志
  permission_checks:
  - ROLE-REPORT-VIEWER发起“敏感数据访问与审计”前必须具备对应菜单、操作或服务授权；系统主体只按自身服务身份执行；越权时拒绝且不产生业务写入。
  data_scope_checks:
  - “敏感数据访问与审计”的读取、写入和历史查询仅作用于明确授权项目及active_scope/history_read_scope；敏感数据另行校验独立权限。
  concurrency_checks:
  - 短期访问令牌和凭证版本校验
  resource_checks:
  - 平台存储/审计：REQUIRED；predicate=TRUE; 平台存储/审计不可用时不得执行对应业务副作用；进入明确的PRESTART_BLOCKED、WAITING_RESOURCE或场景失败结果，并记录资源原因。
  - Runner节点：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  - AI模型：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  - 被测环境：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  - 外部组件：NOT_APPLICABLE；predicate=FALSE_FOR_THIS_SCENARIO; 本场景不读取、不分配且不参与门禁。
  state_transitions:
  - 访问授权不改变源数据状态；审计事件不可变
  data_changes:
  - 仅对ENT-TEST-ACCOUNT、ENT-CONTEXT-VARIABLE、ENT-ARTIFACT、ENT-MODEL-CONFIG、ENT-AUDIT执行本场景定义的数据写入；状态变化为“访问授权不改变源数据状态；审计事件不可变”；同步形成不可变事件和审计，不改写历史快照。
  output:
  - 敏感数据访问与审计的可追溯结果
  artifacts:
  - 业务审计记录
  audit_requirements:
  - 记录“敏感数据访问与审计”的发起主体、参与主体、对象ID、权限与数据范围判定、状态前后值、结果/原因码和时间。
  - 不声明业务状态回滚；敏感读取必须在返回前完成权限与访问审计，审计不可用时阻断敏感响应。
  success_criteria:
  - 敏感内容仅向明确授权主体展示且全程可追溯
  failure_criteria:
  - 任一前置、权限、数据范围、并发或明确资源条件不满足，或未进入声明状态、产生越权/重复副作用、证据未密封、审计缺失时失败。
  - 事务/补偿策略：READ_ONLY。
  recovery:
  - 恢复审计能力后重新读取；不修改历史业务事实。
  - 撤销访问令牌、轮换凭证并调查审计事件
  fact_classification: RESPONSIBILITY_SCOPE_SUPPLEMENT
  readiness_assessment: SCENARIO_SPECIFIC_ACCEPTANCE_COMPLETE
  transaction_policy: READ_ONLY
  affected_objects:
  - ENT-TEST-ACCOUNT
  - ENT-CONTEXT-VARIABLE
  - ENT-ARTIFACT
  - ENT-MODEL-CONFIG
  - ENT-AUDIT
  related_modules:
  - MOD-12
