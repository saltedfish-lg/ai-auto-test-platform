- adr_id: ADR-020
  decision_id: PEND-R3-003
  title: CI/CD结果是否进入平台UI
  status: ACCEPTED
  decision: V1不建设CI/CD管理UI；仅提供受权API触发并记录trigger_source、external_pipeline_id、commit_sha、branch。完整聚合、回写和Webhook管理延期。
  authority: USER_SELECTED_IN_REPAIR_INSTRUCTION
