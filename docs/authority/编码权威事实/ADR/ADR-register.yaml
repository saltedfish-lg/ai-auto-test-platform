- adr_id: ADR-021
  decision_id: PEND-R3-004
  title: 模型供应商白名单与默认模型
  status: ACCEPTED
  decision: V1支持OpenAI兼容协议和一个默认实现；业务仅依赖ModelGateway，不直连供应商SDK；模型、Prompt版本、费用与调用事实全量审计。
