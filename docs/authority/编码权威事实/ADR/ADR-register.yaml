- adr_id: ADR-019
  decision_id: PEND-R3-002
  title: 对象存储、冗余、RPO/RTO与灾备责任
  status: ACCEPTED
  decision: 采用S3兼容对象存储端口；本地或内网部署默认使用MinIO单实例并配置独立备份存储，生产环境允许替换为托管S3。元数据RPO不高于24小时、RTO不高于8小时；制品RPO不高于24小时、RTO不高于24小时；执行每日备份和季度恢复演练。平台建设及运维预算承担存储与备份成本，平台运维负责人和存储Owner共同承担备份、恢复演练和故障处置责任。
  authority: USER_APPROVED_RECOMMENDED_SCHEME
  effective_release_id: PDBR-2026.08.06-R2
