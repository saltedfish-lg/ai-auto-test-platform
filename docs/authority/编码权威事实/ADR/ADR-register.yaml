- adr_id: ADR-027
  decision_id: PEND-R3-010
  title: 人工录制过程中撤权生效策略
  status: ACCEPTED
  decision: 普通项目角色调整时立即禁止新增操作，保存当前采集内容为未提交草稿后停止；用户禁用或安全风险撤权时立即终止控制权并隔离会话。任何情况不得以旧权限提交或发布。
