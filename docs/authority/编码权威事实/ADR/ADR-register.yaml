- adr_id: ADR-018
  decision_id: PEND-R3-001
  title: 容量、并发用户和吞吐验收基线
  status: SUPERSEDED_IN_PART
  decision: V1采用SMALL档：20个项目、50名用户、10台Runner、同时运行10个执行任务。API常规查询P95≤500ms、写操作P95≤1000ms；Runner心跳与进度上报在标准档容量内不得丢失；排队任务上限1000。
  authority: USER_SELECTED_IN_REPAIR_INSTRUCTION
  effective_release_id: PDBR-2026.08.06-R2
