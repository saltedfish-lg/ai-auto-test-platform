- adr_id: ADR-022
  decision_id: PEND-R3-005
  title: TLS和传输安全最低基线
  status: ACCEPTED
  decision: 正式环境最低TLS 1.2并优先TLS 1.3；平台到Runner使用HTTPS/WSS并校验证书；正式环境禁止明文HTTP；仅显式配置的localhost开发环境可例外。
