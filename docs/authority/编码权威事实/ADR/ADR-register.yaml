  decision_id: PEND-R3-009
  title: 报告查看角色下载和分享权限
  status: ACCEPTED
  decision: 拆分report:view、report:export、artifact:download、report:share、sensitive_artifact:view。按指令允许报告查看角色默认下载并启用外部分享；分享必须限时、可撤销、受范围控制并审计，禁止永久匿名链接。
