- adr_id: ADR-023
  decision_id: PEND-R3-006
  title: 11个预置角色默认权限模板
  status: ACCEPTED
  decision: 批准现有11个SYSTEM_PRESET角色及完整540条角色—权限映射作为V1初始化授权事实。SUPER_ADMIN仅允许绑定内置admin；其他角色必须受项目或平台范围、对象状态、独立敏感权限和不可变审计约束。默认权限模板以版本化初始化迁移发布，后续变更必须新增版本，不得静默覆盖历史。
  authority: USER_APPROVED_RECOMMENDED_SCHEME
  effective_release_id: PDBR-2026.08.06-R2
