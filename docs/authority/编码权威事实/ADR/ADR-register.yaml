- adr_id: ADR-024
  decision_id: PEND-R3-007
  title: 平台运维人员默认角色组合
  status: ACCEPTED
  decision: 不新增万能运维角色。平台运维人员默认采用受限组合授权：Runner注册与绑定、工具集成故障管理、技术告警端点管理、运行诊断、审计只读以及受控制品清理。默认组合不得获得业务用例或业务资产编辑、敏感凭证明文查看、用户/角色/项目成员授权、跨项目业务数据访问等权限。
  authority: USER_APPROVED_RECOMMENDED_SCHEME
