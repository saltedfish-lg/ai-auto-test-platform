- adr_id: ADR-025
  decision_id: PEND-R3-008
  title: 用例与资产版本双人复核策略
  status: ACCEPTED
  decision: 普通资产由项目配置是否需要审核；AI探索和人工录制生成的候选版本在发布前必须由真实USER人工确认。共享资产、跨项目资产以及敏感账号/凭证资产必须双人复核，提交人和审核人必须是不同USER；SERVICE_ACCOUNT不得充当审核人；admin和SUPER_ADMIN不得静默绕过，任何例外均必须形成显式高风险操作和不可变审计。
  authority: USER_APPROVED_RECOMMENDED_SCHEME
  effective_release_id: PDBR-2026.08.06-R2
