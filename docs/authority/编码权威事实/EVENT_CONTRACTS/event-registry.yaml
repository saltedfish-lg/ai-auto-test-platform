authentication_audit_contract:
  decision: NO_NEW_DOMAIN_EVENTS_FOR_P1_AUTHENTICATION
  reason: P1认证与普通用户治理动作没有跨边界事件消费者，使用不可变安全审计；仅默认admin初始化沿用admin.active与user.active，atp_user_role_binding不得冒充OBJ-087发布role_binding事件。
  reused_domain_events:
  - admin.active
  - user.active
  audit_actions:
  - LOGIN_SUCCEEDED
  - LOGIN_FAILED
  - REFRESH_SUCCEEDED
  - REFRESH_FAILED
  - LOGOUT
  - PASSWORD_CHANGED
  - CREDENTIAL_RESET
  - SESSION_REVOKED
  - USER_CREATED
  - USER_ENABLED
  - USER_DISABLED_OR_LOCKED
  - ROLE_ASSIGNED
  - ROLE_REVOKED
  - PERMISSION_DENIED
  forbidden_fields:
  - password
  - password_hash
  - access_token
  - refresh_token
  - cookie
  - secret
  - database_credential
