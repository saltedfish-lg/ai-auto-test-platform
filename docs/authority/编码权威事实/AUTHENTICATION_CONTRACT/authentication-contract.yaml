  adr: ADR-032 + ADR-033
scope:
  included:
  - 平台用户密码认证
  - 默认admin安全初始化
  - Browser Access JWT与Refresh Session
  - 当前用户、登出、刷新和改密
  - 管理员创建普通用户、重置凭据、启停用户及管理User-Role Binding
  - Login与Refresh的MySQL共享来源级限流
  - 认证状态检查、撤销、审计及与RBAC的边界
  excluded:
  - 普通用户自助注册
  - V1强制SSO
  - Runner、Worker和Agent身份认证
  - 项目、环境、执行、报告、AI及其他后续业务域
authentication:
  mechanism: BEARER_JWT_ACCESS_WITH_REVOCABLE_REFRESH_SESSION
  identity_key: atp_user.username
  username_rule: admin用户名固定为admin；其他用户由具备正式权限的管理员创建，不开放自助注册。
  api_identity_resolution: 每个受保护请求从JWT subject解析user_id，并校验用户、凭据版本和Session当前状态。
  permissions_in_access_token: false
  permission_resolution: 每个受保护请求按当前数据库Role、Role-Permission Mapping、项目成员关系、数据范围和资源归属实时计算。
  runner_worker_authentication: OUT_OF_P1_SCOPE
access_token:
  format: JWT
  token_use: access
  signing_algorithm: RS256
  key_id_required: true
  key_ring_source: ATP_JWT_KEY_RING_FILE指向受控JWT Key Ring清单文件；私钥材料只能由该清单引用的受控秘密文件加载，不得提交到仓库。
  key_ring_contract:
    active_signing_key: 必须且只能有1个active_signing_kid；签名只允许使用该key。
    previous_verification_keys: 允许保留已退出签名但仍处于verify_until窗口内的previous key。
    minimum_overlap_seconds: 960
    kid_validation: unknown kid、尚未激活key、超过verify_until的retired key全部失败关闭。
    rotation_rule: 新key激活后，旧key至少保留Access TTL 900秒 + clock skew 60秒的验证重叠窗口。
  issuer: ai-auto-test-platform
  audience: ai-auto-test-platform-api
  ttl_seconds: 900
  clock_skew_seconds: 60
  required_claims:
    iss: 固定issuer
    aud: 固定audience
    sub: user_id
    iat: 签发时间
    exp: 到期时间
    jti: 每个Access Token唯一ULID
    token_use: 固定access
    session_id: 当前Refresh Session标识
    credential_version: 签发时凭据版本
  request_validation:
  - 验证RS256签名、kid、issuer、audience、token_use、iat、exp和jti。
  - 查询当前user、platform_user_credential和auth_refresh_session；user必须为ACTIVE，凭据必须ACTIVE，Session必须ACTIVE。
  - JWT credential_version必须等于数据库当前版本；不得仅凭JWT内字段绕过数据库状态。
  - 权限不得固化在JWT中，角色或权限变更对新请求实时生效。
refresh_session:
  enabled: true
  token_format: 32字节密码学安全随机数的base64url不透明值
  persistence: SERVER_SIDE_MYSQL
  persisted_secret: SHA256_TOKEN_HASH_ONLY
  ttl_seconds: 604800
  absolute_expiry: true
  rotation: REQUIRED_ON_EVERY_REFRESH
  replay_detection: 已ROTATED的Token再次使用时将同family全部标记COMPROMISED并拒绝。
  multiple_sessions: 每用户最多5个ACTIVE Session；创建第6个时撤销最早的ACTIVE Session并记录审计。
  logout: 撤销Cookie对应Session；缺失或已撤销Session仍返回204，因此登出幂等。
  user_disabled: 用户进入LOCKED、DISABLED、ARCHIVED或LOGICALLY_DELETED时，同事务撤销其全部ACTIVE Session；后续Access请求也因实时用户状态校验失效。
  password_changed: 凭据版本递增并撤销全部旧Session；改密返回204且不创建或签发新Session、Access Token或Refresh Token，客户端必须重新登录。
  credential_reset: 凭据版本递增、force_password_change设为true并撤销全部Session。
browser_transport:
  access_token: 仅保存在运行时内存，通过Authorization Bearer头发送；禁止localStorage、sessionStorage和持久化IndexedDB。
  refresh_token: 仅由名为atp_refresh的HttpOnly Cookie承载，不进入JSON响应。
  cookie_attributes:
    http_only: true
    secure: true
    same_site: Strict
    path: /api/v1/auth
    max_age_seconds: 604800
  local_loopback_exception: 仅localhost/127.0.0.1无TLS开发模式可关闭Secure；其他环境禁止。
  csrf_boundary: 使用Refresh Cookie的refresh/logout端点必须验证同源Origin或Sec-Fetch-Site；其他写操作只接受Bearer Access Token。
supporting_objects:
- object_id: AUTH-OBJ-001
  canonical_name: platform_user_credential
  owner: CredentialService
  aggregate_owner: OBJ-001
  table: atp_platform_user_credential
  primary_key: credential_id
  business_unique_key: user_id
  lifecycle_values: [ACTIVE, REVOKED]
  delete_semantics: 不物理删除；用户归档或逻辑删除时撤销凭据并保留安全审计。
- object_id: AUTH-OBJ-002
  canonical_name: auth_refresh_session
  owner: SessionService
  aggregate_owner: AUTH-OBJ-001
  table: atp_auth_refresh_session
  primary_key: session_id
  business_unique_key: token_hash
  lifecycle_values: [ACTIVE, ROTATED, REVOKED, EXPIRED, COMPROMISED]
  delete_semantics: 到期或撤销后至少保留30天用于安全审计，再由受控清理任务删除。
- object_id: AUTH-OBJ-003
  canonical_name: auth_security_audit
  owner: AuthenticationAuditService
  aggregate_owner: SECURITY_AUDIT_TECHNICAL_BOUNDARY
  table: atp_auth_security_audit
  primary_key: audit_id
  business_unique_key: audit_id
  lifecycle_values: [APPEND_ONLY]
  delete_semantics: 禁止UPDATE和DELETE；MySQL trigger强制不可变，只允许INSERT。
- object_id: AUTH-OBJ-004
  canonical_name: auth_source_rate_limit
  owner: AuthenticationRateLimitService
  aggregate_owner: AUTHENTICATION_SECURITY_BOUNDARY
  table: atp_auth_source_rate_limit
  primary_key: source_key_hash+operation_id+window_started_at
  business_unique_key: source_key_hash+operation_id+window_started_at
  lifecycle_values: [ACTIVE_WINDOW, EXPIRED]
  delete_semantics: expires_at到期后允许受控批量清理；不得保存原始来源IP。
credential:
  credential_type: PASSWORD
  lifecycle_status: ACTIVE
  credential_version_initial: 1
  credential_version_rule: 每次密码修改或管理员重置原子递增；Access Token必须匹配当前值。
  force_password_change_owner: CredentialService
  optimistic_lock: row_version
  one_active_password_credential_per_user: true
  password_hash_export: FORBIDDEN
  plaintext_storage: FORBIDDEN
  temporary_credential_generation: 服务端使用密码学安全随机源生成满足当前密码策略的高强度临时密码；调用方不得提交临时密码。
  temporary_credential_delivery: 仅在create_user或reset_user_credential成功响应中展示一次；常规User查询、列表、审计、日志、trace、report和artifact均不得包含。
  credential_reset: 新哈希替换旧哈希、credential_version原子递增、force_password_change=true并撤销全部ACTIVE Refresh Session；旧密码立即失效。
password_policy:
  minimum_length: 12
  maximum_length: 128
  required_character_classes:
  - LETTER
  - DIGIT
  special_character_required: false
  whitespace: 允许内部空白；禁止首尾空白和全空白密码。
  username_equality: 禁止与username大小写不敏感地相同。
  common_passwords: 必须拒绝部署内置且可升级的常见弱密码拒绝列表；拒绝列表不得记录用户输入。
  periodic_expiry: V1不强制定期过期。
  password_history: V1不保留历史密码，仅禁止新密码与当前密码相同。
  change_password_session_effect: 凭据版本递增并撤销全部旧Session；返回204，不签发任何Token，客户端清理认证状态并重新登录。
password_hash:
  algorithm: Argon2id
  implementation: 成熟维护库；禁止自实现算法。
  phc_version: 19
  memory_cost_kib: 65536
  time_cost: 3
  parallelism: 1
  salt_length_bytes: 16
  hash_length_bytes: 32
  encoding: PHC_STRING_INCLUDES_PARAMETERS_AND_SALT
  rehash_policy: 成功验证后发现版本或参数低于当前策略时，在同一安全事务中重新哈希并更新；不得降低参数。
login_failure_policy:
  invalid_identity_or_password_external_code: AUTH_INVALID_CREDENTIALS
  enumeration_protection: 用户不存在时执行固定Dummy Argon2id校验；用户不存在与密码错误使用相同401响应。
  threshold: 5
  rolling_window_seconds: 900
  lock_duration_seconds: 900
  lock_owner: CredentialService
  lock_storage: locked_until与失败窗口字段；不改变用户业务生命周期。
  successful_login: 清零失败次数、窗口和locked_until，并记录last_successful_login_at。
  correct_password_but_temporary_lock: 403 AUTH_ACCOUNT_TEMPORARILY_LOCKED
auth_hmac_key_ring:
  configuration: ATP_AUTH_HMAC_MASTER_KEY_FILE
  format: STRICT_JSON_RING
  root_fields: [ring_version, active_key_id, keys]
  key_fields: [key_id, key_material, activated_at, retired_at_if_previous, accept_until_if_previous]
  key_material: base64url解码后至少32字节；不得进入日志、审计、持久化业务数据或对象repr。
  lifecycle: 唯一active key用于新HMAC；previous仅在retired_at <= now < accept_until时参与兼容读取；允许尚未激活的staged key但不得提前使用。
  minimum_rotation_overlap_seconds: 86400
  derivation: HKDF-SHA256，使用固定版本salt和source-rate-limit、change-password-fingerprint、idempotency-storage-key三个独立domain label。
  startup_policy: 文件缺失、不可读、为空、JSON或schema无效、active不唯一、key过短、UTC时间无效或previous重叠不足时启动失败关闭。
source_rate_limit:
  enabled: true
  state_owner: AuthenticationRateLimitService
  persistence: MYSQL84_SHARED_STATE
  algorithm: FIXED_UTC_WINDOW
  window_seconds: 300
  limits:
    login_platform_user: 60
    refresh_platform_session: 300
  source_identity:
    default: DIRECT_TCP_HTTP_PEER_IP
    canonicalization: Python ipaddress规范化IPv4/IPv6后，以部署秘密HMAC-SHA256生成source_key_hash；数据库不得保存原始IP。
    trusted_proxy_config: ATP_TRUSTED_PROXY_CIDRS；默认空集合。
    forwarded_policy: 仅直接peer属于TRUSTED_PROXY_CIDRS时解析Forwarded，缺失时才解析X-Forwarded-For；从右向左剥离可信代理，首个非可信规范地址为来源。
    untrusted_policy: 直接peer不可信时无条件忽略Forwarded与X-Forwarded-For。
    invalid_forwarded_policy: 解析失败时使用直接peer，禁止以无效Header绕过限流。
  external_response:
    status: 429
    code: AUTH_SOURCE_RATE_LIMITED
    retry_after: 距当前5分钟UTC窗口结束的整秒数，最小1、最大300；必须输出合法Retry-After响应头。
    enumeration_protection: 不得泄漏账号或Refresh Session是否存在。
  concurrency: 每个source_key_hash+operation_id+window_started_at由MySQL唯一键和行级锁串行计数，多实例共享同一结果。
  failure_policy: MySQL限流状态不可用时失败关闭为503，不得绕过来源级限流继续认证。
  cleanup: expires_at索引支持受控批量删除过期窗口；在线请求不得执行无界清理。
admin_bootstrap:
  username: admin
  command_contract: 显式bootstrap-admin命令；禁止普通API或Vue触发首次初始化。
  local_secret_input: 交互式TTY无回显输入并二次确认。
  automation_secret_input: ATP_BOOTSTRAP_ADMIN_PASSWORD_FILE指向受控秘密文件；禁止通过命令行参数传递密码。
  input_exclusivity: 交互输入与秘密文件必须且只能选择一种。
  transaction:
  - 创建ACTIVE的atp_user admin。
  - 创建ACTIVE平台密码凭据并以Argon2id哈希，credential_version=1，force_password_change=true。
  - 创建atp_admin并绑定ROLE-SUPER-ADMIN正式关系。
  - 写初始化幂等记录、审计及现有正式Outbox状态事件。
  - 任一步失败整体回滚。
  idempotency_key: SYSTEM_BOOTSTRAP_ADMIN_V1
  repeated_execution: admin或初始化记录已存在时返回ALREADY_INITIALIZED，不创建、不覆盖密码、不重置凭据版本。
  delivery: 密码由操作者输入，不由系统生成或输出；初始化结果只报告成功、对象ID和哈希算法元数据。
  force_password_change: true
  immutable_rules:
  - admin不可删除、禁用、归档或改名。
  - admin与ROLE-SUPER-ADMIN的正式绑定不可解除。
  - admin权限只能由正式Role-Permission Mapping得到，禁止用户名后门。
first_password_change:
  required_for_bootstrap_admin: true
  required_for_admin_created_users_with_temporary_password: true
  allowed_operations_before_change:
  - get_current_user
  - change_current_user_password
  - logout_platform_user
  forbidden_behavior: 其他受保护Operation返回403 AUTH_PASSWORD_CHANGE_REQUIRED；refresh也被拒绝，用户可重新登录后完成改密。
  completion: 成功改密后force_password_change=false、credential_version递增、旧Session全部撤销并返回204；当前客户端清理内存身份并跳转登录页，不签发新Token。
user_administration:
  create_user:
    permission: USER_CREATE + ROLE_BIND；请求包含项目级binding或DataScopeGrant时还要求PROJECT_MEMBER_MANAGE。
    transaction: User、PASSWORD Credential、至少一个UserRoleBinding、指定DataScopeGrant、幂等记录和安全审计在同一事务提交；任一步失败整体回滚。
    initial_state: user=ACTIVE、credential=ACTIVE、credential_version=1、force_password_change=true。
    response: 首次成功返回201和delivery_status=ISSUED，并只在该响应返回一次性temporary_password；相同Idempotency-Key与相同非秘密请求指纹重放返回200和delivery_status=ALREADY_DELIVERED且不含temporary_password；禁止后续查询。
  credential_reset:
    permission: USER_CREATE
    response: 首次成功返回200和delivery_status=ISSUED，并只返回新的一次性temporary_password；相同Idempotency-Key与相同非秘密请求指纹重放返回200和delivery_status=ALREADY_DELIVERED且不含temporary_password；不返回旧凭据。
    transaction: 更新密码哈希与credential_version、设置force_password_change、撤销Refresh Session、幂等记录和审计同事务。
  user_state_commands:
    permission: USER_CREATE
    enable: 仅将允许恢复的普通用户状态转为ACTIVE。
    disable: 将普通用户转为DISABLED并同事务撤销全部ACTIVE Refresh Session。
  role_binding:
    persistence: 复用atp_user_role_binding和atp_data_scope_grant；不得使用平行Role Binding模型承载认证授权事实。
    project_scoped_realtime_authorization: project_id非空的实时请求必须同时满足有效UserRoleBinding、同project_id且ACTIVE的ProjectMember职责，并要求ProjectMember.role_id与该UserRoleBinding.role_id一致；仅有项目成员关系或仅有项目级binding均不得授权。所有project-scoped Role Binding写操作必须使用请求/目标Binding自己的project_id作为实时AuthorizationContext，禁止用其它项目或聚合/me权限授权目标项目写入。ROLE-SUPER-ADMIN按平台最高权限契约处理；ROLE-PLATFORM-ADMIN仍受目标项目显式DataScopeGrant约束但不要求项目职责绑定。
    create: ROLE_BIND权限；project_id非空时ROLE_BIND与PROJECT_MEMBER_MANAGE都必须针对目标project_id实时授权；create_user中携带的初始project-scoped Role Binding适用同一规则；平台级binding附带DataScopeGrant时仍要求PROJECT_MEMBER_MANAGE；创建ACTIVE binding及指定DataScopeGrant并写ROLE_ASSIGNED审计。
    revoke: ROLE_BIND权限；项目级binding在实际写入前还必须针对被撤销Binding.project_id实时满足ROLE_BIND与PROJECT_MEMBER_MANAGE；设置valid_to并递增row_version，不物理删除，写ROLE_REVOKED审计。
  optimistic_lock: 更新、启停、重置和撤销命令必须提交expected_version并原子递增对应row_version。
  admin_protection:
  - admin不可删除、禁用、锁定、归档、逻辑删除或改名。
  - admin与ROLE-SUPER-ADMIN的有效UserRoleBinding不可撤销、失效或替换。
  - 所有User、Credential、UserRoleBinding写路径都必须服务端强制这些规则；前端隐藏不是安全边界。
change_password_idempotency:
  key_scope: principal+change_current_user_password+Idempotency-Key
  request_fingerprint: 对current_password与new_password的规范请求使用部署秘密HMAC-SHA256；只保存不可逆摘要，不保存密码或Token。
  first_success: 密码只变更一次、credential_version只递增一次、Session撤销为一个逻辑操作、记录terminal 204结果。
  same_key_same_fingerprint: 返回逻辑等价204，不再校验已失效旧密码，不重复任何变更、审计或Session撤销。
  same_key_different_fingerprint: 返回409 AUTH_IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_REQUEST。
  concurrency: 先以atp_idempotency_record唯一行claim或锁定同key请求，再按User→Credential→Session固定顺序加锁；并发相同key收敛为一次逻辑成功，竞争请求在首事务提交后读取terminal记录并返回204。
  retention: V7改密幂等记录使用contract_version=2并保留24小时后清理；response_json必须为空，不保存Access Token、Refresh Token、密码或可恢复秘密。升级前既有记录保留contract_version=1直至自然过期，V7不得假定能从旧request_hash回填principal。
change_password_business_validation:
  authentication_boundary: 用户已通过Access Token与服务端Session实时校验后，当前密码和新密码业务校验失败不属于未认证或权限拒绝。
  current_password_invalid: HTTP 400 + AUTH_CURRENT_PASSWORD_INVALID
  password_policy_violation: HTTP 400 + AUTH_PASSWORD_POLICY_VIOLATION
  password_unchanged: HTTP 400 + AUTH_PASSWORD_UNCHANGED
  unauthenticated_boundary: HTTP 401仅用于当前请求缺少有效认证凭据，例如Access Token或Session无效、过期或已撤销。
  forbidden_boundary: HTTP 403仅用于身份已认证但无权执行目标操作；force_password_change等状态门禁保持各自已声明的403语义。
  schema_validation_boundary: HTTP 422 + AUTH_REQUEST_VALIDATION_FAILED仅用于请求字段、类型、长度、枚举、格式或extra字段校验失败，不得承载改密业务校验。
state_model:
  user_business_state_owner: UserAggregateService owns atp_user.lifecycle_status
  login_allowed_user_state: ACTIVE
  enabled_normalization: 旧规则中的ENABLED统一规范化为ACTIVE；不新增ENABLED枚举。
  user_locked_semantics: atp_user.lifecycle_status=LOCKED表示管理员控制的无限期账号锁定。
  user_disabled_semantics: DISABLED表示业务停用；LOCKED、DISABLED、ARCHIVED和LOGICALLY_DELETED均禁止登录并撤销Session。
  credential_state_owner: CredentialService owns credential.lifecycle_status、credential_version、force_password_change和失败锁字段。
  security_normal_semantics: lifecycle_status=ACTIVE且locked_until为空或已过期；NORMAL为派生语义，不增加security_status列。
  temporary_security_lock: locked_until晚于当前时间；不改变atp_user.lifecycle_status。
  session_state_owner: SessionService owns auth_refresh_session.lifecycle_status与rotation/revoke字段。
  audit_immutability_owner: AuthenticationAuditService owns atp_auth_security_audit append-only写入；数据库trigger拒绝UPDATE/DELETE。
  source_rate_limit_owner: AuthenticationRateLimitService owns atp_auth_source_rate_limit窗口计数和过期清理；原始来源IP不持久化。
operations:
- operation_id: login_platform_user
  method: POST
  path: /api/v1/auth/login
  authentication: NONE
  permission: NONE
  idempotency: NOT_REQUIRED
  audit: SUCCESS_AND_FAILURE
- operation_id: refresh_platform_session
  method: POST
  path: /api/v1/auth/refresh
  authentication: REFRESH_COOKIE
  permission: NONE
  idempotency: ROTATION_REPLAY_SAFE_NOT_IDEMPOTENCY_KEY
  audit: SUCCESS_AND_REPLAY_OR_FAILURE
- operation_id: logout_platform_user
  method: POST
  path: /api/v1/auth/logout
  authentication: REFRESH_COOKIE_OPTIONAL
  permission: NONE
  idempotency: IDEMPOTENT_204
  audit: WHEN_SESSION_RESOLVED
- operation_id: get_current_user
  method: GET
  path: /api/v1/auth/me
  authentication: BEARER_ACCESS_TOKEN
  permission: NONE
  idempotency: SAFE_READ
  audit: NOT_REQUIRED_EXCEPT_DENIAL
- operation_id: change_current_user_password
  method: POST
  path: /api/v1/auth/change-password
  authentication: BEARER_ACCESS_TOKEN
  permission: NONE
  idempotency: IDEMPOTENCY_KEY_REQUIRED
  audit: REQUIRED
- operation_id: create_user
  method: POST
  path: /api/v1/user
  authentication: BEARER_ACCESS_TOKEN
  permission: USER_CREATE+ROLE_BIND；项目或数据范围存在时附加PROJECT_MEMBER_MANAGE
  idempotency: IDEMPOTENCY_KEY_REQUIRED
  audit: USER_CREATED_AND_ROLE_ASSIGNED
- operation_id: reset_user_credential
  method: POST
  path: /api/v1/user/{id}/credential-reset
  authentication: BEARER_ACCESS_TOKEN
  permission: USER_CREATE
  idempotency: IDEMPOTENCY_KEY_REQUIRED
  audit: CREDENTIAL_RESET_AND_SESSION_REVOKED
- operation_id: enable_user
  method: POST
  path: /api/v1/user/{id}/enable
  authentication: BEARER_ACCESS_TOKEN
  permission: USER_CREATE
  idempotency: IDEMPOTENCY_KEY_REQUIRED
  audit: USER_ENABLED
- operation_id: disable_user
  method: POST
  path: /api/v1/user/{id}/disable
  authentication: BEARER_ACCESS_TOKEN
  permission: USER_CREATE
  idempotency: IDEMPOTENCY_KEY_REQUIRED
  audit: USER_DISABLED_OR_LOCKED
- operation_id: create_user_role_binding
  method: POST
  path: /api/v1/user-role-binding
  authentication: BEARER_ACCESS_TOKEN
  permission: ROLE_BIND；项目或数据范围存在时附加PROJECT_MEMBER_MANAGE
  idempotency: IDEMPOTENCY_KEY_REQUIRED
  audit: ROLE_ASSIGNED
- operation_id: revoke_user_role_binding
  method: POST
  path: /api/v1/user-role-binding/{id}/revoke
  authentication: BEARER_ACCESS_TOKEN
  permission: ROLE_BIND；项目或数据范围存在时附加PROJECT_MEMBER_MANAGE
  idempotency: IDEMPOTENCY_KEY_REQUIRED
  audit: ROLE_REVOKED
error_semantics:
  business_validation_400:
  - AUTH_CURRENT_PASSWORD_INVALID
  - AUTH_PASSWORD_POLICY_VIOLATION
  - AUTH_PASSWORD_UNCHANGED
  request_validation_422:
  - AUTH_REQUEST_VALIDATION_FAILED
  request_validation_rule: 所有正式API在请求字段、类型、长度、枚举、格式或extra字段校验失败时统一返回422 application/problem+json与AUTH_REQUEST_VALIDATION_FAILED；不得复用AUTH_INVALID_CREDENTIALS或AUTH_OPERATION_FORBIDDEN_FOR_STATE。
  unauthenticated_401:
  - AUTH_REQUIRED
  - AUTH_INVALID_CREDENTIALS
  - AUTH_TOKEN_INVALID
  - AUTH_TOKEN_EXPIRED
  - AUTH_SESSION_REVOKED
  - AUTH_IDENTITY_NOT_FOUND
  forbidden_403:
  - AUTH_PERMISSION_DENIED
  - AUTH_ACCOUNT_LOCKED
  - AUTH_ACCOUNT_DISABLED
  - AUTH_ACCOUNT_ARCHIVED
  - AUTH_ACCOUNT_TEMPORARILY_LOCKED
  - AUTH_PASSWORD_CHANGE_REQUIRED
  - AUTH_OPERATION_FORBIDDEN_FOR_STATE
  conflict_409:
  - AUTH_IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_REQUEST
  - AUTH_ADMIN_IMMUTABLE
  - AUTH_ROLE_BINDING_PROTECTED
  - AUTH_CONCURRENCY_CONFLICT
  rate_limited_429:
  - AUTH_SOURCE_RATE_LIMITED
  service_unavailable_503:
  - AUTH_RATE_LIMIT_STATE_UNAVAILABLE
  response_media_type: application/problem+json
  response_schema: AuthenticationProblemDetails（结构兼容RFC 9457 ProblemDetails）
audit_contract:
  persistence_table: atp_auth_security_audit
  owner: AuthenticationAuditService
  immutability: INSERT_ONLY; UPDATE/DELETE由MySQL trigger拒绝。
  transaction_rule: 安全敏感状态变更与对应审计必须在同一事务提交；审计写入失败时业务变更整体回滚。
  event_rule: P1认证安全审计不产生新的认证领域Event/Outbox。
  required_actions:
  - LOGIN_SUCCEEDED
  - LOGIN_FAILED
  - REFRESH_SUCCEEDED
  - REFRESH_FAILED
  - LOGOUT
  - PASSWORD_CHANGED
  - CREDENTIAL_RESET
  - SESSION_REVOKED
  - USER_CREATED
  - USER_ENABLED
  - USER_DISABLED_OR_LOCKED
  - ROLE_ASSIGNED
  - ROLE_REVOKED
  - PERMISSION_DENIED
  required_fields: [actor_id, target_user_id_if_known, session_id_if_known, result_code, correlation_id, occurred_at, source_context_hash]
  forbidden_fields: [password, password_hash, access_token, refresh_token, cookie, secret, database_credential]
event_contract:
  decision: AUTHENTICATION_SECURITY_ACTIONS_ARE_AUDIT_ONLY_IN_P1
  reason: P1没有冻结跨边界认证事件消费者；登录、失败、登出、改密和撤销通过不可变审计表达，不新增领域事件。用户、admin和角色绑定的既有状态事件继续复用。
rbac_boundary:
  permissions: 50
  roles: 12
  mappings: 600
  super_admin_role: ROLE-SUPER-ADMIN
  super_admin_authorization: 仅通过正式Role-Permission Mapping获得权限；禁止username特判。
  authentication_vs_authorization: 认证确定主体，RBAC与数据范围确定操作许可；401与403严格区分。
acceptance_contract:
  reused_range: ACC-R3-1602..1688
  test_range: CT-R3-1602..1688
  status: PASSED
  evidence_status: VERIFIED
  required_coverage:
  - admin首次且仅一次初始化、保护与超级管理员绑定
  - RBAC Seed 幂等且行数必须与当前 permission/role/mapping 明细定义完全一致
  - 登录成功、错误密码、用户不存在、禁用、管理员锁定和临时安全锁
  - Token过期、无效、撤销、Refresh rotation与重放检测
  - Logout幂等、当前用户、401、403和实时权限
  - 强制改密、改密后旧Session失效、用户禁用后Session失效
  - 管理员创建普通用户时一次性临时凭据、Credential Reset、User启停、Role Binding创建与撤销、admin不可变保护
  - Login 60/5m与Refresh 300/5m来源级限流、可信代理边界、429与Retry-After、多实例并发和过期清理
  - Change Password返回204、不签发Token、相同幂等请求重放204、不同指纹409和并发仅一次逻辑变更
  - 初始化秘密不进入仓库、密码不明文落库、Token不进入日志
