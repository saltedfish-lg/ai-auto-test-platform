slo:
  PRD-NFR-001:
    statement: V1生产环境控制面月度可用率不得低于99.5%；提前公告的计划维护窗口不计入可用率；开发环境和测试环境不作为正式SLA考核对象。
    acceptance_direction: 按自然月统计生产控制面可用分钟数；以外部探针和服务端健康指标双源取证；剔除已公告维护窗口；月度可用率必须≥99.5%。
    slo_contract:
      metric: control_plane_monthly_availability
      target: 0.995
      window: CALENDAR_MONTH
      environment: PRODUCTION
      exclusions:
      - ANNOUNCED_PLANNED_MAINTENANCE
      evidence:
      - synthetic_probe_timeseries
      - service_health_timeseries
      - maintenance_window_registry
  PRD-NFR-002:
    statement:
      在标准V1容量和正常网络条件下，普通查询P95≤500ms、P99≤1000ms；普通写入P95≤800ms、P99≤1500ms；异步命令受理P95≤300ms、P99≤800ms。文件上传下载、AI模型调用和浏览器执行不适用普通API指标，必须使用各自专用超时与性能验收规则。
    acceptance_direction: 在标准V1容量、正常网络、稳定预热后分别对普通查询、普通写入和异步命令受理采集不少于10000个有效样本；按服务端端到端时延计算P95/P99；专用长任务不得混入普通API统计。
    slo_contract:
      conditions:
      - STANDARD_V1_CAPACITY
      - NORMAL_NETWORK
      - WARMED_UP
      sample_minimum: 10000
      metrics:
        ordinary_query_ms:
          p95: 500
          p99: 1000
        ordinary_write_ms:
          p95: 800
          p99: 1500
        async_command_accept_ms:
          p95: 300
          p99: 800
      excluded_categories:
      - FILE_TRANSFER
      - AI_MODEL_CALL
      - BROWSER_EXECUTION
  PRD-NFR-003:
    statement: 当存在健康、已绑定、能力匹配的空闲Runner，且无环境锁、账号租约和资源冲突时，任务从进入可调度状态到Runner成功领取的时延必须满足P95≤3秒、P99≤10秒。
    acceptance_direction: 构造健康且能力匹配的空闲Runner、无锁租约冲突的标准调度场景，采集不少于5000次从SCHEDULABLE到CLAIMED的服务端时钟差；P95≤3秒且P99≤10秒。
    slo_contract:
      metric: schedulable_to_runner_claim_ms
      sample_minimum: 5000
      p95_ms: 3000
      p99_ms: 10000
      preconditions:
      - HEALTHY_BOUND_CAPABILITY_MATCHED_IDLE_RUNNER
      - NO_ENVIRONMENT_LOCK
      - NO_ACCOUNT_LEASE
      - NO_RESOURCE_CONFLICT
state_contract:
  owner_rule: 每个状态维度唯一聚合Owner；生命周期与正交状态分列持久化
  optimistic_lock: 所有可变聚合写入必须提交expected_version并原子递增row_version
  current_facts_source: tools/current_facts.py#domain
database_contract:
  engine: MySQL 8.4 LTS
  patch_version_policy: ANY_8_4_X_WITH_CURRENT_FULL_SCHEMA_GATE_PASS
  patch_version_evidence_rule: Patch版本不作为长期Authority固定值；每次真实Gate记录实际SELECT VERSION()结果，迁移头变化或环境Patch变化后重新执行相应Gate。
  id_type: CHAR(26) ULID
  json_rule: extension_json仅保存非契约扩展；状态、关系、权限和唯一键必须物理化
  connection_configuration:
    authority_owner: 编码权威事实/SYSTEM_DESIGN.yaml
    application_database_url_env: ATP_DATABASE_URL
    application_database_role: 当前开发数据库的正常应用开发、联调与非破坏性运行连接
    local_development_database: ai_auto_test_platform_dev
    mysql_admin_url_env: ATP_MYSQL_ADMIN_URL
    mysql_admin_role: MySQL实例级管理连接；Full Schema Gate与认证MySQL Gate统一通过ATP_MYSQL_ADMIN_URL使用，仅供隔离Gate数据库创建、删除、Migration与约束验证
    secret_handling: 环境注入；仓库、Authority、日志、异常和测试制品不得包含密码或完整DSN
  credential_revision_identity: credential_revision_id; UNIQUE(test_account_id, revision_no)
  technical_alert_endpoint_identity: technical_alert_endpoint_id; UNIQUE(endpoint_code)
  run_task_initial_final_result: UNKNOWN
  rbac_model: permission_code/role/role_permission/user_role_binding/data_scope_grant relational closure
  technical_alert_ingestion_batch_unique: UNIQUE(technical_alert_endpoint_id, batch_key)
  platform_user_credential: atp_platform_user_credential; UNIQUE(user_id); Argon2id PHC only; credential_version and force_password_change
    owned by CredentialService
  auth_refresh_session: atp_auth_refresh_session; UNIQUE(token_hash); opaque token SHA-256 only; SessionService owns rotation/revoke
    lifecycle
  auth_security_audit: atp_auth_security_audit; append-only; AuthenticationAuditService owns insert; UPDATE/DELETE rejected by MySQL trigger
  auth_source_rate_limit: atp_auth_source_rate_limit; HMAC-SHA256 source key only; fixed UTC 300-second window; MySQL unique key and row
    lock provide multi-instance consistency; expires_at index supports bounded cleanup
  auth_hmac_key_ring: ATP_AUTH_HMAC_MASTER_KEY_FILE; strict JSON; minimum 32-byte master keys; HKDF-SHA256 domain separation; active write
    plus retired_at<=now<accept_until compatible read; rotation overlap at least 86400 seconds; invalid config fails startup
  jwt_key_ring: ATP_JWT_KEY_RING_FILE; one active signing key plus previous verification keys; minimum overlap 960 seconds; unknown/expired
    kid fail-closed
  migration_execution:
    selected_tool: Flyway
    authority_source: docs/authority/编码权威事实/DATABASE_DDL
    current_executable_gate: docs/authority/validation/run_mysql84_gate.py
    current_executor: DIRECT_MYSQL_CLIENT_OR_CONTAINER_MYSQL_CLIENT
    flyway_runtime_integration_status: SELECTED_BUT_NOT_YET_WIRED_IN_REPOSITORY
    truth_rule: 当前仓库未接入 Flyway runtime；在接线完成前，Full-schema Gate 必须执行由 tools/current_facts.py 机械发现的完整正式 Migration 链；历史专项证据不得冒充当前 Full-schema
      PASS。
    full_schema_gate_status_source: 编码权威事实/SYSTEM_DESIGN.yaml#runtime_gate_contract.gates[FULL_SCHEMA_MYSQL84_RUNTIME_GATE].status
    migration_discovery_source: tools/current_facts.py#migration
    admin_connection_env: ATP_MYSQL_ADMIN_URL
  authentication_runtime_evidence:
    mysql:
      command: python tools/gates/auth_mysql_gate.py
      status_name: AUTH_MYSQL_RUNTIME_GATE
      historical_evidence_status: PASS_HISTORICAL_V3_TO_V7
      verified_server_version: 8.4.11
      verified_migration_order: V3_TO_V7
      isolated_database_prefix: ai_auto_test_platform_gate_auth_
      destructive_target_policy: 只允许唯一隔离临时数据库；不得默认操作ai_auto_test_platform_dev
      cleanup_policy: 成功或失败均尽最大努力删除；失败只报告数据库名，不报告完整DSN
      current_status_source: SYSTEM_DESIGN.runtime_gate_contract.gates[AUTH_MYSQL_RUNTIME_GATE].status
    browser:
      command: python tools/gates/auth_browser_gate.py
      status_name: AUTH_BROWSER_RUNTIME_GATE
      historical_or_blocker_evidence: RESOLVED_BY_AUTH_BROWSER_RUNTIME_GATE_PASS_2026_08_14
      browser: REAL_CHROMIUM
      database_policy: 使用同一管理员连接创建独立认证Gate临时数据库，不得使用开发库
      current_status_source: SYSTEM_DESIGN.runtime_gate_contract.gates[AUTH_BROWSER_RUNTIME_GATE].status
  mysql84_runtime_gate_status_source: 编码权威事实/SYSTEM_DESIGN.yaml#runtime_gate_contract.gates[FULL_SCHEMA_MYSQL84_RUNTIME_GATE].status
  browser_runtime_gate_status_source: SYSTEM_DESIGN.runtime_gate_contract.gates[AUTH_BROWSER_RUNTIME_GATE].status
  current_facts_source: tools/current_facts.py#database
api_contract:
  version: OpenAPI 3.1.2
  typed_dto: true
  idempotency: 所有写操作要求Idempotency-Key
