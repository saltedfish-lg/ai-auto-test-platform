  - revoke_user_role_binding
authentication_contract:
  authority: 编码权威事实/AUTHENTICATION_CONTRACT/authentication-contract.yaml
  mechanism: RS256 Bearer Access JWT + server-side revocable rotating Refresh Session
  access_token_ttl_seconds: 900
  refresh_session_ttl_seconds: 604800
  browser_access_storage: MEMORY_ONLY
  browser_refresh_storage: HTTP_ONLY_SECURE_SAME_SITE_STRICT_COOKIE
  password_hash: Argon2id v19; m=65536KiB; t=3; p=1; salt=16 bytes; hash=32 bytes
  password_policy: 12..128; LETTER+DIGIT; no periodic expiry in V1; common-password and username checks required
  admin_bootstrap: explicit no-echo TTY or ATP_BOOTSTRAP_ADMIN_PASSWORD_FILE; force_password_change=true; repeated execution never
    overwrites credentials
  identity_state_check: user ACTIVE + credential ACTIVE/unlocked + credential_version match + Session ACTIVE
  authorization: permissions are not in JWT; resolve current relational RBAC and data scope for every protected request
  audit: login success/failure, logout, password change/reset, Session revoke and permission denial; authentication secrets forbidden
  temporary_credential: server-generated and returned once only by successful create/reset responses; Argon2id hash only at rest
  source_rate_limit: Login 60/5m and Refresh 300/5m; direct peer IP unless peer is in ATP_TRUSTED_PROXY_CIDRS; untrusted forwarding headers
    ignored; 429 Retry-After
  change_password: 204 No Content; revoke all Refresh Sessions; issue no tokens; identical idempotent replay returns 204 without a second
    mutation
  admin_protection: admin and its ROLE-SUPER-ADMIN binding are immutable on every User/Credential/UserRoleBinding write path
event_contract:
  delivery: AT_LEAST_ONCE_OUTBOX
  required_envelope:
  - event_id
  - event_type
  - event_version
  - occurred_at
