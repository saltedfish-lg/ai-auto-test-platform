        schema:
          type: string
      responses:
        '201':
          description: 首次成功；temporary_password仅在本响应出现一次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '200':
          description: 相同幂等键与相同非秘密请求指纹的终态重放；delivery_status为ALREADY_DELIVERED且不返回temporary_password
