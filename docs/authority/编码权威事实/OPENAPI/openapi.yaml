      x-conditional-permission-codes:
      - PROJECT_MEMBER_MANAGE
      x-idempotency: IDEMPOTENCY_KEY_REQUIRED_FIRST_DELIVERY_ONLY
      x-audit: USER_CREATED_AND_ROLE_ASSIGNED
      security:
      - BearerAuth: []
