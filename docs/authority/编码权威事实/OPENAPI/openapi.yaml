openapi: 3.1.2
info:
  title: AI自动化测试执行平台 API - 当前P1认证契约
  version: 1.5.0-p1-living-authority-closure
  x-artifact-id: OPENAPI-1.5.0
  x-authority-model: SINGLE_LIVING_AUTHORITY
servers:
- url: /
paths:
  /api/v1/auth/login:
    post:
      operationId: login_platform_user
      summary: 平台用户登录
      tags:
      - 身份认证
      security: []
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功；Refresh Token仅通过HttpOnly Cookie返回
          headers:
            Set-Cookie:
              description: atp_refresh HttpOnly Refresh Cookie；不得由JavaScript读取
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          description: 请求无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '401':
          description: 用户不存在或密码错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '403':
          description: 用户状态、临时锁或强制改密规则禁止
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '429':
          description: 登录速率受限
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 300
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '500':
          description: 内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: MySQL共享来源限流状态不可用；认证失败关闭
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '422':
          $ref: '#/components/responses/RequestValidationFailed'
      x-idempotency: NOT_REQUIRED
      x-audit: LOGIN_SUCCEEDED_OR_LOGIN_FAILED
      x-correlation-id: PROPAGATE_OR_GENERATE
  /api/v1/auth/refresh:
    post:
      operationId: refresh_platform_session
      summary: 轮换Refresh Session并签发新Access Token
      tags:
      - 身份认证
      security: []
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCookieActionRequest'
      responses:
        '200':
          description: Refresh轮换成功；旧Token立即变为ROTATED
          headers:
            Set-Cookie:
              description: 轮换后的atp_refresh HttpOnly Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: Refresh Token缺失、无效、过期、撤销或重放
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '403':
          description: 用户状态或强制改密规则禁止刷新
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '429':
          description: 刷新速率受限
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 300
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '500':
          description: 内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: MySQL共享来源限流状态不可用；认证失败关闭
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '422':
          $ref: '#/components/responses/RequestValidationFailed'
      x-idempotency: ROTATION_REPLAY_SAFE_NO_IDEMPOTENCY_KEY
      x-csrf: SAME_ORIGIN_REQUIRED
      x-audit: SUCCESS_AND_REPLAY_OR_FAILURE
  /api/v1/auth/logout:
    post:
      operationId: logout_platform_user
      summary: 撤销当前Refresh Session并清除Cookie
      tags:
      - 身份认证
      security: []
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCookieActionRequest'
      responses:
        '204':
          description: 已撤销或本来不存在；登出幂等
          headers:
            Set-Cookie:
              description: 清除atp_refresh Cookie
              schema:
                type: string
        '500':
          description: 内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/RequestValidationFailed'
      x-idempotency: IDEMPOTENT_204
      x-csrf: SAME_ORIGIN_REQUIRED
      x-audit: WHEN_SESSION_RESOLVED
  /api/v1/auth/me:
    get:
      operationId: get_current_user
      summary: 获取当前平台用户及实时权限
      tags:
      - 身份认证
      security:
      - BearerAuth: []
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: 当前身份、角色和实时Permission集合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Access Token或当前Session无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '403':
          description: 当前身份状态禁止
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '500':
          description: 内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/RequestValidationFailed'
      x-permission-code: null
      x-audit: DENIAL_ONLY
  /api/v1/auth/change-password:
    post:
      operationId: change_current_user_password
      summary: 当前用户修改密码并撤销旧Session
      tags:
      - 身份认证
      security:
      - BearerAuth: []
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 191
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 密码修改成功或相同幂等键与相同指纹的终态重放；全部Refresh Session已撤销，不签发新Token
        '400':
          description: 已认证用户的当前密码错误、新密码不符合策略或新密码未变化；分别返回AUTH_CURRENT_PASSWORD_INVALID、AUTH_PASSWORD_POLICY_VIOLATION或AUTH_PASSWORD_UNCHANGED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '401':
          description: Access Token或Session无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '403':
          description: 当前状态禁止改密
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '409':
          description: 幂等键冲突或并发版本冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthenticationProblemDetails'
        '422':
          $ref: '#/components/responses/RequestValidationFailed'
        '500':
          description: 内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-idempotency: IDEMPOTENCY_KEY_REQUIRED
      x-audit: PASSWORD_CHANGED
  /api/v1/user:
