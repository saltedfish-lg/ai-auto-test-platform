        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: sort
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
      - name: filter
        in: query
        required: false
        schema:
          type: string
          maxLength: 1000
      responses:
        '200':
