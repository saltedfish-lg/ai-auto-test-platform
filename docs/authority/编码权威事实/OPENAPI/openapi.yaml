components:
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 191
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      example:
        username: admin
        password: REDACTED_INPUT_ONLY
    AuthCookieActionRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      example: {}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          pattern: ^(?=.*[A-Za-z])(?=.*[0-9])(?!\s)(?!.*\s$).+$
          writeOnly: true
      example:
        current_password: REDACTED_INPUT_ONLY
        new_password: REDACTED_INPUT_ONLY
    CurrentUserResource:
      type: object
      additionalProperties: false
      required:
      - user_id
      - username
      - lifecycle_status
      - roles
      - permissions
      - force_password_change
      properties:
        user_id:
          type: string
          minLength: 26
          maxLength: 26
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        username:
          type: string
          minLength: 1
          maxLength: 191
        display_name:
          type:
          - string
          - 'null'
          maxLength: 255
        lifecycle_status:
          type: string
          enum:
          - ACTIVE
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        force_password_change:
          type: boolean
      example:
        user_id: 01J00000000000000000000000
        username: admin
        display_name: Platform Administrator
        lifecycle_status: ACTIVE
        roles:
        - ROLE-SUPER-ADMIN
        permissions:
        - PROJECT_VIEW
        force_password_change: true
    AuthenticationTokenResource:
      type: object
      additionalProperties: false
      required:
      - access_token
      - token_type
      - expires_in
      - current_user
      properties:
        access_token:
          type: string
          minLength: 32
          maxLength: 4096
          writeOnly: true
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 900
        current_user:
          $ref: '#/components/schemas/CurrentUserResource'
      example:
        access_token: REDACTED_ACCESS_TOKEN_VALUE_NOT_FOR_LOGGING
        token_type: Bearer
        expires_in: 900
        current_user:
          user_id: 01J00000000000000000000000
          username: admin
          display_name: Platform Administrator
          lifecycle_status: ACTIVE
          roles:
          - ROLE-SUPER-ADMIN
          permissions:
          - PROJECT_VIEW
          force_password_change: true
    AuthenticationResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - correlation_id
      properties:
        data:
          $ref: '#/components/schemas/AuthenticationTokenResource'
        correlation_id:
          type: string
      example:
        data:
          access_token: REDACTED_ACCESS_TOKEN_VALUE_NOT_FOR_LOGGING
          token_type: Bearer
          expires_in: 900
          current_user:
            user_id: 01J00000000000000000000000
            username: admin
            display_name: Platform Administrator
            lifecycle_status: ACTIVE
            roles:
            - ROLE-SUPER-ADMIN
            permissions:
            - PROJECT_VIEW
            force_password_change: true
        correlation_id: example-correlation-id
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - correlation_id
      properties:
        data:
          $ref: '#/components/schemas/CurrentUserResource'
        correlation_id:
          type: string
      example:
        data:
          user_id: 01J00000000000000000000000
          username: admin
          display_name: Platform Administrator
          lifecycle_status: ACTIVE
          roles:
          - ROLE-SUPER-ADMIN
          permissions:
          - PROJECT_VIEW
          force_password_change: true
        correlation_id: example-correlation-id
    AuthenticationErrorCode:
      type: string
      enum:
      - AUTH_REQUIRED
