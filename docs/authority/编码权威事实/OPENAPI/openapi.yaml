        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-permission-code: PROJECT_VIEW
      security:
      - BearerAuth: []
    post:
      operationId: create_user
      summary: 创建普通平台用户、初始角色绑定并一次性交付临时凭据
