frontend_architecture:
  stack:
  - Vue 3
  - TypeScript
  - Vite
  - Vue Router
  - Pinia
  - Element Plus
  - Zod
  - Vitest
  - Vue Testing Library
  - Playwright
  rules:
  - 路由守卫只做用户体验提示，服务端重复授权
  - API客户端统一错误、重试、幂等和correlation id
  - 长任务使用SSE并可回退轮询
  - 敏感字段按权限脱敏
  - 下载使用短期授权URL
  effect_class: FROZEN_ONLY
backend_architecture:
  stack:
  - Python 3.12
  - FastAPI
  - Pydantic v2
  - SQLAlchemy 2
  - Flyway
  - MySQL 8.4 LTS
  layers:
  - interface
  - application
  - domain
  - ports
  - infrastructure
  transaction_rule: 数据库事务不覆盖远程调用；状态、事件、Outbox和审计在同事务提交。
  effect_class: FROZEN_ONLY
runner_architecture:
  independent_deployment: true
  stack:
  - Python 3.12
  - Playwright Python
  components:
  - Agent启动器
  - 注册认证客户端
  - 心跳健康上报
  - 任务长轮询
  - 任务租约管理
  - 本地调度器
  - Playwright执行器
  - AI探索会话执行器
  - 人工录制会话管理器
  - 浏览器管理器
  - 上下文管理器
  - 日志采集器
  - 制品采集补传器
  - 本地安全存储
  - 本地清理器
  - 版本兼容检查
  rules:
  - Runner Agent是独立部署单元和独立构建产物。
  - Runner Agent不得直接访问平台数据库。
  - Runner只能执行已领取且租约、fencing和协议版本仍有效的任务。
  - Runner领取前必须校验项目绑定、能力、健康、浏览器矩阵、网络访问和槽位。
  - Runner不得自行创建正式任务、重试、用例版本、权限或项目绑定。
  - Runner必须区分FORMAL_EXECUTION、AI_EXPLORATION、AI_VALIDATION、MANUAL_RECORDING和诊断任务。
  - Runner失联恢复后不得提交失效attempt的权威结果。
  - Runner必须支持断线重连、幂等确认、进度续报和版本兼容。
  - 每个正式attempt使用隔离BrowserContext；跨端逻辑终端可使用独立Context但保持同一attempt。
  - AI探索每个attempt必须使用独立MCP进程或容器、isolated profile和唯一临时目录。
  - 禁止共享用户浏览器、持久profile、任意CDP端点、no-sandbox和无限制文件访问。
  - 人工录制输入必须先在Runner侧最小化和脱敏，再持久化或上传。
  - 人工录制不得要求平台预知测试人员实际输入的账号身份。
  - Runner日志不得包含秘密、完整响应敏感字段或录制明文输入。
  - 制品上传确认和hash校验完成前不得删除本地唯一副本。
  - Runner本地副本必须按任务终态、上传状态、保留和安全策略清理。
  - Playwright网络监听必须先注册再触发UI动作。
  - 静态资源完成不得作为业务成功等待条件。
  - Runner版本变更必须更新协议兼容矩阵并通过平台—Runner契约测试。
  - 修改Runner时必须覆盖注册、心跳、领取、租约续期、失联、旧结果拒绝、补传和清理测试。
  business_effect_class: IMMEDIATE_INVARIANT
  implementation_effect_class: FROZEN_ONLY
ai_architecture:
  orchestrator: 平台轻量AIOrchestrator
  model_gateway: LiteLLM Proxy默认实现
  langgraph: PLANNED_LATER
  langfuse: NO_OP_FIRST_VERSION
  rules:
  - 所有模型调用必须经过ModelGatewayAdapter或批准的等价统一适配层。
  - Prompt必须版本化集中管理，不得散落在Controller、Worker或前端。
  - 模型输出必须先通过JSON Schema/Pydantic校验，再通过业务规则校验。
  - AI结果必须保存模型配置、Prompt版本、输入指纹、调用attempt、成本/用量和脱敏审计。
  - AI输出不得直接写入正式用例、正式资产或业务终态。
  - 自然语言转换不得申请Runner或浏览器。
  - AI页面探索必须使用Runner和受控Playwright/MCP沙箱。
  - 人工录制动作和证据优先于AI推测；AI不得补造未录制业务事实。
  - 正式执行不得由模型实时自由决策或动态改写正式步骤。
  - 模型密钥不得写入代码、Prompt、日志、Trace或测试快照。
  - 发送模型前必须按项目、字段分类和任务目的过滤敏感数据。
  - 同一模型候选内只允许受限技术重试；跨候选fallback由平台创建新ai_call_attempt。
  - 模型失败必须有明确超时、限流、Schema错误、内容安全和供应方错误处理。
  - LiteLLM不得拥有模型授权、正式Prompt、业务额度、跨候选fallback或AI任务状态。
  - 第一版AIOrchestrator由平台轻量实现，LangGraph不得成为强制运行依赖。
  - 第一版Langfuse使用No-op Adapter，OTel可记录脱敏AI技术遥测。
  - 修改AI流程必须新增确定性单元测试、Fake模型测试、Schema失败测试和敏感数据测试。
  - 模型非确定性不得进入状态机、权限或计费等确定性核心规则。
  effect_class: FROZEN_ONLY
