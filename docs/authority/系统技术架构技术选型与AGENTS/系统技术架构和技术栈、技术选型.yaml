architecture_drivers:
- driver_id: DRV-001
  name: 自然语言创建测试
  description: 自然语言用例必须形成不可变修订并可进入两条独立后续路径。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-002
  name: 无浏览器结构转换
  description: 结构转换不打开浏览器、不占用Runner，只生成结构化候选。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-003
  name: AI页面探索
  description: AI探索占用Runner，通过受控浏览器工具产生候选步骤、定位器、断言和证据。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-004
  name: 人工业务流程录制
  description: 人工录制是独立正式能力，由测试人员操作受控浏览器，不能被AI探索替代。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-005
  name: 确定性正式执行
  description: 正式执行只消费已发布标准结构用例版本，不允许模型自由改写正式步骤。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-006
  name: 单端与跨端流程
  description: 管理端、客户端、PDA端均为Web；跨端在同一attempt和Runner内顺序执行。
  type: BUSINESS
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- driver_id: DRV-007
  name: Runner远程执行面
  description: Runner Agent独立部署在可访问被测系统的机器或内网，平台远程调度。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-008
  name: Runner项目独占
  description: Runner登记对象绑定项目后不得同时绑定其他项目。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-009
  name: 身份互斥
  description: 正式执行按项目、环境和SSO身份租约互斥；不同身份可在容量允许时并行。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-010
  name: 录制并发例外
  description: 人工录制不绑定平台测试账号、账号映射或SSO租约，但仍占用Runner物理资源。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-011
  name: 失败统一重试
  description: 首轮结束后对Failed/Broken按资格统一重试，新增attempt且保留首轮历史。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-012
  name: 证据闭环
  description: 结果必须追溯到用例版本、快照、Runner、attempt、日志和制品。
  type: BUSINESS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-013
  name: UI触发取数
  description: 加密API场景优先由UI触发并使用Playwright监听响应提取业务数据。
  type: TECHNICAL
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-014
  name: 网络不稳定
  description: 平台与Runner网络可能中断，控制协议必须支持重连、幂等、租约和旧结果拒绝。
  type: TECHNICAL
  completion_status: VALID_ARCHITECTURE_COMPLETION
- driver_id: DRV-015
  name: 长流程恢复
  description: 探索、录制、执行、补传、报告和清理需要持久状态、恢复扫描和幂等副作用。
  type: TECHNICAL
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
- driver_id: DRV-016
  name: 业务与制品分离
  description: 业务元数据与截图、视频、Trace、日志等二进制制品生命周期不同。
  type: TECHNICAL
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-017
  name: 模型可替换
  description: 模型供应商和网关可替换，业务授权、路由和状态不能下放给网关。
  type: TECHNICAL
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-018
  name: 状态权威单一
  description: 平台数据库是唯一业务事实存储；Runner、AI、工作流和可观测组件均非状态Owner。
  type: TECHNICAL
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-019
  name: 版本化资产不可变
  description: 正式资产发布后不可原地修改，变更必须创建新版本并保留历史。
  type: TECHNICAL
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-020
  name: 权限与数据范围闭包
  description: 菜单、操作、接口、对象和数据范围必须在服务端形成授权闭包并审计。
  type: SECURITY
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-021
  name: 敏感数据最小化
  description: 秘密、密码、Token、Cookie和录制敏感输入不得进入普通日志、模型输入或普通制品。
  type: SECURITY
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-022
  name: 可观测但不替代业务
  description: 技术遥测可降级，不能替代执行报告、审计、业务告警和状态。
  type: OPERATIONS
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-023
  name: Codex全程编码
  description: 仓库必须给Agent唯一架构、目录、契约、验证命令和完成定义，禁止自行猜测。
  type: ENGINEERING
  completion_status: DIRECTLY_SUPPORTED
- driver_id: DRV-024
  name: 第一版基础设施克制
  description: 第一版不强制Temporal、LangGraph、Langfuse、独立消息队列、Redis或Kubernetes。
  type: ENGINEERING
  completion_status: SUPPORTED_BY_MULTIPLE_SOURCES
quality_attributes:
- quality_id: QA-001
  name: 正确性
  scenario: 状态转换、权限、并发和结果聚合必须由确定性规则驱动。
  priority: P0
- quality_id: QA-002
  name: 可追溯性
  scenario: 关键命令、事件、attempt、快照、制品和审计可通过关联标识回溯。
  priority: P0
- quality_id: QA-003
  name: 安全性
  scenario: 最小权限、秘密引用、脱敏、Runner零信任和下载授权。
  priority: P0
- quality_id: QA-004
  name: 可靠性
  scenario: 进程、Runner、浏览器、模型和存储故障不能产生虚假成功。
  priority: P0
- quality_id: QA-005
  name: 可恢复性
  scenario: 长流程可从持久状态恢复，副作用幂等，旧持有者被fencing拒绝。
  priority: P0
- quality_id: QA-006
  name: 幂等性
  scenario: 任务创建、领取、上报、上传、报告、通知和清理均有幂等键。
  priority: P0
- quality_id: QA-007
  name: 可维护性
  scenario: 模块边界清晰，业务规则不散落于Controller、ORM或前端。
  priority: P1
- quality_id: QA-008
  name: 可扩展性
  scenario: 先模块化单体，Runner和Worker独立扩展，保留按边界拆分能力。
  priority: P1
- quality_id: QA-009
  name: 可测试性
  scenario: 纯规则、应用服务、契约、并发、恢复和E2E均可用可控替身测试。
  priority: P0
- quality_id: QA-010
  name: 可观测性
  scenario: 结构化日志、指标、Trace和业务事件具备统一关联标识。
  priority: P1
- quality_id: QA-011
  name: 可部署性
  scenario: 平台组件容器化，Runner支持Windows服务、Linux服务和受控容器。
  priority: P1
- quality_id: QA-012
  name: 技术可替换性
  scenario: 模型网关、对象存储和可观测后端通过Adapter隔离。
  priority: P1
- quality_id: QA-013
  name: Codex可编码性
  scenario: 目录、依赖、命令、契约优先级和DoD均唯一且机器可执行。
  priority: P0
architecture_principles:
- principle_id: PRN-001
  name: 平台数据库是业务状态权威
  rule: 任何外部组件状态必须经平台适配、校验和原子事务映射。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-002
  name: 控制面与执行面分离
  rule: 平台决定，Runner执行；Runner不得直写平台数据库。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-003
  name: 候选与正式事实分离
  rule: AI和录制结构化结果先成为候选，校验和人工确认后才能发布。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-004
  name: 同步短事务，异步长流程
  rule: 远程Runner、模型和对象存储调用不得被数据库事务包围。
  effect_class: FROZEN_ONLY
- principle_id: PRN-005
  name: 状态机显式化
  rule: 正式状态、合法迁移、Owner和原因码必须定义并测试。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-006
  name: 租约带隔离令牌
  rule: 所有跨进程资源控制使用到期、续期、强制释放和fencing token。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-007
  name: 不可变版本与快照
  rule: 任务引用创建时快照，发布资产不可原地改写。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-008
  name: 历史不覆盖
  rule: 首轮、重试和替换attempt分别保存，报告通过投影聚合。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-009
  name: 契约先于实现
  rule: OpenAPI、Schema、枚举、事件和迁移先更新，再修改代码。
  effect_class: FROZEN_ONLY
- principle_id: PRN-010
  name: 模块拥有数据
  rule: 模块只能通过应用服务或正式端口修改其他模块拥有的数据。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-011
  name: 秘密只以引用流转
  rule: 代码、普通日志、Trace、截图元数据和测试快照禁止保存明文秘密。
  effect_class: FROZEN_ONLY
- principle_id: PRN-012
  name: 第三方组件非业务Owner
  rule: Playwright、LiteLLM、Grafana等不得拥有平台业务状态。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-013
  name: 失败显式化
  rule: 不得吞异常、伪造成功或使用无来源兜底。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-014
  name: 配置可验证
  rule: 配置修订、组件版本和协议版本必须可追溯并通过兼容性验证。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-015
  name: 最小基础设施
  rule: 当前版本只引入实现明确需求所必需的组件。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-016
  name: 可重放副作用
  rule: Outbox、Worker和恢复动作均按幂等键与状态前置条件执行。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-017
  name: 观测降级不改变业务
  rule: 遥测故障仅影响观测，不改变业务结果、权限和报告。
  effect_class: IMMEDIATE_INVARIANT
- principle_id: PRN-018
  name: 跨平台开发命令统一
  rule: 所有构建与验证通过仓库脚本封装，CI供应商不得改变质量门禁。
  effect_class: IMMEDIATE_INVARIANT
architecture_style:
  style_id: STYLE-001
  name: 平台后端模块化单体 + 独立异步Worker + 独立Runner Agent的混合架构
  status: FROZEN
  completion_status: FROZEN_SYSTEM_DESIGN
  rationale: 平台核心对象、权限、状态机和事务高度耦合，模块化单体降低分布式一致性和Codex维护成本；Runner必须独立部署；耗时任务由独立Worker扩展。
  current_process_boundaries:
  - Web前端
  - 平台API
  - 通用后台Worker
  - AI Worker
  - 报告/制品Worker
  - 调度/恢复Worker
  - Runner Agent
  future_split_points:
  - AI任务与模型治理
  - 报告与制品处理
  - 通知与告警
  - Runner控制面
  rejected:
  - 纯单体单进程
  - 全量微服务
  - 按菜单拆服务
  effect_class: FROZEN_ONLY
