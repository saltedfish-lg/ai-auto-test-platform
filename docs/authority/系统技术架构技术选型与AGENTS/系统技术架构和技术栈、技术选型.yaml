- rejection_id: REJ-001
  option: 全量微服务
  reason: 当前业务强一致性高、团队与Codex复杂度显著增加，第一版无独立伸缩证据。
- rejection_id: REJ-002
  option: 单进程大单体
  reason: 无法满足Runner独立部署、长任务隔离和Worker恢复。
- rejection_id: REJ-003
  option: 按菜单拆服务
  reason: 菜单不是领域边界，会造成数据所有权和事务碎片化。
- rejection_id: REJ-004
  option: Java/Spring作为首选后端
  reason: 可行但与AI/Runner共享语言和当前工程简化目标相比成本更高。
- rejection_id: REJ-005
  option: Node/NestJS作为统一后端
  reason: 可行但AI处理和既有Python自动化生态整合不如Python单语言方案直接。
- rejection_id: REJ-006
  option: React作为前端首选
  reason: 可行但当前选择Vue以降低管理型界面模板和表单实现成本。
- rejection_id: REJ-007
  option: PostgreSQL替换MySQL
  reason: 关系型数据库方向已确认，但具体产品仍需FROZEN SYSTEM_DESIGN裁决；MySQL 8.4 LTS为候选。
- rejection_id: REJ-008
  option: Temporal第一版强制部署
  reason: 输入明确第一版不部署；当前用DB状态机满足持久编排。
- rejection_id: REJ-009
  option: LangGraph第一版强制部署
  reason: 输入明确仅后续可选；平台业务状态不能由图状态拥有。
- rejection_id: REJ-010
  option: Langfuse第一版部署
  reason: 输入明确第一版No-op；先使用OTel并保持业务审计独立。
- rejection_id: REJ-011
  option: Redis作为锁和状态权威
  reason: 增加第二权威和故障模式；MySQL可承接当前锁、租约和CAS。
- rejection_id: REJ-012
  option: Kafka/RabbitMQ第一版强制部署
  reason: 当前吞吐未形成决定性基线，DB Outbox和任务表更简单。
- rejection_id: REJ-013
  option: 制品直接存MySQL BLOB
  reason: 破坏业务库容量、备份和生命周期边界。
- rejection_id: REJ-014
  option: Runner主动WebSocket常连接作为唯一控制通道
  reason: 内网代理和断线恢复复杂；第一版采用出站长轮询。
- rejection_id: REJ-015
  option: gRPC作为Runner唯一协议
  reason: 浏览器/运维可见性和边缘兼容成本高，当前无必要。
- rejection_id: REJ-016
  option: Appium/WinAppDriver/UiAutomator2
  reason: 三类被测终端均为Web，原生自动化不在当前范围。
- rejection_id: REJ-017
  option: Kubernetes强制依赖
  reason: 当前规模和运维证据不足，Docker/Compose与主机服务已满足。
- rejection_id: REJ-018
  option: Runner直接访问平台数据库
  reason: 破坏零信任、权限、协议兼容和状态Owner边界。
- rejection_id: REJ-019
  option: AI输出直接写正式用例
  reason: 违反候选、校验、审核和不可变发布规则。
- rejection_id: REJ-020
  option: Grafana替代业务报告或审计
  reason: 技术遥测不具备业务状态、权限和生命周期语义。
- rejection_id: REJ-021
  option: 共享浏览器profile/MCP上下文
  reason: 会造成数据泄露、状态串扰和证据不可追溯。
- rejection_id: REJ-022
  option: 多仓库立即拆分
  reason: 跨组件契约和原子变更成本较高；先Monorepo独立产物。
repository_structure:
  type: MONOREPO
  runner_independent_artifact: true
  shared_contracts: packages/contracts
  effect_class: FROZEN_ONLY
directory_structure:
- path: apps/web
  responsibility: Vue前端应用
  forbidden: 不得包含权威业务状态机或后端权限决定。
  effect_class: FROZEN_ONLY
- path: services/platform_api
  responsibility: FastAPI入口、应用服务装配、查询和命令API
  forbidden: 不得直接跨模块写表。
  effect_class: FROZEN_ONLY
- path: workers/platform_worker
  responsibility: 通用任务、Outbox、通知和恢复Worker
  forbidden: 不得绕过应用服务更新业务状态。
  effect_class: FROZEN_ONLY
- path: workers/ai_worker
  responsibility: AI任务执行、Prompt适配和模型调用
  forbidden: 不得直接发布正式用例。
  effect_class: FROZEN_ONLY
- path: workers/report_artifact_worker
  responsibility: 报告、制品、保留和清理处理
  forbidden: 不得修改执行结果。
  effect_class: FROZEN_ONLY
- path: agents/runner_agent
  responsibility: 独立Runner Agent、Playwright执行器和本地补传
  forbidden: 不得导入平台ORM或直连平台DB。
  effect_class: FROZEN_ONLY
- path: modules/identity_access
  responsibility: 身份、角色、权限和数据范围领域模块
  forbidden: 只通过公共端口被其他模块调用。
  effect_class: FROZEN_ONLY
- path: modules/project_resources
  responsibility: 项目、环境、终端和配置模块
  forbidden: 不包含执行引擎。
  effect_class: FROZEN_ONLY
- path: modules/test_assets
  responsibility: 用例、版本、套件和自动化资产模块
  forbidden: 已发布版本不可原地修改。
  effect_class: FROZEN_ONLY
- path: modules/execution
  responsibility: 任务、attempt、结果、重试和最终化模块
  forbidden: 唯一执行状态Owner。
  effect_class: FROZEN_ONLY
- path: modules/runner_control
  responsibility: Runner登记、能力、健康和调度模块
  forbidden: 不包含Runner本地浏览器实现。
  effect_class: FROZEN_ONLY
- path: modules/ai_governance
  responsibility: 模型、Prompt、AI任务、结果和候选模块
  forbidden: 模型网关通过端口适配。
  effect_class: FROZEN_ONLY
- path: modules/reporting_artifacts
  responsibility: 报告元数据、制品元数据和保留模块
  forbidden: 文件通过对象存储端口。
  effect_class: FROZEN_ONLY
- path: modules/audit_alerting
  responsibility: 审计、技术告警和通知模块
  forbidden: Grafana仅作为输入技术源。
  effect_class: FROZEN_ONLY
- path: packages/contracts
  responsibility: OpenAPI、Runner协议、事件、JSON Schema和生成代码
  forbidden: 契约是跨进程唯一共享边界。
  effect_class: FROZEN_ONLY
- path: packages/shared_kernel
  responsibility: ID、时间、错误、审计上下文等极小共享内核
  forbidden: 禁止放业务模块特有规则。
  effect_class: FROZEN_ONLY
- path: db/migrations
  responsibility: Flyway迁移、校验、回填和回滚说明
  forbidden: 禁止手工改库不留迁移。
  effect_class: FROZEN_ONLY
- path: tests/unit
  responsibility: 纯规则与模块单元测试
  forbidden: 不得依赖外部服务。
  effect_class: FROZEN_ONLY
- path: tests/integration
  responsibility: 数据库、对象存储、Worker和模块集成测试
  forbidden: 使用隔离环境。
  effect_class: FROZEN_ONLY
- path: tests/contracts
  responsibility: OpenAPI、事件、Runner和Schema契约测试
  forbidden: 协议变更必须更新。
  effect_class: FROZEN_ONLY
- path: tests/e2e
  responsibility: 平台与Runner端到端验收
  forbidden: 不得使用真实生产秘密。
  effect_class: FROZEN_ONLY
- path: deploy
  responsibility: Docker、Compose、主机服务和环境模板
  forbidden: 不得包含明文秘密。
  effect_class: FROZEN_ONLY
- path: docs/architecture
  responsibility: 当前技术架构、ADR和图形源
  forbidden: 架构变更同步更新。
  effect_class: FROZEN_ONLY
- path: tools
  responsibility: 跨平台开发、生成、校验和发布脚本
  forbidden: 所有CI命令从此统一入口。
  effect_class: FROZEN_ONLY
testing_architecture:
  levels:
  - unit
  - domain
  - application
  - api
  - migration
  - contract
  - event
  - runner protocol
  - runner integration
  - AI schema
  - workflow recovery
  - authorization
  - concurrency
  - artifact lifecycle
  - E2E
  - regression
  minimum_rules:
  - 所有领域不变量和状态迁移必须有单元测试。
  - 应用服务必须测试事务、权限、前置条件、幂等和审计。
  - API必须测试认证、授权、数据范围、错误码、并发版本和幂等。
  - 每次迁移必须测试空库安装、基线升级、回填和兼容期读写。
  - OpenAPI、JSON Schema、事件和Runner协议必须有契约测试。
  - Runner必须有注册、心跳、领取、租约、fencing、失联和版本兼容测试。
  - Runner集成测试必须使用可控被测Web应用和临时浏览器环境。
  - AI输出必须有合法、缺字段、类型错误、恶意内容和敏感泄露Schema测试。
  - 长流程必须测试Worker重启、租约过期、重复消息、取消和恢复重放。
  - 权限测试必须覆盖菜单、接口、对象、项目范围和历史范围的交集。
  - 并发测试必须覆盖双领取、双发布、强制释放后旧写入和重复上报。
  - 制品测试必须覆盖hash不匹配、重复上传、存储故障、补传、Hold和清理。
  - E2E必须覆盖结构转换、AI探索、人工录制、正式执行、跨端、重试和报告。
  - Bug修复必须新增回归测试。
  - 不得通过删除测试、跳过测试或放宽断言隐藏缺陷。
  - 不得只运行修改文件测试；必须运行受影响模块、契约和必要回归。
  - 测试等待必须基于状态、事件或Playwright自动等待，不得使用不稳定固定sleep。
  - 外部模型、通知和对象存储测试必须使用Fake、Mock或隔离测试服务。
  - 所有测试必须可重复、可并行隔离或明确声明串行资源。
  effect_class: FROZEN_ONLY
delivery_architecture:
  ci_provider: REPLACEABLE
  canonical_command: python tools/dev.py verify
  commands:
  - category: 依赖安装
    command: python tools/dev.py bootstrap
  - category: 格式化
    command: python tools/dev.py format
  - category: Lint
    command: python tools/dev.py lint
  - category: 类型检查
    command: python tools/dev.py typecheck
  - category: 单元测试
    command: python tools/dev.py test-unit
  - category: 契约测试
    command: python tools/dev.py test-contract
  - category: 集成测试
    command: python tools/dev.py test-integration
  - category: 迁移验证
    command: python tools/dev.py verify-migrations
  - category: 构建
    command: python tools/dev.py build
  - category: 全量验证
    command: python tools/dev.py verify
  effect_class: FROZEN_ONLY
architecture_decisions:
- adr_id: TADR-001
  title: 架构风格
  decision: 候选建议：选择模块化单体控制面、独立Worker和独立Runner Agent。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-002
  title: 业务状态权威
  decision: 候选建议：MySQL业务库是唯一权威，所有外部状态必须经平台映射。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-003
  title: 仓库组织
  decision: 候选建议：使用Monorepo并保持每个部署单元独立构建。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-004
  title: 前端技术
  decision: 候选建议：Vue 3 + TypeScript + Vite + Element Plus。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-005
  title: 后端技术
  decision: 候选建议：Python 3.12 + FastAPI + SQLAlchemy 2 + Pydantic v2。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-006
  title: 数据库与迁移
  decision: 候选建议：MySQL 8.4 LTS和Flyway。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-007
  title: Runner工程
  decision: 候选建议：Runner Agent为独立部署产物，使用Python和Playwright。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-008
  title: 浏览器技术
  decision: 候选建议：管理端、客户端、PDA端统一使用Playwright Web。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-009
  title: 长流程
  decision: 候选建议：第一版使用MySQL持久状态机、任务表和Worker，不部署Temporal。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-010
  title: 内部事件
  decision: 候选建议：使用Transactional Outbox和幂等消费者，不部署独立MQ。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-011
  title: 缓存
  decision: 候选建议：第一版不部署强制Redis，权威数据不得进入仅缓存存储。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-012
  title: 对象存储
  decision: 候选建议：制品文件进入S3兼容对象存储，元数据留在MySQL。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-013
  title: Runner通信
  decision: 候选建议：使用Runner主动出站HTTPS长轮询和REST确认/上报。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-014
  title: 前端实时进度
  decision: 候选建议：使用SSE，失败时回退状态轮询。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-015
  title: AI编排
  decision: 候选建议：第一版使用平台轻量AIOrchestrator，不部署LangGraph。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-016
  title: 模型网关
  decision: 候选建议：LiteLLM Proxy作为默认可替换实现，业务路由仍由平台拥有。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-017
