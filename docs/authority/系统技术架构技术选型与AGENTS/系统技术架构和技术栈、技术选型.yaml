  data_owned: 无
  interfaces: HTTPS Web
  trust_boundary: USER_TRUST
  deployment_boundary: 浏览器
  failure_boundary: 用户离线不影响已提交任务
  replaceable: false
  effect_class: IMMEDIATE_INVARIANT
- participant_id: CTX-002
