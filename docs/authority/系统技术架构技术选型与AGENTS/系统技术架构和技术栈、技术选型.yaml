runtime_views:
- view_id: RV-001
  name: 自然语言转换
  flow: 用户提交修订→API鉴权与快照→AI任务入库→AI Worker经模型网关生成候选→Schema/业务校验→保存AI结果和候选→人工确认/发布。
  critical_rules: 不占Runner；模型失败不改变源用例。
  effect_class: IMMEDIATE_INVARIANT
- view_id: RV-002
  name: AI页面探索
  flow: 创建AI任务→获取Runner/资源租约→固定Runner→Runner启动独立MCP沙箱→模型决策与Playwright动作循环→密封证据→上传制品→保存候选→释放资源。
  critical_rules: AI结果不能直接发布；旧租约结果拒绝。
  effect_class: FROZEN_ONLY
- view_id: RV-003
  name: 人工录制
  flow: 创建录制任务→获取Runner槽位和控制租约→测试人员操作受控浏览器→Runner先脱敏再持久化动作/证据→密封包→结构化候选→人工确认。
  critical_rules: 不取得测试账号/SSO租约；仍受Runner资源约束。
  effect_class: IMMEDIATE_INVARIANT
- view_id: RV-004
  name: 正式执行
  flow: 创建任务快照→环境锁/SSO租约/Runner槽位→领取attempt并发fencing→Playwright执行已发布步骤→确定结果→最终化→释放资源→报告请求。
  critical_rules: 任务内部串行；数据库事务不跨Runner调用。
  effect_class: IMMEDIATE_INVARIANT
- view_id: RV-005
  name: 跨端正式执行
  flow: 同一attempt和Runner创建终端独立BrowserContext→按步骤顺序切换管理端/客户端/PDA→监听响应提取变量→上下文命名空间传递→聚合证据。
  critical_rules: 不得按终端拆Runner。
  effect_class: FROZEN_ONLY
- view_id: RV-006
  name: 失败统一重试
  flow: 首轮全部结束→筛选Failed/Broken且有额度的case item→创建新attempt→继承快照和业务轮次→再次执行→报告同时展示首轮和重试。
  critical_rules: 不得覆盖首次结果；Skipped/Cancelled/Not Run不重试。
  effect_class: FROZEN_ONLY
- view_id: RV-007
  name: Runner注册
  flow: 一次性注册Token→Agent提交机器指纹和能力→平台验证→签发可撤销Agent凭证→建立Runner登记对象→项目独占绑定后可调度。
  critical_rules: Runner不直接创建任务。
  effect_class: FROZEN_ONLY
- view_id: RV-008
  name: Runner调度
  flow: Worker读取READY任务→原子选择满足项目绑定/能力/健康/槽位的Runner→创建资源租约和fencing→Runner长轮询领取→确认所有权。
  critical_rules: 指定Runner不可用时按策略等待或阻断。
  effect_class: FROZEN_ONLY
- view_id: RV-009
  name: Runner失联恢复
  flow: 心跳超时→标记离线→停止续租→租约到期并生成更高fencing→旧Agent上报被拒绝→按是否已产生不可确认副作用收口或创建替换attempt。
  critical_rules: 不能让旧结果覆盖新attempt。
  effect_class: FROZEN_ONLY
- view_id: RV-010
  name: 报告生成
  flow: 根任务终态事务创建唯一报告请求/Outbox→报告Worker锁定请求→冻结输入快照→生成元数据和文件→上传对象存储→标记可用或降级。
  critical_rules: 报告生成失败不改写执行结果。
  effect_class: FROZEN_ONLY
- view_id: RV-011
  name: 制品上传与补传
  flow: Runner申请上传会话→按artifact id和hash上传→服务端校验大小/hash/owner→确认可用→Runner删除本地副本；失败保留本地唯一副本并补传。
  critical_rules: 确认前不得删除唯一副本。
  effect_class: FROZEN_ONLY
- view_id: RV-012
  name: 自动清理
  flow: 定时Worker查询retention_deadline→排除Hold/长期保留/归档保护→生成受控清理请求→删除对象→更新元数据→写审计；失败可重放。
  critical_rules: 项目删除先归档；报告元数据不随普通制品清理。
  effect_class: FROZEN_ONLY
