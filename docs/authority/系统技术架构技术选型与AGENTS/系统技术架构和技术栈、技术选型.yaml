  title: 系统可观测
  decision: 候选建议：采用OTel Collector、Prometheus、Loki、Tempo和Grafana。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-019
  title: 锁与租约
  decision: 候选建议：使用MySQL原子事务、唯一约束、CAS和fencing token。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-020
  title: API契约
  decision: 候选建议：REST/JSON与OpenAPI 3.1，数据库实体不得直接暴露。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-021
  title: 制品上传
  decision: 候选建议：上传会话、幂等键、哈希校验和预签名直传/代理回退。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-022
  title: 部署
  decision: 候选建议：平台使用Docker镜像；不强制Kubernetes；Runner支持原生服务。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-023
  title: CI质量门禁
  decision: 候选建议：通过跨平台tools/dev.py命令统一，CI供应商可替换。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-024
  title: 版本与兼容
  decision: 候选建议：API、Runner协议、事件和Schema均显式版本化并保持兼容窗口。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- adr_id: TADR-025
  title: 安全边界
  decision: 候选建议：Runner按零信任边缘节点处理，秘密只通过短期引用/注入流转。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
risks:
- risk_id: RISK-001
  risk: 历史12项外部产品/安全决策已关闭
  mitigation: 保持最小权限和可配置接口，禁止提前编码为固定业务规则。
- risk_id: RISK-002
  risk: MySQL任务表在未来高吞吐下可能成为瓶颈
  mitigation: 统一Outbox接口和任务端口，达到容量阈值后评估MQ/Temporal。
- risk_id: RISK-003
  risk: Runner边缘网络和本地制品可能丢失
  mitigation: 租约/fencing、补传、hash、本地唯一副本保护和清理审计。
- risk_id: RISK-004
  risk: AI供应商非确定性和敏感数据风险
  mitigation: 网关、Schema、业务校验、脱敏、人工确认和确定性测试。
- risk_id: RISK-005
  risk: Monorepo边界被直接导入破坏
  mitigation: 依赖规则、静态检查、契约包和架构测试。
evolution_plan:
- phase: V1
  items:
  - 模块化单体控制面
  - DB状态机/Outbox
  - 独立Runner
  - LiteLLM
  - OTel/Grafana栈
- phase: V1.x
  items:
  - 基于容量数据优化Worker和数据库
  - 完善对象存储灾备
  - 可选拆分报告/AI Worker
- phase: Future
  items:
  - 有明确阈值和ADR后评估Temporal、LangGraph、Langfuse、Redis或消息总线
