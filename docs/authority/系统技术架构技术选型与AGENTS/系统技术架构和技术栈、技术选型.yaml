p1_authentication_architecture:
  contract_id: P1-AUTH-ARCH-001
  status: FROZEN_IMPLEMENTABLE
  auth_service: FastAPI应用层服务；协调Credential Repository、Session Repository、Token Service、审计与RBAC Authorization Service。
  token_service: RS256签发和验证，密钥仅由部署秘密文件注入，Access Token有效15分钟且不携带权限。
  credential_repository: MySQL atp_platform_user_credential；Argon2id验证、版本、强制改密和失败临时锁的唯一物理Owner。
  session_repository: MySQL atp_auth_refresh_session；Refresh Token只存SHA-256，7天绝对到期、每次轮换、可撤销和重放检测。
  browser: Access Token仅内存，Refresh Token仅HttpOnly Cookie；刷新和登出执行同源校验。
  request_middleware: 每个受保护请求校验JWT、用户ACTIVE、凭据ACTIVE/版本、Session ACTIVE，再实时计算RBAC和数据范围。
  transaction_boundaries:
  - 登录成功原子更新失败状态、创建Session并写审计。
  - 改密或重置原子递增credential_version、撤销Session并写审计。
  - 用户锁定或禁用原子变更用户状态、撤销Session并写审计/既有状态事件。
  decision_ids: [ADR-032]
