effect_classification:
  IMMEDIATE_INVARIANT: 直接来自产品/业务基线的当前约束，例如Playwright Web、平台状态权威、Runner Agent独立部署、AI候选不得直接成为正式事实。
  CANDIDATE: 设计建议，无FROZEN SYSTEM_DESIGN时不得用于工程初始化、目录创建、进程拆分、数据库产品、队列、Outbox或Adapter集合。
  FROZEN_ONLY: 仅在被FROZEN SYSTEM_DESIGN/DDL/契约吸收并通过验收后，才升级为MUST实现约束。
