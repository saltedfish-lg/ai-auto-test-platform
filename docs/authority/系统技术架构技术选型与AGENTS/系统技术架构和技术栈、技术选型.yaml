reliability_rules:
- rule_id: REL-001
  failure: 平台API重启
  handling: 所有业务状态在MySQL；客户端重试必须携带幂等键。
  effect_class: FROZEN_ONLY
- rule_id: REL-002
  failure: Worker重启
  handling: 任务领取使用租约；过期后可由其他Worker接管。
  effect_class: FROZEN_ONLY
- rule_id: REL-003
  failure: MySQL短暂故障
  handling: 停止写入并返回可重试错误，不缓存虚假成功。
  effect_class: FROZEN_ONLY
- rule_id: REL-004
  failure: 对象存储故障
  handling: 制品保持PENDING_UPLOAD/PENDING_RECOVERY，必要制品缺失时报告不得AVAILABLE。
  effect_class: FROZEN_ONLY
- rule_id: REL-005
  failure: Runner失联
  handling: 停止续租、回收资源、提高fencing并拒绝旧上报。
  effect_class: FROZEN_ONLY
- rule_id: REL-006
  failure: Runner恢复
  handling: 重新认证和健康校验；不得自动恢复已失效attempt所有权。
  effect_class: FROZEN_ONLY
- rule_id: REL-007
  failure: 浏览器崩溃
  handling: 按动作是否开始和结果可确认性进入BROKEN或ABORTED，并继续finalization。
  effect_class: FROZEN_ONLY
- rule_id: REL-008
  failure: 模型超时/限流
  handling: 同一候选内受限技术重试；跨候选切换由平台创建新ai_call_attempt。
  effect_class: FROZEN_ONLY
- rule_id: REL-009
  failure: 模型Schema错误
  handling: 保存真实错误和脱敏响应摘要，不发布候选。
  effect_class: FROZEN_ONLY
- rule_id: REL-010
  failure: 报告生成失败
  handling: 报告请求可幂等重放；执行结果保持不变。
  effect_class: FROZEN_ONLY
- rule_id: REL-011
  failure: 重复任务创建
  handling: 业务幂等键和唯一约束返回既有任务。
  effect_class: FROZEN_ONLY
- rule_id: REL-012
  failure: 重复结果上报
  handling: attempt id、lease id、fencing和result id共同去重。
  effect_class: FROZEN_ONLY
- rule_id: REL-013
  failure: 锁租约残留
  handling: 按expires_at扫描，强制释放生成新fencing并审计。
  effect_class: FROZEN_ONLY
- rule_id: REL-014
  failure: 网络分区
  handling: Runner本地只继续已确认所有权且租约仍有效的工作；无法续租停止新动作并受控收口。
  effect_class: FROZEN_ONLY
- rule_id: REL-015
  failure: 版本升级中任务
  handling: 任务固定协议、配置和资产版本；旧Worker/Runner保留到运行中任务终态。
  effect_class: FROZEN_ONLY
- rule_id: REL-016
  failure: 可观测组件故障
  handling: 业务继续；遥测缓冲、限量丢弃或降级并产生平台技术告警。
  effect_class: FROZEN_ONLY
