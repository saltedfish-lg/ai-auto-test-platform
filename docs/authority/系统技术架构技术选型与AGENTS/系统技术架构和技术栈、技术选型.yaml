  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
- decision_id: TADR-019
  title: 锁与租约
  decision: 候选建议：使用MySQL原子事务、唯一约束、CAS和fencing token。
  status: ACCEPTED_IN_R3
  current_effect: NORMATIVE_IN_R3
  effect_class: FROZEN_ONLY
