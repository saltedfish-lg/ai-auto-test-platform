  name: 灾备目标
  scope_status: IN_SCOPE_MANDATORY
  priority: P1
  blocking_current_release: false
  current_scope: IN_SCOPE_MANDATORY
  statement: 平台必须按ADR-019执行业务数据库与制品备份恢复、S3兼容存储、每日备份和季度恢复演练；元数据RPO≤24小时/RTO≤8小时，制品RPO≤24小时/RTO≤24小时。
  acceptance_direction: 验证备份、恢复演练、RPO/RTO证据、责任Owner和审计记录。
