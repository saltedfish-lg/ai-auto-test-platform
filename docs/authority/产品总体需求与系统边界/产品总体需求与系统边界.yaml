platform_responsibilities:
- responsibility_id: PRESP-001
  statement: 维护平台身份、角色、权限、项目职责和数据范围。
- responsibility_id: PRESP-002
  statement: 维护项目、环境、业务终端、测试账号、测试数据和配置版本。
- responsibility_id: PRESP-003
  statement: 管理自然语言用例、结构化用例、版本、步骤、套件和执行计划。
- responsibility_id: PRESP-004
  statement: 编排自然语言转换、AI页面探索和人工录制，并执行候选校验与人工确认。
- responsibility_id: PRESP-005
  statement: 创建执行任务和不可变配置快照，管理任务、尝试、状态和结果。
- responsibility_id: PRESP-006
  statement: 注册、认证、绑定、调度和远程管理Runner，并治理锁、租约、槽位和资源。
- responsibility_id: PRESP-007
  statement: 管理跨端上下文变量、终端切换、结果聚合和敏感数据。
- responsibility_id: PRESP-008
  statement: 生成报告并管理日志、截图、视频、Trace等制品及其保留。
- responsibility_id: PRESP-009
  statement: 治理模型、Prompt、路由、调用、工具适配、监控、告警、审计和降级。
- responsibility_id: PRESP-010
  statement: 持久化平台正式业务事实、状态事件、快照、租约、报告元数据和审计记录。
platform_non_responsibilities:
- non_responsibility_id: PNRESP-001
  statement: 不保证被测系统业务逻辑、页面、接口、网络、SSO、账号权限或数据质量正确。
- non_responsibility_id: PNRESP-002
  statement: 不替代外部SSO、模型供应商、对象存储和可观测组件的内部责任。
- non_responsibility_id: PNRESP-003
  statement: 不知晓人工录制时测试人员实际输入的业务身份和凭证。
- non_responsibility_id: PNRESP-004
  statement: 不访问未获授权的生产数据，也不为缺失的被测业务规则作产品推断。
- non_responsibility_id: PNRESP-005
  statement: 不把第三方工具内部状态或Runner本地临时状态视为平台最终业务事实。
- non_responsibility_id: PNRESP-006
  statement: 不通过本产品文档定义数据库物理实现、接口参数或第三方内部数据结构。
runner_boundary:
  platform_responsibilities:
  - 提供注册与认证入口
  - 维护Runner身份和项目绑定
  - 定义能力需求
  - 维护平台权威状态投影
  - 调度任务和分配资源租约
  - 下发固定任务快照和指令
  - 聚合进度、结果和制品
  - 执行远程治理与审计
  runner_agent_responsibilities:
  - 运行在独立执行机
  - 检测并上报能力、资源、连接和健康
  - 接收或领取获准任务
  - 执行本地环境检查
  - 启动和管理浏览器
  - 执行Playwright步骤
  - 提供受控人工录制会话
  - 采集并回传日志、截图、视频和Trace
  - 隔离并清理本地资源
  - 持续心跳和异常上报
  runner_prohibitions:
  - 不得自行创建平台业务任务
  - 不得修改用例版本、平台权限或正式业务事实
  - 不得改变项目绑定规则
  - 不得把本地临时状态作为最终权威状态
  deployment_boundary: Runner执行机是可部署在其他机器上的独立执行单元；平台通过Runner Agent进行远程管理、调度和状态观测。
ai_boundary:
  ai_capabilities:
  - 理解自然语言用例
  - 生成结构化步骤草稿
  - 在页面探索中选择候选动作
  - 识别候选定位器
  - 建议断言
  - 分析失败
  - 提供修复建议
  platform_controls:
  - 构造和最小化模型输入
  - 校验权限和敏感数据
  - 选择模型和路由
  - 校验输出结构与安全
  - 管理状态、版本和人工确认
  - 持久化获准结果
  - 执行超时、重试和降级
  - 记录调用审计
  hard_rule: AI输出在未经平台规则校验和必要人工确认前，不得自动成为正式产品事实或已发布测试资产。
third_party_tool_boundaries:
- tool: Playwright
  foundation_capability: Web浏览器自动化、网络监听、Trace、截图和视频采集。
  adopted_scope: 正式执行、AI探索和人工录制的浏览器技术动作。
  platform_retained: 用例、任务、权限、状态、报告、审计和事实治理。
  business_fact_source: false
  failure_handling: 浏览器或动作失败进入平台执行结果、恢复和制品流程。
- tool: Playwright MCP/CLI
  foundation_capability: 向AI提供浏览器工具调用和探索辅助。
  adopted_scope: AI页面探索的技术适配。
  platform_retained: 探索任务、候选、版本、人工确认和权限。
  business_fact_source: false
  failure_handling: 工具失败按AI探索异常处理并保留证据。
- tool: Temporal
  foundation_capability: 持久化工作流编排。
  adopted_scope: 第一版不作为运行依赖，后续可选。
  platform_retained: 业务任务、状态、锁、租约和幂等事实。
  business_fact_source: false
  failure_handling: 当前无运行时依赖；未来接入必须具备迁移和降级。
- tool: LangGraph
  foundation_capability: AI节点和checkpoint编排。
  adopted_scope: 第一版可由平台轻量实现，后续可替换。
  platform_retained: AI任务、候选、人工决定、权限和业务状态。
  business_fact_source: false
  failure_handling: 编排失败进入AI任务重试、恢复或终止。
- tool: LiteLLM或模型网关
  foundation_capability: 统一模型协议、供应商适配和技术路由。
  adopted_scope: 模型调用技术入口。
  platform_retained: 模型配置权限、业务路由、AI任务状态和降级决策。
  business_fact_source: false
  failure_handling: 超时、限流或供应商失败按平台策略重试或降级。
- tool: Langfuse
  foundation_capability: AI调用可观测性。
  adopted_scope: 第一版不作为运行依赖，后续可选。
  platform_retained: 正式审计、任务、报告和AI结果。
  business_fact_source: false
  failure_handling: 不可用不得影响平台正式事实。
- tool: OpenTelemetry
  foundation_capability: 日志、指标和链路遥测。
  adopted_scope: 技术可观测性。
  platform_retained: 业务告警、审计、状态和报告。
  business_fact_source: false
  failure_handling: 遥测降级，不得改变业务结果。
- tool: Grafana
  foundation_capability: 指标和链路可视化。
  adopted_scope: 技术监控看板。
  platform_retained: 正式报告、权限、告警处置和审计。
  business_fact_source: false
  failure_handling: 展示不可用时平台业务继续运行并告警。
tested_system_boundary:
  tested_terminals:
  - 被测管理端Web系统
  - 被测客户端Web系统
  - 被测PDA端Web系统
  rules:
  - 三个终端均按Web页面建模并优先使用Playwright Web方式
  - 平台通过用户界面模拟测试操作
  - 加密API场景优先由UI触发并监听网络响应提取数据
  - 平台不直接改变被测系统业务规则
  - 静态资源加载不默认作为业务成功等待条件
  tested_system_responsibilities:
  - 自身业务规则和数据
  - 自身账号、业务权限和SSO
  - 页面、接口、网络和服务可用性
  platform_responsibilities:
  - 执行获准用例
  - 采集页面和网络证据
  - 记录终端、步骤和失败位置
  - 聚合测试结果
