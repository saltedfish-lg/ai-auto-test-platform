capability_domains:
- capability_domain_id: CAPDOM-01
  name: 身份、用户与权限
  definition: 管理平台登录主体、系统角色、项目职责、权限、数据范围、敏感访问与审计。
  primary_users:
  - 超级管理员
  - 平台管理员
  - 项目负责人
  key_outputs:
  - 可登录用户
  - 授权关系
  - 项目数据范围
  - 审计记录
- capability_domain_id: CAPDOM-02
  name: 项目与测试资产
  definition: 管理项目、环境、业务系统、Web业务终端、测试账号、测试数据和配置版本。
  primary_users:
  - 项目负责人
  - 项目功能管理员
  - 测试负责人
  key_outputs:
  - 项目配置
  - 执行前置配置
  - 测试资源
- capability_domain_id: CAPDOM-03
  name: 用例创建与版本管理
  definition: 管理自然语言用例、标准结构用例、步骤、变量、断言、版本、发布、归档和引用。
  primary_users:
  - 用例设计人员
  - 用例与资产版本审核人员
  key_outputs:
  - 结构化用例草稿
  - 不可变发布版本
- capability_domain_id: CAPDOM-04
  name: 自然语言转换
  definition: 在不打开浏览器、不占用Runner的条件下，将自然语言测试意图转换为结构化候选。
  primary_users:
  - 用例设计人员
  key_outputs:
  - 结构化候选
  - 校验结果
- capability_domain_id: CAPDOM-05
  name: AI页面探索
  definition: 在Runner受控浏览器中由AI探索页面，生成或校验步骤、定位器和断言候选。
  primary_users:
  - 用例设计人员
  - 测试负责人
  key_outputs:
  - 探索任务
  - AI候选
  - 探索证据
- capability_domain_id: CAPDOM-06
  name: 人工业务流程录制
  definition: 由测试人员在Runner执行机受控浏览器中主动操作并采集单端或跨端业务流程。
  primary_users:
  - 用例设计人员
  - 功能测试人员画像
  key_outputs:
  - 录制会话
  - 录制证据包
  - 结构化候选
- capability_domain_id: CAPDOM-07
  name: 用例套件与执行计划
  definition: 组织已发布用例版本、依赖顺序、参数、触发规则和执行计划。
  primary_users:
  - 测试负责人
  - 任务执行人员
  key_outputs:
  - 套件版本
  - 执行计划
  - 触发规则
- capability_domain_id: CAPDOM-08
  name: 正式执行与调度
  definition: 创建任务快照，校验权限和并发，选择Runner，执行、取消、中止、重试和恢复。
  primary_users:
  - 任务执行人员
  - 测试负责人
  key_outputs:
  - 执行任务
  - 执行尝试
  - 用例结果
  - 最终结果
- capability_domain_id: CAPDOM-09
  name: Runner管理
  definition: 管理Runner Agent注册、认证、项目独占绑定、能力、心跳、健康、资源和远程治理。
  primary_users:
  - Runner管理员
  - 平台管理员
  key_outputs:
  - Runner状态
  - 能力投影
  - 资源租约
- capability_domain_id: CAPDOM-10
  name: 跨端执行上下文
  definition: 维持管理端、客户端和PDA端的顺序执行、变量提取、敏感数据保护和报告聚合。
  primary_users:
  - 任务执行人员
  - 测试负责人
  key_outputs:
  - 上下文变量
  - 跨端链路
  - 终端级结果
- capability_domain_id: CAPDOM-11
  name: 报告、日志与制品
  definition: 聚合初次与重试结果，生成报告并管理日志、截图、视频、Trace等制品及其保留。
  primary_users:
  - 报告查看人员
  - 测试负责人
  - 获授权审计访问主体
  key_outputs:
  - 执行报告
  - 日志索引
  - 制品索引
  - 清理审计
- capability_domain_id: CAPDOM-12
  name: AI模型与工具治理
  definition: 治理模型、Prompt、路由、调用、降级、第三方工具适配、监控告警和业务事实边界。
  primary_users:
  - 模型管理员
  - 模型版本审核人员
  - 平台管理员
  key_outputs:
  - 模型配置
  - AI调用记录
  - 组件配置
  - 技术告警
product_requirements:
- requirement_id: PRD-BND-001
  requirement_name: 平台数据库事实边界
  requirement_type: BOUNDARY
  statement: 平台数据库及平台事务是业务主记录、状态事件、快照、租约、报告元数据和审计的唯一业务事实源。
  capability_domain: CAPDOM-12
  primary_users:
  - 模型管理员
  - 模型版本审核人员
  - 平台管理员
  current_scope: IN_SCOPE_MANDATORY
  priority: P0
  business_value: 隔离第三方技术能力与平台业务事实，降低供应商和实现耦合。
  input: 由授权主体、系统事件或运行依赖提供与本需求相符的输入。
  output: 产生可审计的业务对象、状态、结果、证据或明确阻断原因。
  product_boundary: 仅在平台职责和当前范围内成立，不替代被测系统或第三方工具职责。
  acceptance_direction: 通过责任边界、异常路径和禁止行为测试验证不存在越权或事实源倒置。
  downstream_impact: 约束架构边界、状态机、权限、调度、接口和实现责任。
  source_status: SUPPORTED_BY_MULTIPLE_SOURCES
  blocking_current_release: true
