product_background:
  summary: 现有自动化测试工作需要把自然语言、AI探索、人工录制、结构化用例、Runner执行、跨端流程、并发控制、重试和证据追溯纳入统一平台。
  quantitative_baseline: 输入材料未提供现状成本、覆盖率、失败率或ROI量化数据，因此不设无依据收益指标。
problem_definition:
- problem_id: PROB-001
  name: 自动化资产创建门槛高
  description: 功能测试人员难以直接编写和维护复杂自动化代码，自然语言测试意图缺少稳定的结构化承接。
  affected_users:
  - 功能测试人员
  - 用例设计人员
  product_response:
  - 自然语言用例
  - 结构转换
  - AI页面探索
  - 人工录制
  - 版本审核
- problem_id: PROB-002
  name: 多端执行和执行前置分散
  description: 项目、环境、终端、账号、数据和Runner条件分散会造成调度不确定、SSO冲突和跨端上下文断裂。
  affected_users:
  - 测试负责人
  - 任务执行人员
  product_response:
  - 项目测试资产管理
  - 任务快照
  - Runner调度
  - 锁与租约
  - 跨端上下文
- problem_id: PROB-003
  name: 执行证据和结果口径不统一
  description: 初次执行、重试、报告、日志和制品缺少统一关联时，失败原因和最终结果难以解释。
  affected_users:
  - 报告查看人员
  - 测试负责人
  - 审计访问主体
  product_response:
  - 执行结果模型
  - 报告生成
  - 制品索引
  - 保留与清理
  - 审计
- problem_id: PROB-004
  name: AI和第三方工具可能侵入业务事实
  description: 模型或技术组件若直接拥有状态、权限或业务事实，会导致供应商耦合和不可控实现分歧。
  affected_users:
  - 平台管理员
  - 模型管理员
  - 研发与Codex编码环境
  product_response:
  - 模型治理
  - Adapter边界
  - 平台事实源
  - Living Authority治理与实现准入
product_positioning:
  product_name: AI自动化测试执行平台
  product_type: AI驱动、Runner执行、事实治理的Web自动化测试执行平台
  what_it_is: 面向测试团队的测试资产生成、治理、调度执行和证据管理平台。
  what_it_is_not:
  - 不是被测业务运营系统
  - 不是通用研发项目管理平台
  - 不是低代码业务应用开发平台
  - 不是单机脚本工具
  - 不是无治理的浏览器Agent
  primary_users:
  - 平台治理人员
  - 项目和测试负责人
  - 用例设计与审核人员
  - 任务执行与报告查看人员
  - 模型与Runner管理人员
  core_problem: 将测试意图稳定转化为正式测试资产，并在受控资源、权限、并发和证据体系中执行。
  ai_role: 生成候选、辅助探索和分析，不拥有正式事实。
  runner_role: 作为独立执行面执行浏览器任务和录制，不拥有平台业务状态。
  tested_system_relationship: 平台对被测Web系统执行操作和观察，不承载或改变其业务规则。
product_vision:
  statement: 让测试人员能够以自然语言、AI页面探索或人工业务流程录制表达测试意图，并在统一权限、事实、版本、Runner、执行、报告和审计体系内形成可维护、可重复、可追溯的Web自动化测试资产。
product_goals:
- goal_id: GOAL-001
  name: 统一测试意图到正式资产的路径
  statement: 让测试人员能够通过自然语言、AI探索或人工录制表达业务测试意图，并最终形成可审核、可发布、可重复执行的标准结构用例版本。
- goal_id: GOAL-002
  name: 统一执行资源和过程治理
  statement: 在项目、环境、终端、账号、测试数据、Runner、锁和租约约束下确定性创建、调度和执行任务。
- goal_id: GOAL-003
  name: 统一跨端执行和上下文
  statement: 支持管理端、客户端和PDA端Web流程的顺序执行、变量传递和证据聚合。
- goal_id: GOAL-004
  name: 统一结果证据和生命周期
  statement: 保留初次执行、重试、最终结果、报告、日志和制品的完整追溯链，并执行权限、保留和清理治理。
- goal_id: GOAL-005
  name: 建立独立可落地的产品事实源
  statement: 使产品范围、责任边界、固定约束和成功标准无需依赖其他文档即可被下游设计、实现和验收消费。
sub_goals:
- sub_goal_id: SUBG-001
  name: 统一自动化测试执行入口
  statement: 平台应把自然语言用例、结构转换、AI页面探索、人工录制、标准结构用例和正式执行纳入同一受治理产品边界。
  requirement_id: PRD-GOL-001
- sub_goal_id: SUBG-002
  name: 降低用例创建门槛
  statement: 功能测试人员应能够用自然语言创建用例，并通过不打开浏览器的结构转换或打开受控浏览器的AI探索形成结构化候选。
  requirement_id: PRD-GOL-002
- sub_goal_id: SUBG-003
  name: 形成统一标准结构用例事实
  statement: 所有可正式执行的用例必须收敛为经审核发布的不可变标准结构用例版本，候选、录制证据和脚本不得替代该事实。
  requirement_id: PRD-GOL-003
- sub_goal_id: SUBG-004
  name: 支持单端和跨端业务流程
  statement: 平台应支持管理端、客户端和PDA端等Web业务终端的单端与跨端测试，并在同一attempt中保持顺序和上下文传递。
  requirement_id: PRD-GOL-004
- sub_goal_id: SUBG-005
  name: 统一项目测试资源管理
  statement: 平台应统一管理项目、环境、业务终端、访问配置、测试账号、测试数据、自动化资产和配置快照。
  requirement_id: PRD-GOL-005
- sub_goal_id: SUBG-006
  name: 统一Runner调度和受控执行
  statement: 平台应基于项目绑定、能力、健康、执行槽位、锁和租约选择Runner，并使单次attempt固定在一台Runner上执行。
  requirement_id: PRD-GOL-006
- sub_goal_id: SUBG-007
  name: 统一执行结果和证据追溯
  statement: 平台应把任务、attempt、用例结果、重试、报告、日志、截图、视频、Trace和其他制品建立可追溯关联。
  requirement_id: PRD-GOL-007
- sub_goal_id: SUBG-008
  name: 统一AI调用治理
  statement: 平台应统一模型接入、路由、Prompt、调用、候选、人工决定、审计、超时和降级，模型输出不得直接成为正式事实。
  requirement_id: PRD-GOL-008
- sub_goal_id: SUBG-009
  name: 建立可编码和可验收的事实闭包
  statement: 建立独立、可验证的产品事实，并要求后续架构、数据、接口、状态、权限和验收事实在进入Codex编码前形成完整 Living Authority 闭包；Codex不得自行补充产品规则。
  requirement_id: PRD-GOL-009
non_goals:
- non_goal_id: NG-001
  statement: 不替代被测管理端、客户端或PDA端，也不承载其业务交易功能。
- non_goal_id: NG-002
  statement: 不成为通用研发项目管理、需求管理、缺陷管理或低代码应用开发平台。
- non_goal_id: NG-003
  statement: 不管理被测系统内部用户、角色、业务权限、SSO规则或业务数据质量。
- non_goal_id: NG-004
  statement: 不默认支持Windows原生或Android原生控件自动化；当前业务终端均按Web页面处理。
- non_goal_id: NG-005
  statement: 不让AI模型未经校验和必要人工确认直接发布测试资产或定义正式业务事实。
- non_goal_id: NG-006
  statement: 不让Runner或第三方工具直接拥有或推进平台业务状态。
- non_goal_id: NG-007
  statement: 不保证外部网络、被测系统、外部SSO、模型供应方和对象存储永远可用。
- non_goal_id: NG-008
  statement: 不在人工录制前识别、校验或约束测试人员在页面中实际输入的业务账号和密码。
- non_goal_id: NG-009
  statement: 第一版不启用根任务内部并行、阶段级跨Runner或原生端自动化。
- non_goal_id: NG-010
  statement: 第一版不把Temporal、LangGraph或Langfuse设为不可替换的运行时业务事实源。
- non_goal_id: NG-011
  statement: 本文件不冻结数据库表、字段、完整OpenAPI、协议载荷或代码类。
- non_goal_id: NG-012
  statement: Codex不得依据不完整产品材料自行选择互斥业务规则。
human_roles:
- role_id: SUBJECT-USER
  name: 平台用户
  role_kind: LOGIN_SUBJECT
  purpose: 使用平台账号建立会话并通过角色和项目职责获得权限。
  responsibilities:
  - 按授权使用平台能力
  - 保护自身平台凭证
  - 遵守风险提示和审计要求
  management_scope: 由角色绑定和项目职责决定
  prohibited_or_not_responsible:
  - 不是角色
  - 不得直接持有菜单或接口权限
  data_scope: 由实时角色、项目职责和active/history范围计算
- role_id: ROLE-SUPER-ADMIN
  name: 超级管理员
  role_kind: AUTHORIZATION_ROLE
  purpose: 完成平台初始化、全局治理、跨项目管理和受控高风险操作。
  responsibilities:
  - 访问全部菜单和全部项目数据
  - 平台级用户、角色、权限和安全治理
  - 跨项目授权
  - Runner、模型、工具与系统配置治理
  management_scope: PLATFORM_ALL
  prohibited_or_not_responsible:
  - 不得删除、停用、归档admin或移除其SUPER_ADMIN绑定
  - 其他USER或SERVICE_ACCOUNT不得绑定SUPER_ADMIN
  data_scope: 平台全部active数据和依法保留的history数据；高风险操作仍必须审计。
- role_id: ROLE-PLATFORM-ADMIN
  name: 平台管理员
  role_kind: AUTHORIZATION_ROLE
  purpose: 维护平台级配置与技术资源，并在明确授权范围内处理跨项目事务。
  responsibilities:
  - 维护平台配置
  - 管理Runner和模型
  - 按明确对象ID进行跨项目授权
  - 具备附加权限时治理平台资产推广
  management_scope: PLATFORM_MANAGED_SCOPES
  prohibited_or_not_responsible:
  - 不得默认授予动态全部项目范围
  - 不得因平台角色自动获得全部项目业务数据
  - 不得在无源项目完整范围时操作平台资产推广
  data_scope: 平台技术数据；项目业务数据按明确项目ID或附加CROSS_PROJECT_AUTHORIZATION_GRANT_ALL权限获得
- role_id: ROLE-PROJECT-FUNCTION-ADMIN
  name: 项目功能管理员
  role_kind: AUTHORIZATION_ROLE
  purpose: 维护项目、环境、终端、账号、测试数据、自动化资产和项目执行配置。
  responsibilities:
  - 维护授权项目配置
  - 在权限与数据范围内管理项目资产
  management_scope: AUTHORIZED_PROJECTS
  prohibited_or_not_responsible:
  - 不得为自己提权
  - 无项目负责人或跨项目授权资格时不得授予全项目范围或成员管理能力
  - 不得操作未授权项目
  data_scope: 指定项目及七个项目数据子范围的active/history范围
- role_id: ROLE-TEST-LEAD
  name: 测试负责人
  role_kind: AUTHORIZATION_ROLE
  purpose: 确保测试资产、执行计划、正式执行和结果分析形成闭环。
  responsibilities:
  - 组织测试资产和计划
  - 分析执行结果
  - 按授权审批录制使用范围与并发风险
  - 按授权查看或停止项目录制任务
  management_scope: AUTHORIZED_PROJECTS
  prohibited_or_not_responsible:
  - 不得越过独立版本审核入口直接发布需审核资产
  - 不得操作未授权项目或敏感数据
  data_scope: 授权项目的测试资产、执行和报告范围
- role_id: ROLE-CASE-DESIGNER
  name: 用例设计人员
  role_kind: AUTHORIZATION_ROLE
  purpose: 把测试意图转化为可审核、可发布、可执行的标准结构用例资产。
  responsibilities:
  - 创建自然语言与标准结构用例
  - 发起结构转换、页面探索、人工录制、结构化和验证
  - 维护本人USER模型凭证
  management_scope: AUTHORIZED_PROJECTS
  prohibited_or_not_responsible:
  - 不得绕过版本审核直接发布需要审核的正式版本
  - 不得维护他人凭证
  - 不得操作未授权项目
  data_scope: 授权项目的用例、AI任务、录制和相关资产范围
- role_id: ROLE-ASSET-REVIEWER
  name: 用例与资产版本审核人员
  role_kind: AUTHORIZATION_ROLE
  purpose: 落实资产版本职责分离和正式发布门禁。
  responsibilities:
  - 审核、驳回、发布、停用和归档被授权资产版本
  management_scope: AUTHORIZED_PROJECTS_AND_ASSET_TYPES
  prohibited_or_not_responsible:
  - 不得审核未覆盖项目或资产类型
  - 不得使用通用审核入口替代独立发布入口
  - SERVICE_ACCOUNT不得承担审核或发布
  data_scope: 明确授权项目、资产类型和版本范围
- role_id: ROLE-TASK-EXECUTOR
  name: 任务执行人员
  role_kind: AUTHORIZATION_ROLE
  purpose: 在授权项目内发起受控执行并查看对应结果。
  responsibilities:
  - 创建单次任务
  - 使用授权执行计划
  - 正式执行时按权限显式更换受管账号映射
  - 具备录制权限时控制本人录制会话
  management_scope: AUTHORIZED_PROJECTS_AND_PLANS
  prohibited_or_not_responsible:
  - 不得直接发布生成用例
  - 人工录制不提供账号选择且不得声称识别手工输入身份
  - 不得操作未授权计划或项目
  data_scope: 授权项目、用例/套件、计划、账号映射和结果范围
- role_id: ROLE-REPORT-VIEWER
  name: 报告查看人员
  role_kind: AUTHORIZATION_ROLE
  purpose: 读取执行记录、报告和经授权的制品证据。
  responsibilities:
  - 查看授权范围报告
  - 具备独立权限时查看/下载制品或分享报告
  management_scope: AUTHORIZED_PROJECTS_ACTIVE_AND_HISTORY
  prohibited_or_not_responsible:
  - 不得因REPORT_VIEW自动下载制品或分享报告
  - 不得查看超出active/history范围的报告
  - 人工录制证据需额外MANUAL_RECORDING_VIEW
  data_scope: 动态派生的active_scope与history_read_scope
- role_id: ROLE-MODEL-ADMIN
  name: 模型管理员
  role_kind: AUTHORIZATION_ROLE
  purpose: 保障AI模型接入、路由、配置、凭证和运行可观测性。
  responsibilities:
  - 维护模型配置和路由
  - 维护Prompt和凭证
  - 查看授权范围AI调用日志
  - 配置平台资产推广专用路由与Prompt
  management_scope: PLATFORM_MODEL_CONFIGURATION_AND_AUTHORIZED_PROJECT_DATA
  prohibited_or_not_responsible:
  - 不得因模型权限自动访问项目业务Prompt、请求响应或资产
  - 不得绕过平台通过Langfuse访问业务数据
  - 不得自动取得源项目资产权限
  data_scope: 平台模型技术数据；项目业务内容按项目成员与范围校验
- role_id: ROLE-RUNNER-ADMIN
  name: Runner管理员
  role_kind: AUTHORIZATION_ROLE
  purpose: 维护Runner技术可用性和可调度性。
  responsibilities:
  - 安装、注册、诊断、绑定/解绑、升级Runner
  - 维护能力快照
  - 查看技术调度与资源指标
  management_scope: RUNNER_TECHNICAL_SCOPE_AND_AUTHORIZED_PROJECTS
  prohibited_or_not_responsible:
  - 无项目成员权限时不得查看用例步骤、账号、测试数据、变量、业务响应、业务日志、报告详情和制品
  - 不得自行修改任务业务状态
  data_scope: Runner技术数据；项目业务数据须另有项目成员权限
- role_id: ROLE-MODEL-REVIEWER
  name: 模型版本审核人员
  role_kind: AUTHORIZATION_ROLE
  purpose: 落实模型版本发布职责分离和受控变更。
  responsibilities:
  - 审核、驳回、发布、停用和归档模型相关版本
  management_scope: PLATFORM_MODEL_VERSION_REVIEW
  prohibited_or_not_responsible:
  - 不得因项目模型数据范围自动获得审核权限
  - 不得以模型管理员权限替代独立审核角色
  data_scope: 平台级模型版本审核范围；项目业务内容仍按项目数据权限
- role_id: ROLE-PROJECT-OWNER-DUTY
  name: 项目负责人
  role_kind: PROJECT_DUTY
  purpose: 确保项目始终存在合格负责人，并在项目范围内完成成员、职责和七个数据子范围治理。
  responsibilities:
  - 在负责项目内授予符合授权上限的动态全部范围
  - 管理项目成员
  - 变更项目负责人
  - 维护项目配置
  management_scope: OWNED_PROJECTS
  prohibited_or_not_responsible:
  - 不得操作非负责项目
  - SERVICE_ACCOUNT不得成为项目负责人
  - 不得在新负责人资格和范围未原子完成前移除最后一名旧负责人
  data_scope: 负责项目七个子范围active=ALL、history=ALL
system_actors:
- actor_id: SYS-PLATFORM-SERVICE
  name: 平台服务
  actor_type: INTERNAL_SYSTEM
  purpose: 承载权限校验、对象状态、数据持久化、任务管理、事实管理、报告聚合和审计事务。
  responsibilities:
  - 认证后授权校验
  - 业务对象与状态Owner持久化
  - 任务与快照管理
  - 报告聚合
  - 审计事件写入
  prohibited:
  - 不得把Runner或工具状态直接作为平台业务事实
  - 不得绕过正式状态Owner和CAS
  data_boundary: 平台正式数据
- actor_id: SYS-SCHEDULER
  name: 调度服务
  actor_type: INTERNAL_SYSTEM
  purpose: 负责任务排队、并发校验、Runner匹配、锁租约、幂等与超时。
  responsibilities:
  - 任务排队
  - 能力和项目绑定匹配
  - 账号/环境/Runner资源锁与租约
  - 重复投递幂等
  - 超时与重分配
  prohibited:
  - 不得修改用例事实
  - 不得把技术调度状态覆盖业务终态
  data_boundary: 调度和技术资源数据
- actor_id: SYS-RUNNER-AGENT
  name: Runner Agent
  actor_type: INTERNAL_SYSTEM
  purpose: 运行在执行机上的受控Agent，负责能力上报、浏览器执行、人工录制、日志制品采集和结果回传。
  responsibilities:
  - 注册认证与心跳
  - 能力和资源上报
  - 启动浏览器和Web终端
  - 执行Playwright步骤
  - 承载人工录制受控会话
  - 采集并上传日志与制品
  prohibited:
  - 不得自行修改平台用例、权限或业务状态
  - 不得跨项目领取任务
  - 不得把本地临时状态作为权威事实
  data_boundary: 任务快照和本地临时数据
- actor_id: SYS-AI-ORCHESTRATOR
  name: AI编排服务
  actor_type: INTERNAL_SYSTEM
  purpose: 构造模型输入、选择路由、校验输出、管理候选、重试降级与人工确认。
  responsibilities:
  - 结构转换编排
  - 页面探索决策编排
  - 候选结果校验
  - checkpoint与恢复
  - 模型超时/降级
  - 结果版本和审计
  prohibited:
  - 不得把模型输出直接发布为正式事实
  - 不得绕过项目、模型和凭证权限
  data_boundary: AI任务、候选、调用元数据和授权项目上下文
- actor_id: SYS-REPORT-SERVICE
  name: 报告生成服务
  actor_type: INTERNAL_SYSTEM
  purpose: 从不可变执行事实生成报告投影并维护报告可用性。
  responsibilities:
  - 报告生成
  - 重试结果聚合
  - 报告重生成请求
  - 可用性状态更新
  prohibited:
  - 不得把报告展示状态反写为执行事实
  - 不得改写根执行结果
  data_boundary: 执行事实只读与报告投影
- actor_id: SYS-ARTIFACT-SERVICE
  name: 制品服务
  actor_type: INTERNAL_SYSTEM
  purpose: 负责制品上传登记、存储索引、保留、Hold、延期与清理流程。
  responsibilities:
  - 制品登记和密封
  - 上传重试
  - 授权下载
  - 保留策略计算
  - 清理与审计
  prohibited:
  - 不得无权限暴露制品
  - 不得删除活动Hold或长期保留制品
  data_boundary: 制品元数据和对象存储引用
- actor_id: SYS-AUDIT-SERVICE
  name: 审计服务
  actor_type: INTERNAL_SYSTEM
  purpose: 在业务事务中记录不可变审计事件，支撑主体、对象、动作和前后状态追溯。
  responsibilities:
  - 审计事件写入
  - 高风险操作记录
  - SUPER_ADMIN例外行为记录
  - 审计查询投影
  prohibited:
  - 不得以异步丢失替代要求的事务内审计
  - 不得允许业务方修改历史审计
  data_boundary: 不可变审计数据
- actor_id: SYS-DATA-WORKER
  name: 测试数据工作服务
  actor_type: INTERNAL_SYSTEM
  purpose: 执行平台本地数据准备、资源分配、隔离、回收和数据任务。
  responsibilities:
  - 数据版本和资源池任务
  - 资源分配/回收
  - 隔离约束
  - 数据失效传播
  prohibited:
  - 不得绕过被测系统UI直接篡改受保护业务事实
  - 不得跨项目使用资源
  data_boundary: 平台测试数据和授权资源引用
- actor_id: SYS-MONITORING
  name: 监控与告警服务
  actor_type: INTERNAL_SYSTEM
  purpose: 采集平台、调度、Runner、模型和组件技术指标并生成技术告警。
  responsibilities:
  - 指标与日志采集
  - 健康投影
  - 告警生命周期
  - 通知触发
  prohibited:
  - 不得成为业务报告事实源
  - 不得用Grafana可用性决定业务任务状态
  data_boundary: 技术可观测数据
- actor_id: SYS-SERVICE-ACCOUNT
  name: 服务账号触发主体
  actor_type: NON_INTERACTIVE_SUBJECT
  purpose: 以SERVICE_ACCOUNT身份通过SCHEDULED/API触发获准FORMAL执行计划的非交互主体。
  responsibilities:
  - 按allowed_execution_plan_ids触发正式计划
  - 携带独立subject_type授权
  prohibited:
  - 无交互菜单
  - 不得成为项目负责人或管理成员
  - 不得创建AI任务
  - 不得进行candidate人工决定、版本审核或发布
  data_boundary: 明确获准项目和执行计划
- actor_id: SYS-VALIDATION-SERVICE
  name: 验证服务
  actor_type: SYSTEM_ACTOR
  purpose: 运行数据库、OpenAPI、主体、事实、场景和路径门禁的验证主体。
  responsibilities:
  - 执行长期验证规则
  - 输出不可变验证结果
  prohibited:
  - 不得反向定义业务事实
  data_boundary: 只读正式输入和验证结果
- actor_id: SYS-SCHEDULED-JOB
  name: 定时任务服务
  actor_type: INTERNAL_SERVICE
  purpose: 执行保留清理、健康检查和周期性治理任务。
  responsibilities:
  - 按已发布计划触发周期任务
  prohibited:
  - 不得绕过权限、幂等和审计
  data_boundary: 明确任务范围
- actor_id: SYS-BOOTSTRAP
  name: Bootstrap安装过程
  actor_type: SYSTEM_PROCESS
  purpose: 首次部署时原子创建admin与SUPER_ADMIN绑定。
  responsibilities:
  - 执行一次性平台初始化
  prohibited:
  - 不得重复创建第二个内置admin
  data_boundary: 初始化事务
external_actors:
- actor_id: EXT-TESTED-ADMIN-WEB
  name: 被测管理端Web系统
  actor_type: EXTERNAL_TESTED_SYSTEM
  purpose: 由Runner中的Playwright受控访问
  input_to_platform: 页面、响应和业务状态
  output_from_platform: 模拟用户操作与校验
  participant_responsibility: 自身业务规则、页面/API稳定性、账号权限
  failure_boundary: 故障记入执行证据，不由平台修复
- actor_id: EXT-TESTED-CLIENT-WEB
  name: 被测客户端Web系统
  actor_type: EXTERNAL_TESTED_SYSTEM
  purpose: 跨端流程中的Web终端
  input_to_platform: 页面、网络响应、订单/条码等业务数据
  output_from_platform: 受控操作与断言
  participant_responsibility: 自身业务与SSO行为
  failure_boundary: 登录或业务失败按执行规则记录
- actor_id: EXT-TESTED-PDA-WEB
  name: 被测PDA端Web系统
  actor_type: EXTERNAL_TESTED_SYSTEM
  purpose: 跨端核销等流程中的Web终端
  input_to_platform: 页面与核销结果
  output_from_platform: 受控操作与断言
  participant_responsibility: 自身核销业务和可用性
  failure_boundary: 终端失败定位到对应步骤与制品
- actor_id: EXT-SSO
  name: 外部SSO/身份系统
  actor_type: EXTERNAL_IDENTITY_SYSTEM
  purpose: 决定被测系统登录会话和真实身份约束
  input_to_platform: 登录结果和会话行为
  output_from_platform: 平台按配置发起登录操作
  participant_responsibility: SSO并发、会话和身份规则
  failure_boundary: 平台调度冲突与SSO真实冲突必须区分
- actor_id: EXT-MODEL-PROVIDER
  name: AI模型供应方
  actor_type: EXTERNAL_AI_SERVICE
  purpose: 通过模型网关或适配器提供推理
  input_to_platform: 模型响应、错误、用量
  output_from_platform: 经权限和脱敏构造的请求
  participant_responsibility: 模型可用性、限流和输出
  failure_boundary: 平台执行重试、降级、拒绝非法输出
- actor_id: EXT-OBJECT-STORAGE
  name: 对象存储
  actor_type: EXTERNAL_STORAGE
  purpose: 保存截图、视频、Trace和日志制品
  input_to_platform: 对象引用和存储状态
  output_from_platform: 加密/受权上传下载
  participant_responsibility: 存储可用性和持久性
  failure_boundary: 上传失败进入制品恢复，不改写执行事实
- actor_id: EXT-WORKFLOW
  name: 工作流/调度组件
  actor_type: THIRD_PARTY_COMPONENT
  purpose: 承接技术工作流和定时触发
  input_to_platform: 技术流状态
  output_from_platform: 工作流命令
  participant_responsibility: 内部工作流执行
  failure_boundary: 平台业务状态仍由Owner服务维护
- actor_id: EXT-LITELLM
  name: LiteLLM或模型网关
  actor_type: THIRD_PARTY_COMPONENT
  purpose: 模型路由和调用适配
  input_to_platform: 调用结果与技术指标
  output_from_platform: 模型调用请求
  participant_responsibility: 底层路由与协议适配
  failure_boundary: 不得跨候选fallback改变平台选择语义
- actor_id: EXT-LANGFUSE
  name: Langfuse
  actor_type: THIRD_PARTY_COMPONENT
  purpose: AI调用可观测性
  input_to_platform: Trace引用
  output_from_platform: 脱敏调用跟踪
  participant_responsibility: 技术Trace存储与展示
  failure_boundary: 不得绕过平台权限成为业务数据入口
- actor_id: EXT-OBSERVABILITY
  name: OTel/Grafana等可观测组件
  actor_type: THIRD_PARTY_COMPONENT
  purpose: 承载指标、链路和技术仪表盘
  input_to_platform: 指标和可视化
  output_from_platform: 技术遥测
  participant_responsibility: 技术展示
  failure_boundary: 不可用时平台业务报告仍应可用或降级
- actor_id: EXT-CODEX
  name: Codex编码环境
  actor_type: EXTERNAL_DEVELOPMENT_ENVIRONMENT
  purpose: 仅消费当前 Living Authority 中已闭包并通过正式 validators 的产品、架构和实现契约生成实现；未通过时仅用于分析、设计和一致性校验。
  input_to_platform: 经批准并纳入当前 Living Authority 的产品需求、架构决策、领域模型、数据与接口契约、验收规则及完整性校验结果。
  output_from_platform: 在分析阶段输出问题、设计和校验结果；在编码准入后输出代码、迁移、接口和测试实现。
  participant_responsibility: 严格执行经批准并纳入当前 Living Authority 的输入，不自行补充、改变或选择互斥业务规则。
  failure_boundary: 批准状态不完整、输入未纳入当前 Living Authority、依赖缺失、校验失败或内容哈希漂移时，必须阻断代码生成并返回明确原因。
