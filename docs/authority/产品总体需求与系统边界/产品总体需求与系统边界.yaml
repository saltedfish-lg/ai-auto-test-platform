approved_non_functional_baselines:
  PRD-NFR-001:
    statement: V1生产环境控制面月度可用率不得低于99.5%；提前公告的计划维护窗口不计入可用率；开发环境和测试环境不作为正式SLA考核对象。
    acceptance_direction: 按自然月统计生产控制面可用分钟数；以外部探针和服务端健康指标双源取证；剔除已公告维护窗口；月度可用率必须≥99.5%。
    slo_contract:
      metric: control_plane_monthly_availability
      target: 0.995
      window: CALENDAR_MONTH
      environment: PRODUCTION
      exclusions:
      - ANNOUNCED_PLANNED_MAINTENANCE
      evidence:
      - synthetic_probe_timeseries
      - service_health_timeseries
      - maintenance_window_registry
  PRD-NFR-002:
    statement: 在标准V1容量和正常网络条件下，普通查询P95≤500ms、P99≤1000ms；普通写入P95≤800ms、P99≤1500ms；异步命令受理P95≤300ms、P99≤800ms。文件上传下载、AI模型调用和浏览器执行不适用普通API指标，必须使用各自专用超时与性能验收规则。
    acceptance_direction: 在标准V1容量、正常网络、稳定预热后分别对普通查询、普通写入和异步命令受理采集不少于10000个有效样本；按服务端端到端时延计算P95/P99；专用长任务不得混入普通API统计。
    slo_contract:
      conditions:
      - STANDARD_V1_CAPACITY
      - NORMAL_NETWORK
      - WARMED_UP
      sample_minimum: 10000
      metrics:
        ordinary_query_ms:
          p95: 500
          p99: 1000
        ordinary_write_ms:
          p95: 800
          p99: 1500
        async_command_accept_ms:
          p95: 300
          p99: 800
      excluded_categories:
      - FILE_TRANSFER
      - AI_MODEL_CALL
      - BROWSER_EXECUTION
  PRD-NFR-003:
    statement: 当存在健康、已绑定、能力匹配的空闲Runner，且无环境锁、账号租约和资源冲突时，任务从进入可调度状态到Runner成功领取的时延必须满足P95≤3秒、P99≤10秒。
    acceptance_direction: 构造健康且能力匹配的空闲Runner、无锁租约冲突的标准调度场景，采集不少于5000次从SCHEDULABLE到CLAIMED的服务端时钟差；P95≤3秒且P99≤10秒。
    slo_contract:
      metric: schedulable_to_runner_claim_ms
      sample_minimum: 5000
      p95_ms: 3000
      p99_ms: 10000
      preconditions:
      - HEALTHY_BOUND_CAPABILITY_MATCHED_IDLE_RUNNER
      - NO_ENVIRONMENT_LOCK
      - NO_ACCOUNT_LEASE
      - NO_RESOURCE_CONFLICT
