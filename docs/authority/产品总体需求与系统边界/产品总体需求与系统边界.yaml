runtime_dependencies:
- dependency_id: DEP-001
  name: 平台数据库
  purpose: 保存业务主记录、状态事件、快照、租约、报告元数据和审计。
  responsible_party: 平台运维和数据库责任方
  unavailable_impact: 控制面写入和状态推进阻断。
  degradation: 只读能力可按安全策略降级，禁止提交部分事务。
  blocks_core_flow: true
- dependency_id: DEP-002
  name: 制品存储
  purpose: 保存截图、视频、Trace、日志和报告文件。
  responsible_party: 平台运维和存储责任方
  unavailable_impact: 制品上传、查看和清理受阻。
  degradation: 保留本地待上传状态并执行补偿，不得伪造可用。
  blocks_core_flow: false
- dependency_id: DEP-003
  name: Runner执行机与Runner Agent
  purpose: 提供Web浏览器执行、人工录制和证据采集。
  responsible_party: Runner管理员
  unavailable_impact: 需要浏览器的探索、录制和正式执行无法运行。
  degradation: 排队、重新调度或明确阻断。
  blocks_core_flow: true
- dependency_id: DEP-004
  name: 浏览器环境
  purpose: 承载Playwright Web自动化。
  responsible_party: Runner管理员
  unavailable_impact: 对应浏览器类型任务无法执行。
  degradation: 选择其他满足能力的Runner；无合格Runner则阻断。
  blocks_core_flow: true
- dependency_id: DEP-005
  name: 被测系统网络可达性
  purpose: 使Runner访问管理端、客户端和PDA端。
  responsible_party: 被测系统和网络责任方
  unavailable_impact: 测试步骤失败或无法开始。
  degradation: 记录外部失败、重试或中止，不由平台修复外部系统。
  blocks_core_flow: true
- dependency_id: DEP-006
  name: 测试账号与凭证
  purpose: 供AI探索和正式执行登录被测系统。
  responsible_party: 项目配置责任方和被测系统账号责任方
  unavailable_impact: 登录相关任务阻断。
  degradation: 使用已批准替代账号或明确失败；人工录制例外不依赖平台账号。
  blocks_core_flow: true
- dependency_id: DEP-007
  name: AI模型或模型网关
  purpose: 提供自然语言转换、探索决策和分析能力。
  responsible_party: 模型管理员和供应方
  unavailable_impact: AI相关路径受阻。
  degradation: 按配置重试、路由或降级；不影响已有正式用例的确定性执行。
  blocks_core_flow: false
- dependency_id: DEP-008
  name: 调度与异步工作能力
  purpose: 执行任务排队、派发、等待、补偿和定时触发。
  responsible_party: 平台服务
  unavailable_impact: 新任务派发、恢复和后台作业阻断。
  degradation: 保持已提交状态并告警，恢复后幂等继续。
  blocks_core_flow: true
- dependency_id: DEP-009
  name: 可观测性能力
  purpose: 收集日志、指标和链路并发出技术告警。
  responsible_party: 平台运维
  unavailable_impact: 诊断和告警能力下降。
  degradation: 业务事实继续由平台持有，进入观测降级并审计。
  blocks_core_flow: false
- dependency_id: DEP-010
  name: 通知渠道
  purpose: 发送任务、告警或治理通知。
  responsible_party: 平台管理员和渠道责任方
  unavailable_impact: 通知延迟或失败。
  degradation: 业务事务不回滚，记录失败并重试。
  blocks_core_flow: false
- dependency_id: DEP-011
  name: 统一系统时间
  purpose: 支撑租约、过期、审计、排序和追溯。
  responsible_party: 基础设施责任方
  unavailable_impact: 租约和事件顺序不可信。
  degradation: 时间漂移超阈值时阻断高风险调度并告警。
  blocks_core_flow: true
risks_and_limitations:
- risk_id: RISK-001
  name: 被测系统变化
  description: 页面结构、接口、SSO或业务数据变化会使自动化资产失效。
  mitigation: 通过版本化用例、定位器候选、失败证据和人工审核维护资产。
- risk_id: RISK-002
  name: AI输出不确定
  description: 模型可能生成无效、越界或不稳定候选。
  mitigation: 执行结构校验、安全检查、人工确认、版本发布和可追溯审计。
- risk_id: RISK-003
  name: 人工录制身份未知
  description: 平台无法预知测试人员手工输入的账号，真实SSO冲突可能由外部系统触发。
  mitigation: 展示风险、记录会话和证据、限制Runner资源，不虚构账号互斥保证。
- risk_id: RISK-004
  name: Runner分布式故障
  description: 执行机失联、浏览器崩溃或资源泄漏会影响任务。
  mitigation: 心跳、租约、防陈旧令牌、受控恢复、资源释放和证据上传。
- risk_id: RISK-005
  name: 外部组件不可用
  description: 模型、存储、通知和遥测组件可能超时或中断。
  mitigation: Adapter隔离、固定错误分类、重试、降级和业务事实独立持有。
- risk_id: RISK-006
  name: 历史开放决策回退风险
  description: 实现可能误读旧版候选或OPEN描述。
  mitigation: 以当前 Living Authority、ADR 历史 provenance 与机械一致性门禁为准，禁止旧发布/冻结模型回退为当前事实。
success_criteria:
- success_id: SC-001
  statement: 授权用户可以创建、编辑和保存自然语言用例。
  verification: 执行自然语言用例创建场景并检查主记录、修订和权限审计。
- success_id: SC-002
  statement: 用户可以在不打开浏览器、不占用Runner的条件下生成结构化候选。
  verification: 执行结构转换场景并验证无浏览器和Runner资源。
- success_id: SC-003
  statement: 用户可以在受控Runner浏览器中发起AI页面探索并获得可确认候选。
  verification: 执行AI探索正常、权限拒绝、账号冲突和模型异常场景。
- success_id: SC-004
  statement: 用户可以发起单端和跨端人工业务流程录制。
  verification: 执行单端、跨端、暂停恢复、中断恢复和敏感输入场景。
- success_id: SC-005
  statement: 转换、探索和录制候选可以经校验、审核形成不可变发布用例版本。
  verification: 验证候选处理、版本审核、发布、驳回和归档。
- success_id: SC-006
  statement: 用户可以将已发布用例版本组织为套件并维护顺序和依赖。
  verification: 验证套件创建、DAG校验、版本引用和参数覆盖。
- success_id: SC-007
  statement: 用户可以创建执行计划并通过手工或定时方式产生任务。
  verification: 验证计划启停、触发、幂等和任务快照。
- success_id: SC-008
  statement: 平台可以根据项目绑定、能力、健康和槽位确定性调度Runner。
  verification: 验证AUTO和SPECIFIC选择、无合格Runner和失联场景。
- success_id: SC-009
  statement: 平台可以执行管理端、客户端和PDA端的单端及跨端Web流程。
  verification: 执行单端和跨端任务并核对终端顺序、步骤和制品。
- success_id: SC-010
  statement: 平台可以在执行任务范围内提取、保护和传递跨端上下文。
  verification: 验证变量产生、消费、覆盖、隔离、敏感保护和失败定位。
- success_id: SC-011
  statement: 平台可以实施正式执行账号/SSO互斥和不同身份条件并行。
  verification: 执行同身份冲突、不同身份并行、锁和租约过期场景。
- success_id: SC-012
  statement: 平台可以保留人工录制不绑定账号身份的并发例外，同时保护Runner物理资源。
  verification: 在正式任务存在时发起录制，验证不做账号阻断、不抢占且资源不足时阻断。
- success_id: SC-013
  statement: 平台可以取消、中止、统一重试并恢复异常任务。
  verification: 验证取消请求、系统中止、Failed/Broken重试、主动跳过排除和资源释放。
- success_id: SC-014
  statement: 平台可以生成包含初次、重试和最终结果的可追溯报告。
  verification: 核对任务、版本、环境、账号快照、Runner、尝试和报告关联。
- success_id: SC-015
  statement: 平台可以采集、上传、授权查看和清理日志、截图、视频和Trace。
  verification: 验证上传完整性、安全扫描、权限、保留、Hold和清理审计。
- success_id: SC-016
  statement: 平台可以实施平台级与项目级权限、数据范围和敏感访问控制。
  verification: 执行授权、撤权、跨项目、历史报告和高风险操作场景。
- success_id: SC-017
  statement: 平台可以对关键状态变化、权限、人工决定、资源控制和清理形成不可变审计。
  verification: 验证审计强一致性、查询和失败回滚。
- success_id: SC-018
  statement: 模型和工具异常时平台能够提示、重试、降级或阻断，而不丢失业务事实。
  verification: 模拟超时、限流、编排、存储、遥测和通知故障。
- success_id: SC-019
  statement: 本文件在输入包不可访问时仍能独立说明定位、范围、主体、能力、边界、约束和成功标准。
  verification: 执行独立性问题集、禁用引用扫描和多格式字段闭包检查。
