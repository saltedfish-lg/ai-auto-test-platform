- requirement_id: PRD-NFR-001
  requirement_name: 控制面可用性
  requirement_type: NON_FUNCTIONAL
  statement: V1生产环境控制面月度可用率不得低于99.5%；提前公告的计划维护窗口不计入可用率；开发环境和测试环境不作为正式SLA考核对象。
  capability_domain: CAPDOM-12
  primary_users:
  - 模型管理员
  - 模型版本审核人员
  - 平台管理员
  current_scope: IN_SCOPE_APPROVED
  priority: P1
  business_value: 隔离第三方技术能力与平台业务事实，降低供应商和实现耦合。
  acceptance_direction: 按自然月统计生产控制面可用分钟数；以外部探针和服务端健康指标双源取证；剔除已公告维护窗口；月度可用率必须≥99.5%。
  downstream_impact: 约束系统架构、部署、可观测性、安全和验收设计。
  source_status: USER_CONFIRMED_2026-08-06
  blocking_current_release: true
  calibration_class: CURRENT_V1_SLO
  slo_contract:
    metric: control_plane_monthly_availability
    target: 0.995
    window: CALENDAR_MONTH
    environment: PRODUCTION
    exclusions:
    - ANNOUNCED_PLANNED_MAINTENANCE
    evidence:
    - synthetic_probe_timeseries
    - service_health_timeseries
    - maintenance_window_registry
  scope_status: IN_SCOPE_APPROVED
  approval_status: APPROVED
- requirement_id: PRD-NFR-002
  requirement_name: API响应时延
  requirement_type: NON_FUNCTIONAL
  statement: 在标准V1容量和正常网络条件下，普通查询P95≤500ms、P99≤1000ms；普通写入P95≤800ms、P99≤1500ms；异步命令受理P95≤300ms、P99≤800ms。文件上传下载、AI模型调用和浏览器执行不适用普通API指标，必须使用各自专用超时与性能验收规则。
  capability_domain: CAPDOM-12
  primary_users:
  - 模型管理员
  - 模型版本审核人员
  - 平台管理员
  current_scope: IN_SCOPE_APPROVED
  priority: P1
  business_value: 隔离第三方技术能力与平台业务事实，降低供应商和实现耦合。
  acceptance_direction: 在标准V1容量、正常网络、稳定预热后分别对普通查询、普通写入和异步命令受理采集不少于10000个有效样本；按服务端端到端时延计算P95/P99；专用长任务不得混入普通API统计。
  downstream_impact: 约束系统架构、部署、可观测性、安全和验收设计。
  source_status: USER_CONFIRMED_2026-08-06
  blocking_current_release: true
  calibration_class: CURRENT_V1_SLO
  slo_contract:
    conditions:
    - STANDARD_V1_CAPACITY
    - NORMAL_NETWORK
    - WARMED_UP
    sample_minimum: 10000
    metrics:
      ordinary_query_ms:
        p95: 500
        p99: 1000
      ordinary_write_ms:
        p95: 800
        p99: 1500
      async_command_accept_ms:
        p95: 300
        p99: 800
    excluded_categories:
    - FILE_TRANSFER
    - AI_MODEL_CALL
    - BROWSER_EXECUTION
  scope_status: IN_SCOPE_APPROVED
  approval_status: APPROVED
