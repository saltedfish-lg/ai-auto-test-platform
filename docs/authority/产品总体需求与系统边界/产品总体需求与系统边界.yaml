core_business_scenarios:
- scenario_id: PS-001
  scenario_name: 系统Bootstrap初始化和默认admin创建
  initiator: 平台服务
  business_goal: 建立可登录且安全的初始平台
  primary_input: 首次部署且初始化标记不存在
  main_processing: 平台服务在单一事务中创建admin、SUPER_ADMIN内置绑定和初始化审计
  primary_output: 可写服务或阻断结果
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 可写服务或阻断结果
- scenario_id: PS-002
  scenario_name: 用户、角色和项目授权配置
  initiator: 平台管理员
  business_goal: 为人员分配可登录角色和项目数据范围
  primary_input: admin正常；角色已启用
  main_processing: 创建用户；分配角色；建立项目成员和数据范围
  primary_output: 用户获得受控权限
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 用户获得受控权限
- scenario_id: PS-003
  scenario_name: 项目和执行前置创建
  initiator: 项目负责人
  business_goal: 建立项目、环境、业务终端和访问配置
  primary_input: 具备项目创建权限
  main_processing: 创建项目；配置环境与Web终端；发布访问配置
  primary_output: 项目进入可诊断状态
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 项目进入可诊断状态
- scenario_id: PS-004
  scenario_name: 测试账号和登录诊断
  initiator: 项目功能管理员
  business_goal: 建立可用于受管执行的账号资格
  primary_input: 账号、凭证、登录策略已配置
  main_processing: 创建映射；选择Runner诊断；记录PASS/FAIL资格
  primary_output: current登录资格
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: current登录资格
- scenario_id: PS-005
  scenario_name: Runner注册和项目绑定
  initiator: Runner管理员
  business_goal: 使执行节点可被项目调度
  primary_input: Runner Agent已安装
  main_processing: 注册认证；检测能力；绑定项目；健康上报
  primary_output: 可调度Runner
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 可调度Runner
- scenario_id: PS-006
  scenario_name: 创建自然语言用例
  initiator: 用例设计人员
  business_goal: 保存业务测试意图
  primary_input: 项目和模块可用
  main_processing: 新建主记录；保存不可变修订；关联业务模块
  primary_output: 自然语言用例current修订
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 自然语言用例current修订
- scenario_id: PS-007
  scenario_name: 自然语言直接转换
  initiator: 用例设计人员
  business_goal: 不打开浏览器形成结构化候选
  primary_input: 自然语言修订已保存；模型路由可用
  main_processing: 发起STRUCTURE_CONVERSION；校验模型结果；创建candidate
  primary_output: 结构化候选
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 结构化候选
- scenario_id: PS-008
  scenario_name: AI页面探索
  initiator: 用例设计人员
  business_goal: 在真实页面探索并生成候选步骤
  primary_input: 项目Runner可用；环境和账号资格满足
  main_processing: 获取锁/租约；固定Runner；MCP受控探索；密封证据
  primary_output: AI结果和candidate
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: AI结果和candidate
- scenario_id: PS-009
  scenario_name: 人工录制单端流程
  initiator: 用例设计人员
  business_goal: 采集测试人员真实操作并生成录制证据
  primary_input: Runner具备MANUAL_RECORDING能力
  main_processing: 创建任务；确认未知身份风险；启动headed会话；控制和停止；密封bundle
  primary_output: 录制证据包和候选
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 录制证据包和候选
- scenario_id: PS-010
  scenario_name: 人工录制跨端流程
  initiator: 用例设计人员
  business_goal: 在同一受控会话中记录多Web终端流程
  primary_input: Runner可访问相关终端
  main_processing: 切换终端/Page/Context；记录动作和变量占位；密封跨端bundle
  primary_output: 跨端结构化候选
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 跨端结构化候选
- scenario_id: PS-011
  scenario_name: 人工录制并发例外
  initiator: 任务执行人员
  business_goal: 在不声明受管账号身份时启动录制
  primary_input: Runner槽位和真实资源可用
  main_processing: 不取得SSO/环境/账号锁；展示风险；保持其他任务不被抢占
  primary_output: 录制启动或资源阻断
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 录制启动或资源阻断
- scenario_id: PS-012
  scenario_name: 候选合并和标准用例发布
  initiator: 用例与资产版本审核人员
  business_goal: 把候选转为可执行正式版本
  primary_input: candidate有效；依赖和占位符可解析
  main_processing: 人工审阅；合并草稿；提交审核；发布事务校验
  primary_output: 已发布用例版本
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 已发布用例版本
- scenario_id: PS-013
  scenario_name: 用例套件发布
  initiator: 用例与资产版本审核人员
  business_goal: 组织多个已发布用例版本
  primary_input: 成员版本启用
  main_processing: 维护成员和依赖；DAG校验；发布套件版本
  primary_output: 已发布套件版本
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 已发布套件版本
- scenario_id: PS-014
  scenario_name: 执行计划创建和触发
  initiator: 测试负责人
  business_goal: 按手工、定时或事件规则创建任务
  primary_input: 套件、环境、账号模板合法
  main_processing: 创建计划修订；资格校验；触发创建执行根任务
  primary_output: 固化任务或拒绝原因
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 固化任务或拒绝原因
- scenario_id: PS-015
  scenario_name: 正式单端执行
  initiator: 任务执行人员
  business_goal: 确定性执行一个Web终端测试
  primary_input: 任务快照和Runner可用
  main_processing: 取得SSO租约；固定Runner；登录和数据准备；执行步骤；结果和最终化
  primary_output: 正式任务和用例结果
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 正式任务和用例结果
- scenario_id: PS-016
  scenario_name: 正式跨端执行和变量传递
  initiator: 任务执行人员
  business_goal: 完成管理端、客户端、PDA闭环
  primary_input: 跨端用例版本已发布
  main_processing: 固定Runner；按终端顺序执行；提取和复制上下文变量；聚合结果
  primary_output: 跨端用例结果
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 跨端用例结果
- scenario_id: PS-017
  scenario_name: 同账号任务互斥
  initiator: 调度服务
  business_goal: 防止受管SSO身份被多个活动任务同时使用
  primary_input: 已有活动租约
  main_processing: 原子取得租约；冲突重读；等待或阻断
  primary_output: 唯一holder或确定性冲突
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 唯一holder或确定性冲突
- scenario_id: PS-018
  scenario_name: 不同账号并行
  initiator: 调度服务
  business_goal: 在容量允许时并行不同身份任务
  primary_input: 不同sso_identity_key；Runner容量可用
  main_processing: 分别取得租约；分别调度Runner
  primary_output: 独立活动任务
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 独立活动任务
- scenario_id: PS-019
  scenario_name: 失败统一重试
  initiator: 调度服务
  business_goal: 在首轮结束后重试符合资格的Failed/Broken项
  primary_input: 首轮业务结果已确定
  main_processing: 计算资格；创建replacement attempt；依赖恢复；最终收口
  primary_output: 最终用例结果和重试链
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 最终用例结果和重试链
- scenario_id: PS-020
  scenario_name: 任务取消
  initiator: 任务执行人员
  business_goal: 停止根任务并受控清理
  primary_input: 任务非终态；具备取消权限
  main_processing: 提交取消；接受取消；停止未完成item；最终化和释放资源
  primary_output: CANCELLED任务
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: CANCELLED任务
- scenario_id: PS-021
  scenario_name: Runner异常恢复
  initiator: 调度服务
  business_goal: 处理浏览器崩溃或Runner失联
  primary_input: attempt执行中
  main_processing: 上报异常；停止陈旧写入；恢复或最终化；释放槽位
  primary_output: 恢复后的attempt或确定终态
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 恢复后的attempt或确定终态
- scenario_id: PS-022
  scenario_name: 模型调用和超时降级
  initiator: 平台服务
  business_goal: 稳定执行AI任务
  primary_input: 模型路由和凭证有效
  main_processing: 解析路由；调用网关；记录usage；按矩阵重试/降级
  primary_output: AI结果或明确失败
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: AI结果或明确失败
- scenario_id: PS-023
  scenario_name: 报告生成和查看
  initiator: 报告查看人员
  business_goal: 查看可追溯正式测试结果
  primary_input: FORMAL任务业务终态
  main_processing: 创建INITIAL请求；生成报告；权限裁剪；加载制品
  primary_output: 不可变报告版本
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 不可变报告版本
- scenario_id: PS-024
  scenario_name: 制品上传失败恢复
  initiator: 调度服务
  business_goal: 确保执行证据完整或明确降级
  primary_input: attempt已有待上传制品
  main_processing: 分片上传；checksum/扫描；重试恢复；最终化门禁
  primary_output: AVAILABLE或明确失败制品
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: AVAILABLE或明确失败制品
- scenario_id: PS-025
  scenario_name: 制品到期和Hold清理
  initiator: 平台管理员
  business_goal: 按保留政策清理允许数据
  primary_input: 保留期到期
  main_processing: 检查Hold和引用；创建清理批次；删除二进制；保留审计
  primary_output: 清理或阻断结果
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 清理或阻断结果
- scenario_id: PS-026
  scenario_name: 组件配置发布和健康投影
  initiator: 平台管理员
  business_goal: 受控接入第三方组件
  primary_input: 组件和Adapter已登记
  main_processing: 创建不可变配置；验收发布；健康检查；技术事件映射
  primary_output: 可用/降级组件配置
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 可用/降级组件配置
- scenario_id: PS-027
  scenario_name: 技术告警Webhook接入
  initiator: 外部可观测性告警发送主体
  business_goal: 把外部技术事件映射为平台告警
  primary_input: Endpoint已发布
  main_processing: 验签；租户派生；去重和序列检查；批次终态
  primary_output: 首次业务告警事件
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 首次业务告警事件
- scenario_id: PS-028
  scenario_name: 对象停用、归档和历史只读
  initiator: 项目负责人
  business_goal: 在不破坏历史的前提下退出对象
  primary_input: 无活动引用或满足门禁
  main_processing: 阻断新使用；传播依赖；保留历史快照和审计
  primary_output: 归档对象只读
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 归档对象只读
- scenario_id: PS-031
  scenario_name: 用户登录与会话授权
  initiator: 功能测试人员
  business_goal: 以平台用户身份建立受控会话并加载实时授权
  primary_input: 用户存在且ENABLED；安全状态NORMAL；凭证有效
  main_processing: 验证凭证；检查业务与安全状态；建立会话；加载系统角色、项目职责及active/history范围；记录登录审计
  primary_output: 受控平台会话或确定性拒绝原因
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 受控平台会话或确定性拒绝原因
- scenario_id: PS-032
  scenario_name: 测试数据资源配置
  initiator: 项目功能管理员
  business_goal: 维护数据类型、版本、资源池、变量和隔离分配
  primary_input: 具备项目配置权限；项目和环境有效
  main_processing: 定义Schema；创建数据版本或资源池修订；按独立权限发布；任务创建时分配并固化；执行后按策略回收
  primary_output: 可分配测试数据资源
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 可分配测试数据资源
- scenario_id: PS-033
  scenario_name: 用例复制、归档与删除
  initiator: 用例设计人员
  business_goal: 复制或归档用例并保护版本、执行和报告追溯
  primary_input: 具备用例维护权限；引用关系可查询
  main_processing: 复制时创建新主记录和草稿；归档前检查活动引用；保留不可变版本；禁止物理删除已有执行/报告引用的版本
  primary_output: 新草稿、归档结果或确定性阻断
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 新草稿、归档结果或确定性阻断
- scenario_id: PS-034
  scenario_name: 模型配置、审核与启用
  initiator: 模型管理员
  business_goal: 受控接入供应商、模型、路由、Prompt和凭证并经独立审核启用
  primary_input: 配置人与审核人职责分离；具备相应权限
  main_processing: 创建配置草稿；健康和权限检查；提交审核；审核人批准发布；路由按项目偏好选择；记录调用与费用
  primary_output: 已发布模型配置或审核拒绝
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 已发布模型配置或审核拒绝
- scenario_id: PS-035
  scenario_name: 敏感数据访问与审计
  initiator: 报告查看人员
  business_goal: 对凭证、变量、Prompt、响应、日志、制品和高风险操作实施最小授权、脱敏与审计
  primary_input: 具备独立查看/下载/凭证权限和项目数据范围
  main_processing: 识别敏感级别；校验权限与范围；输出脱敏视图或受控短期访问；禁止敏感变量进入日志报告；记录例外审计
  primary_output: 受控访问结果和不可变审计
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 受控访问结果和不可变审计
- scenario_id: PS-029
  scenario_name: Living Authority闭包与实现准入
  initiator: 验证服务
  business_goal: 以唯一当前 Living Authority 和机械校验结果控制实现准入
  primary_input: 当前 Authority 事实、引用、契约和 readiness 已闭包且正式 validators 可执行
  main_processing: 对当前 Living Authority 执行事实、引用、数据库、OpenAPI、权限、状态、场景和治理一致性校验；不生成或消费版本化冻结副本。
  primary_output: 实现准入判定与可追溯验证结果
  product_boundary: 该场景治理的是研发实现输入，不创建平台运行时“设计基线发布”业务对象；事实变化直接更新当前 Living Authority 并重新校验。
  success_result: 当前 Living Authority 通过实现准入 validators，或返回明确阻断原因
- scenario_id: PS-030
  scenario_name: 契约和验收反向验证
  initiator: 验证服务
  business_goal: 验证实现未偏离产品和业务事实
  primary_input: 代码和部署产物已生成
  main_processing: 运行数据库/OpenAPI/权限/状态/场景门禁；记录验证结果
  primary_output: 通过或阻断生产构建
  product_boundary: 由平台按权限、状态、并发、资源和审计规则编排；外部系统故障只形成测试证据。
  success_result: 通过或阻断生产构建
