conflicts:
- conflict_id: PCONF-001
  topic: 产品定位多义
  status: RESOLVED_BY_AUTHORITY
  final_decision: 唯一定位为AI驱动、Runner执行、事实治理的Web自动化测试执行平台；不是通用项目管理、低代码开发或被测业务运营平台。
- conflict_id: PCONF-002
  topic: Web终端与原生自动化
  status: RESOLVED_BY_SCOPE_SPLIT
  final_decision: 管理端、客户端和PDA端均为Web终端，当前统一使用Playwright；原生自动化排除。
- conflict_id: PCONF-003
  topic: 自然语言转换与AI探索
  status: SPLIT_AMBIGUOUS_REQUIREMENT
  final_decision: 转换不打开浏览器且不占Runner；AI探索打开浏览器并占Runner。
- conflict_id: PCONF-004
  topic: AI探索、人工录制与正式执行
  status: RESOLVED_BY_SCOPE_SPLIT
  final_decision: 三者为独立能力、独立对象和独立状态；候选路径不能替代正式执行。
- conflict_id: PCONF-005
  topic: 平台用户、测试账号与SSO身份
  status: RESOLVED_BY_SCOPE_SPLIT
  final_decision: 三者身份、生命周期、权限和并发用途分离。
- conflict_id: PCONF-006
  topic: 平台与Runner状态权威
  status: RESOLVED_BY_RESPONSIBILITY_SPLIT
  final_decision: 平台持有业务事实和最终状态；Runner仅执行并回传技术事件。
- conflict_id: PCONF-007
  topic: Runner永久绑定位置
  status: RESOLVED_BY_AUTHORITY
  final_decision: 永久项目绑定只在Runner中心维护；套件、计划和任务仅表达运行约束。
- conflict_id: PCONF-008
  topic: 正式执行并发与人工录制例外
  status: RESOLVED_BY_SCOPE_SPLIT
  final_decision: 正式执行使用SSO身份、环境和Runner租约；人工录制不使用账号互斥但仍受物理资源限制。
- conflict_id: PCONF-009
  topic: 平台与AI模型责任
  status: RESOLVED_BY_RESPONSIBILITY_SPLIT
  final_decision: AI生成候选和分析；平台负责权限、校验、版本、人工确认和持久化。
- conflict_id: PCONF-010
  topic: 第三方工具与业务事实源
  status: RESOLVED_BY_RESPONSIBILITY_SPLIT
  final_decision: 工具提供可替换技术能力，不得成为平台权限、状态、报告或业务事实源。
- conflict_id: PCONF-011
  topic: 报告与制品生命周期
  status: RESOLVED_BY_SCOPE_SPLIT
  final_decision: 报告元数据长期追溯与二进制制品按策略清理分离。
- conflict_id: PCONF-012
  topic: 当前版本与后续组件
  status: RESOLVED_BY_SCOPE_SPLIT
  final_decision: 第一版采用轻量平台编排和现有可观测能力；Temporal、LangGraph、Langfuse按后续可选实现管理。
