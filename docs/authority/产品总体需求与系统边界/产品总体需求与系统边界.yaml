permission_boundaries:
- boundary_id: PBND-001
  topic: 平台与被测系统权限分离
  rule: 平台权限只控制平台操作和数据；测试账号在被测系统中的业务权限由被测系统负责。
- boundary_id: PBND-002
  topic: 平台用户与测试账号分离
  rule: 平台用户用于登录和操作平台，测试账号用于被测系统登录，二者不得合并。
- boundary_id: PBND-003
  topic: 平台级与项目级权限
  rule: 超级管理员处理全局治理；平台管理员只在明确范围内处理平台事务；项目职责和数据范围限定在授权项目。
- boundary_id: PBND-004
  topic: 后端强制授权
  rule: 菜单和按钮可见性不能替代API、资源、职责、数据范围和审计校验。
- boundary_id: PBND-005
  topic: 敏感和高风险权限
  rule: 凭证、敏感制品、跨项目授权、提前清理和系统安全配置必须使用独立权限并记录审计。
- boundary_id: PBND-006
  topic: 非人工主体
  rule: Runner Agent、AI模型和系统服务不是人工角色，不分配菜单权限，只使用服务身份和最小技术权限。
execution_boundaries:
- execution_type: 自然语言转换
  browser_required: false
  runner_required: false
  account_binding: 不需要被测系统登录
  input: 自然语言用例修订
  output: 结构化候选草稿
  formal_record: false
  boundary: 必须校验并经人工确认后才能进入正式用例版本。
- execution_type: AI页面探索
  browser_required: true
  runner_required: true
  account_binding: 使用已配置测试账号或获准登录前置
  input: 用例意图、环境、终端、账号和模型配置
  output: 探索候选、定位器、断言建议和证据
  formal_record: false
  boundary: 与正式执行不同；冲突时不得静默绕过SSO租约。
- execution_type: 人工业务流程录制
  browser_required: true
  runner_required: true
  account_binding: 不强制绑定平台测试账号或SSO身份
  input: 测试人员在受控浏览器中的真实操作
  output: 录制会话、证据包和结构化候选
  formal_record: false
  boundary: 平台无法预知手工身份，不执行账号并发前置阻断，但仍校验Runner物理资源。
- execution_type: 正式执行
  browser_required: true
  runner_required: true
  account_binding: 使用任务快照中的测试账号、凭证版本和SSO身份
  input: 已发布用例或套件版本及执行配置快照
  output: 正式任务、尝试、结果、报告和制品
  formal_record: true
  boundary: 遵守权限、锁、租约、并发、取消、中止、重试和恢复规则。
concurrency_boundaries:
- boundary_id: CBND-001
  topic: 正式执行账号互斥
  rule: 同一项目、环境和SSO身份同时只能有一个持有根级身份租约的活动正式或受控账号任务。
- boundary_id: CBND-002
  topic: 不同身份并行
  rule: 同一环境下不同SSO身份可在Runner容量和其他资源条件允许时并行。
- boundary_id: CBND-003
  topic: 环境锁
  rule: 只读诊断使用共享锁；正式写入默认使用排他锁；环境锁与账号租约、Runner资源租约相互独立。
- boundary_id: CBND-004
  topic: Runner资源租约
  rule: 任务仅在取得匹配Runner执行槽位和资源租约后派发；租约续期、过期和释放受平台治理。
- boundary_id: CBND-005
  topic: 人工录制例外
  rule: 人工录制不取得正式账号/SSO租约或环境锁，不因账号或环境已有任务而前置阻止；仍受Runner真实槽位、设备、文件和测试数据资源约束。
- boundary_id: CBND-006
  topic: AI探索冲突
  rule: AI探索与正式任务使用同一SSO身份发生冲突时，平台进入等待、阻断或授权确认流程，不得静默绕过。
global_constraints:
- constraint_id: GC-001
  statement: 系统首次初始化在单一幂等事务中创建默认admin用户、唯一SUPER_ADMIN角色和不可撤销绑定。
- constraint_id: GC-002
  statement: admin不可删除、停用、归档、改名或解除SUPER_ADMIN绑定。
- constraint_id: GC-003
  statement: 其他用户必须由管理员创建并至少分配一个有效系统角色后才能登录。
- constraint_id: GC-004
  statement: 平台用户、测试账号和SSO身份是三个不同对象。
- constraint_id: GC-005
  statement: 管理端、客户端和PDA端均为Web系统页面，统一优先使用Playwright Web方案。
- constraint_id: GC-006
  statement: 自然语言转换不打开浏览器且不占用Runner。
- constraint_id: GC-007
  statement: AI页面探索必须使用受控浏览器和Runner，并只产生候选。
- constraint_id: GC-008
  statement: 人工业务流程录制是当前版本独立正式能力，支持单端和跨端。
- constraint_id: GC-009
  statement: 人工录制不强制绑定平台测试账号、账号映射、账号快照、SSO身份键或凭证版本。
- constraint_id: GC-010
  statement: 人工录制不因环境或账号存在正式任务而前置阻止，但不得抢占已有任务并必须校验Runner物理资源。
- constraint_id: GC-011
  statement: 正式执行必须使用已发布或已确认的结构化用例版本及不可变任务快照。
- constraint_id: GC-012
  statement: 同一正式执行尝试固定在一台Runner上；跨端只切换逻辑终端。
- constraint_id: GC-013
  statement: Runner绑定项目后不可同时绑定其他项目；一个项目可绑定多个Runner。
- constraint_id: GC-014
  statement: 加密API场景默认由UI触发并通过Playwright监听响应获取业务数据。
- constraint_id: GC-015
  statement: 静态资源不得默认作为业务完成等待条件。
- constraint_id: GC-016
  statement: 第一版正式根任务内部串行执行，不启用根内并行或阶段级跨Runner。
- constraint_id: GC-017
  statement: 符合资格的Failed/Broken用例在首轮结束后统一重试；主动跳过不进入重试。
- constraint_id: GC-018
  statement: 初次执行、重试和最终结果必须分别可追溯。
- constraint_id: GC-019
  statement: 报告元数据与二进制制品生命周期可以不同。
- constraint_id: GC-020
  statement: 制品默认保留30天，项目可配置7至180天；失败制品可延长至90天，长期保留制品不参与自动清理。
- constraint_id: GC-021
  statement: 项目删除先进入归档，不立即物理删除历史报告和制品；所有清理必须审计。
- constraint_id: GC-022
  statement: AI输出未经校验和必要人工确认不得成为正式事实或已发布资产。
- constraint_id: GC-023
  statement: Runner、AI模型和第三方工具不得自行改变平台正式业务事实。
- constraint_id: GC-024
  statement: 敏感凭证只以受控引用使用，日志、报告、导出和制品访问必须执行权限与脱敏。
- constraint_id: GC-025
  statement: 高风险业务事务的审计写入失败时，相关业务事务必须回滚。
non_functional_requirements:
- requirement_id: PRD-NFR-001
  requirement_name: 控制面可用性
  requirement_type: NON_FUNCTIONAL
  statement: V1生产环境控制面月度可用率不得低于99.5%；提前公告的计划维护窗口不计入可用率；开发环境和测试环境不作为正式SLA考核对象。
  capability_domain: CAPDOM-12
  primary_users:
  - 模型管理员
  - 模型版本审核人员
  - 平台管理员
  current_scope: IN_SCOPE_APPROVED
  priority: P1
  business_value: 隔离第三方技术能力与平台业务事实，降低供应商和实现耦合。
  input: 由授权主体、系统事件或运行依赖提供与本需求相符的输入。
  output: 产生可审计的业务对象、状态、结果、证据或明确阻断原因。
  product_boundary: 仅在平台职责和当前范围内成立，不替代被测系统或第三方工具职责。
  acceptance_direction: 按自然月统计生产控制面可用分钟数；以外部探针和服务端健康指标双源取证；剔除已公告维护窗口；月度可用率必须≥99.5%。
  downstream_impact: 约束系统架构、部署、可观测性、安全和验收设计。
  source_status: USER_CONFIRMED_2026-08-06
  blocking_current_release: true
  calibration_class: CURRENT_V1_SLO
  slo_contract:
    metric: control_plane_monthly_availability
    target: 0.995
    window: CALENDAR_MONTH
    environment: PRODUCTION
    exclusions:
    - ANNOUNCED_PLANNED_MAINTENANCE
    evidence:
    - synthetic_probe_timeseries
    - service_health_timeseries
    - maintenance_window_registry
  scope_status: IN_SCOPE_APPROVED
  approval_status: APPROVED
- requirement_id: PRD-NFR-002
  requirement_name: API响应时延
  requirement_type: NON_FUNCTIONAL
  statement: 在标准V1容量和正常网络条件下，普通查询P95≤500ms、P99≤1000ms；普通写入P95≤800ms、P99≤1500ms；异步命令受理P95≤300ms、P99≤800ms。文件上传下载、AI模型调用和浏览器执行不适用普通API指标，必须使用各自专用超时与性能验收规则。
  capability_domain: CAPDOM-12
  primary_users:
  - 模型管理员
  - 模型版本审核人员
  - 平台管理员
  current_scope: IN_SCOPE_APPROVED
  priority: P1
  business_value: 隔离第三方技术能力与平台业务事实，降低供应商和实现耦合。
  input: 由授权主体、系统事件或运行依赖提供与本需求相符的输入。
  output: 产生可审计的业务对象、状态、结果、证据或明确阻断原因。
  product_boundary: 仅在平台职责和当前范围内成立，不替代被测系统或第三方工具职责。
  acceptance_direction: 在标准V1容量、正常网络、稳定预热后分别对普通查询、普通写入和异步命令受理采集不少于10000个有效样本；按服务端端到端时延计算P95/P99；专用长任务不得混入普通API统计。
  downstream_impact: 约束系统架构、部署、可观测性、安全和验收设计。
  source_status: USER_CONFIRMED_2026-08-06
  blocking_current_release: true
  calibration_class: CURRENT_V1_SLO
  slo_contract:
    conditions:
    - STANDARD_V1_CAPACITY
    - NORMAL_NETWORK
    - WARMED_UP
    sample_minimum: 10000
    metrics:
      ordinary_query_ms:
        p95: 500
        p99: 1000
      ordinary_write_ms:
        p95: 800
        p99: 1500
      async_command_accept_ms:
        p95: 300
        p99: 800
    excluded_categories:
    - FILE_TRANSFER
    - AI_MODEL_CALL
    - BROWSER_EXECUTION
  scope_status: IN_SCOPE_APPROVED
  approval_status: APPROVED
- requirement_id: PRD-NFR-003
  requirement_name: 任务派发时延
  requirement_type: NON_FUNCTIONAL
  statement: 当存在健康、已绑定、能力匹配的空闲Runner，且无环境锁、账号租约和资源冲突时，任务从进入可调度状态到Runner成功领取的时延必须满足P95≤3秒、P99≤10秒。
  capability_domain: CAPDOM-12
  primary_users:
  - 模型管理员
  - 模型版本审核人员
  - 平台管理员
  current_scope: IN_SCOPE_APPROVED
  priority: P1
  business_value: 隔离第三方技术能力与平台业务事实，降低供应商和实现耦合。
  input: 由授权主体、系统事件或运行依赖提供与本需求相符的输入。
  output: 产生可审计的业务对象、状态、结果、证据或明确阻断原因。
  product_boundary: 仅在平台职责和当前范围内成立，不替代被测系统或第三方工具职责。
  acceptance_direction: 构造健康且能力匹配的空闲Runner、无锁租约冲突的标准调度场景，采集不少于5000次从SCHEDULABLE到CLAIMED的服务端时钟差；P95≤3秒且P99≤10秒。
  downstream_impact: 约束系统架构、部署、可观测性、安全和验收设计。
